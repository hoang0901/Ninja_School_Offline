name: Inspect offline pack key scheme
on:
  push:
    branches: [fix-obito-sakura-final-v2]
    paths: ['.github/workflows/patch-obito-sakura-assets-final.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump k1e normalization and callers
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/k1e_key_report.txt"
          exec > >(tee "$LOG") 2>&1
          rm -rf /tmp/jar && mkdir /tmp/jar && (cd /tmp/jar && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar")
          cd /tmp/jar
          echo '=== k1e verbose ==='
          javap -classpath . -c -p -verbose k1e
          echo '=== classes directly referencing k1e ==='
          grep -aFl 'k1e' *.class | while read c; do echo "===== ${c%.class} ====="; javap -classpath . -c -p "${c%.class}" | grep -n -B70 -A100 'k1e' | head -n 1400 || true; done
          echo '=== normalization probes ==='
          cat >/tmp/P.java <<'JAVA'
          import java.lang.reflect.*;
          public class P{public static void main(String[]a)throws Exception{Class<?>c=Class.forName("k1e");Method n=c.getDeclaredMethod("normalize",String.class),h=c.getDeclaredMethod("hash",String.class),e=c.getDeclaredMethod("ensureIndex"),f=c.getDeclaredMethod("findIndex",String.class);n.setAccessible(true);h.setAccessible(true);e.setAccessible(true);f.setAccessible(true);e.invoke(null);String[]ps={"Data/Img/Effect/1/230.png","/Data/Img/Effect/1/230.png","offline/Data/Img/Effect/1/230.png","/offline/Data/Img/Effect/1/230.png","/offline/full/item.dat","offline/full/item.dat","/offline/effect/1/230.png","/offline/img/effect/1/230.png"};for(String p:ps){Object q=n.invoke(null,p);System.out.print(p+" => "+q);if(q!=null)System.out.print(" hash="+h.invoke(null,q)+" idx="+f.invoke(null,q));System.out.println();}}}
          JAVA
          javac -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" /tmp/P.java
          java -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar:/tmp" P
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k1e_key_report.txt
          git commit -m 'chore: inspect offline resource key scheme' || exit 0
          git push origin fix-obito-sakura-final-v2
