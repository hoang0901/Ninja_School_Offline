name: Focus Class_et menu init
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-main-find-login.yml]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dump menu init
        shell: bash
        run: |
          set -euo pipefail
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          rm -rf /tmp/etfocus && mkdir -p /tmp/etfocus
          cd /tmp/etfocus
          javap -classpath "$J" -p -c Class_et > code.txt
          {
            echo '=== r/v writes ==='
            grep -n -B45 -A110 -E 'putstatic +#97 +// Field r:|putstatic +#101 +// Field v:' code.txt || true
            echo '=== command codes around menu init ==='
            grep -n -B20 -A30 -E 'sipush +1000|sipush +1001|sipush +1002|sipush +1003|sipush +1004' code.txt || true
          } > "$GITHUB_WORKSPACE/class_et_menu_init.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- class_et_menu_init.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: dump Class_et menu initializer'
          git push origin main
