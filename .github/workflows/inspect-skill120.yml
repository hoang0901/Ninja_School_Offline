name: Dump skill book mapper bytecode
on:
  push:
    branches: [fix-skill120-learning]
    paths: ['.github/workflows/inspect-skill120.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump k mapper
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/skill120_kmapper.txt"
          rm -rf /tmp/jar && mkdir /tmp/jar && (cd /tmp/jar && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar")
          cd /tmp/jar
          javap -classpath . -c -p k25 | awk '/private static int k\(int, int\);/{p=1} p{print} p && /^  [^ ]/ && !/private static int k\(int, int\);/ && seen{exit} p{seen=1}' > "$LOG" || true
          cat "$LOG"
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_kmapper.txt
          git commit -m 'chore: dump skill book mapper bytecode' || exit 0
          git push origin fix-skill120-learning
