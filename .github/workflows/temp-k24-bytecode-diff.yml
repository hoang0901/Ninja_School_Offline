name: Temporary k24 bytecode diff

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-k24-bytecode-diff.yml]

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff k24 pre/post lv120
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=15094ae1953e93b6c3a8ceb26aa3ef350dafc674
          git show "$BEFORE:Nso_Offline_By_h0901.jar" > /tmp/before.jar
          javap -classpath /tmp/before.jar -c -p k24 > /tmp/k24_before.txt
          javap -classpath Nso_Offline_By_h0901.jar -c -p k24 > /tmp/k24_after.txt
          diff -u /tmp/k24_before.txt /tmp/k24_after.txt > k24_bytecode_diff.txt || true
          {
            echo '=== BEFORE ==='
            cat /tmp/k24_before.txt
            echo '=== AFTER ==='
            cat /tmp/k24_after.txt
          } > k24_full_compare.txt
      - name: Commit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k24_bytecode_diff.txt k24_full_compare.txt
          git commit -m "chore: temporary k24 bytecode diff"
          git push
