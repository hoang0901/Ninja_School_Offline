name: Trace skill 120 learned check 1125-1130
on:
  push:
    branches: [fix-skill120-1125-1130]
    paths: ['.github/workflows/fix-skill120-1125-1130.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace check and persistence paths
        shell: bash
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          WORK=/tmp/skill120check
          LOG="$GITHUB_WORKSPACE/skill120_check_trace.txt"
          exec > >(tee "$LOG") 2>&1
          rm -rf "$WORK" && mkdir -p "$WORK/jar"
          (cd "$WORK/jar" && jar xf "$JAR")
          cd "$WORK/jar"
          echo '=== STRINGS related learned/unlearned ==='
          for c in *.class; do
            s=$(strings "$c" | grep -Ei 'chưa học|chua hoc|đã học|da hoc|Chiêu này đã học|kỹ năng này|skill.*learn|learn.*skill|CSkill|KSkill|OSkill' || true)
            if [ -n "$s" ]; then echo "===== ${c%.class} ====="; echo "$s"; fi
          done
          echo '=== BYTECODE classes with learned/unlearned strings ==='
          for c in *.class; do
            if strings "$c" | grep -Eqi 'chưa học|Chiêu này đã học|CSkill|KSkill|OSkill'; then
              echo "===== ${c%.class} ====="
              javap -classpath . -c -p "${c%.class}" | grep -n -B120 -A240 -Ei 'chưa học|Chiêu này đã học|CSkill|KSkill|OSkill' | head -n 3500 || true
            fi
          done
          echo '=== k25 methods touching learned arrays bE/bF ==='
          javap -classpath . -c -p -verbose k25 | grep -n -B60 -A140 -E 'DoHoang091\$k0\.bE|DoHoang091\$k0\.bF' | head -n 9000 || true
          echo '=== k0 persistence methods touching bE/bF ==='
          javap -classpath . -c -p -verbose k0 | grep -n -B80 -A180 -E 'DoHoang091\$k0\.bE|DoHoang091\$k0\.bF' | head -n 9000 || true
          echo '=== state serializer ==='
          javap -classpath . -c -p -verbose 'DoHoang091$k0' | grep -n -B60 -A160 -E 'bE|bF|bG' | head -n 7000 || true
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_check_trace.txt || true
          git commit -m 'chore: trace skill 120 learned check' || exit 0
          git push origin fix-skill120-1125-1130
