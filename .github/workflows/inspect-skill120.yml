name: Inspect skill 120 exact mapping
on:
  push:
    branches: [fix-skill120-learning]
    paths: ['.github/workflows/inspect-skill120.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact source skill 120 flow
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/skill120_exact.txt"
          exec > >(tee "$LOG") 2>&1
          git clone --depth 1 https://github.com/hoang0901/Nso_Folder.git /tmp/ref >/dev/null 2>&1
          ROOT=/tmp/ref/NinjaSchoolOffline_by_dohoang091
          echo '=== Char.learnSkill 7280-7460 ==='
          sed -n '7280,7460p' "$ROOT/src/main/java/Exe_Z/model/Char.java"
          echo '=== Char surrounding useItem calls 3540-3620 ==='
          sed -n '3540,3620p' "$ROOT/src/main/java/Exe_Z/model/Char.java"
          echo '=== Char surrounding second learnSkill 4890-4980 ==='
          sed -n '4890,4980p' "$ROOT/src/main/java/Exe_Z/model/Char.java"
          echo '=== GameData skill loading/template APIs ==='
          sed -n '150,380p' "$ROOT/src/main/java/Exe_Z/server/GameData.java"
          echo '=== Skill.java ==='
          cat "$ROOT/src/main/java/Exe_Z/skill/Skill.java"
          echo '=== SkillTemplate.java ==='
          cat "$ROOT/src/main/java/Exe_Z/skill/SkillTemplate.java"
          echo '=== item rows likely skill books level 120 ==='
          grep -nE "Sách.*120|sách.*120|võ công.*120|Võ công.*120" "$ROOT/SQL/nsoz.sql" | head -n 150 || true
          echo '=== all item rows around 1177-1190 ==='
          grep -nE '^\((1177|1178|1179|1180|1181|1182|1183|1184|1185|1186|1187|1188|1189|1190),' "$ROOT/SQL/nsoz.sql" | head -n 100 || true
          echo '=== configs referencing SACH_VO_CONG_120 ==='
          grep -RIn -E 'SACH_VO_CONG_120|1177|1178|1179|1180|1181|1182|1183|1184|1185|1186|1187|1188|1189|1190' "$ROOT" --exclude='nsoz.sql' | head -n 500 || true
          echo '=== sql schema/table lines for skill ==='
          grep -nEi 'CREATE TABLE.*skill|INSERT INTO.*skill|skill_template|skilltemplate|nclass' "$ROOT/SQL/nsoz.sql" | head -n 120 || true
          echo '=== skill-related config files ==='
          find "$ROOT" -type f | grep -Ei 'skill|class|nclass' | head -n 300 || true
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_exact.txt || true
          git commit -m 'chore: inspect exact skill 120 mapping' || exit 0
          git push origin fix-skill120-learning
