name: Temporary cleanup fake class files
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-run-fake-class-patch-v2.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audit and workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f audit_*.txt fake_class_audit.txt fake_build_debug.txt
          rm -f .github/workflows/temp-audit-fake-class-menu.yml
          rm -f .github/workflows/temp-add-fake-class-menu.yml
          rm -f .github/workflows/temp-debug-fake-class-build.yml
          rm -f .github/workflows/temp-run-fake-class-patch-v2.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove fake class temporary files"
          git push
