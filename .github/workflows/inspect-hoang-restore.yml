name: Inspect hoang restore data
on:
  push:
    branches: [chatgpt/restore-hoang-sword-129]
    paths: [.github/workflows/inspect-hoang-restore.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect VIP and current jar
        shell: bash
        run: |
          set -u
          git show 0bc8735629cf34d22bf0ebec6f14dd6ac8a02ef3:Nso_Offline_By_h0901.jar > /tmp/vip.jar
          cp Nso_Offline_By_h0901.jar /tmp/current.jar
          {
            echo '=== OLD VIP JAR ==='; sha256sum /tmp/vip.jar
            echo '=== CURRENT JAR ==='; sha256sum /tmp/current.jar
            echo '=== OLD VIP SEED ==='
            jar tf /tmp/vip.jar | grep -Ei 'admin_seed|seed|rms' || true
            unzip -p /tmp/vip.jar offline/admin_seed.rms >/tmp/oldseed 2>/dev/null || true
            [ -s /tmp/oldseed ] && { wc -c /tmp/oldseed; xxd -g1 -l 2048 /tmp/oldseed; } || true
            echo '=== CURRENT SEED ==='
            unzip -p /tmp/current.jar offline/admin_seed.rms >/tmp/curseed 2>/dev/null || true
            [ -s /tmp/curseed ] && { wc -c /tmp/curseed; xxd -g1 -l 2048 /tmp/curseed; } || true
            echo '=== OLD VIP DoHoang091 relevant bytecode ==='
            javap -classpath /tmp/vip.jar -p -c DoHoang091 2>&1 | grep -n -B30 -A260 -E 'zHoangVipStarter|admin_seed|DoHoang091\.ar|DoHoang091\.ap|Field bx|Field p:|Field q:|Field r:' | head -n 5000 || true
            echo '=== CURRENT DoHoang091 relevant bytecode ==='
            javap -classpath /tmp/current.jar -p -c DoHoang091 2>&1 | grep -n -B30 -A260 -E 'zHoangVipStarter|admin_seed|DoHoang091\.ar|DoHoang091\.ap|Field bx|Field p:|Field q:|Field r:' | head -n 5000 || true
            echo '=== OLD VIP k0 bytecode ==='
            javap -classpath /tmp/vip.jar -p -c 'DoHoang091$k0' 2>&1 | head -n 6000 || true
          } > hoang_restore_inspect.txt
          git add -- hoang_restore_inspect.txt
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'chore: capture hoang restore inspection' || true
          git push origin HEAD:chatgpt/restore-hoang-sword-129 || true
