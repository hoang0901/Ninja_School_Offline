name: Temporary map native trade UI
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-native-trade-map.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map exact trade UI methods
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tmap && mkdir -p /tmp/tmap/out /tmp/tmap/report
          cd /tmp/tmap
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          for c in Class_ct Class_cy Class_gd Class_by Class_ew; do
            unzip -p game.jar "$c.class" > "$c.class"
            java -jar cfr.jar "$c.class" --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          done
          {
            echo '=== references to trade UI localized fields ==='
            grep -n -B160 -A260 -E 'Class_gd\.(fv|pw|doa|el)|Xu.*gửi|trao.*đổi|Hành Trang' out/Class_ct.java out/Class_cy.java out/Class_by.java out/Class_ew.java || true
            echo '=== all Class_gd refs near item arrays ==='
            grep -n -B120 -A220 -E 'Class_gd\.|Class_fj\[|Class_cy\.dc|Class_ct\.bz' out/Class_ct.java | grep -E '(^[0-9]+-|Class_gd\.|Class_fj|Class_cy\.dc|Class_ct\.bz|void |boolean |int |Class_dw)' | head -30000 || true
          } > report/trade_map.txt
          git -C "$GITHUB_WORKSPACE" checkout chatgpt/native-catalog-inventory-ui
          rm -rf "$GITHUB_WORKSPACE/native_trade_map"
          cp -r report "$GITHUB_WORKSPACE/native_trade_map"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native_trade_map
          git diff --cached --quiet || git commit -m "chore: map exact native trade UI"
          git push origin HEAD:chatgpt/native-catalog-inventory-ui
      - name: Cleanup temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main
          git rm -- .github/workflows/temp-native-trade-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary native trade map workflow"
          git push origin main
