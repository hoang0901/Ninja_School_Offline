name: Inspect offline skill persistence helpers
on:
  push:
    branches: [fix-skill120-learning]
    paths: ['.github/workflows/inspect-skill120.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump k25 k24 and state
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/skill120_persist.txt"
          exec > >(tee "$LOG") 2>&1
          rm -rf /tmp/jar && mkdir /tmp/jar && (cd /tmp/jar && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar")
          cd /tmp/jar
          echo '=== K25 ==='
          javap -classpath . -c -p -verbose k25
          echo '=== K24 ==='
          javap -classpath . -c -p -verbose k24
          echo '=== STATE ==='
          javap -classpath . -c -p 'DoHoang091$k0'
          echo '=== DOHOANG SKILL SIGNATURES ==='
          javap -classpath . -p DoHoang091 | grep -n -Ei 'skill|\[S|\[I|short|int|boolean' | head -n 1200 || true
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_persist.txt || true
          git commit -m 'chore: inspect offline skill persistence helpers' || exit 0
          git push origin fix-skill120-learning
