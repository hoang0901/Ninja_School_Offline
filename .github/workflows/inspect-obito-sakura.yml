name: Patch Obito Sakura resources

on:
  push:
    branches: [fix-obito-sakura]
    paths:
      - '.github/workflows/inspect-obito-sakura.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-obito-sakura
          path: offline
      - uses: actions/checkout@v4
        with:
          repository: hoang0901/Nso_Folder
          ref: main
          path: source

      - name: Add and validate missing disguise sprites
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          OFF="$GITHUB_WORKSPACE/offline"
          exec > >(tee "$OFF/patch_obito_sakura.log") 2>&1
          SRC="$GITHUB_WORKSPACE/source/NinjaSchoolOffline_by_dohoang091"
          WORK="$RUNNER_TEMP/nso_patch"
          JAR="$OFF/Nso_Offline_By_h0901.jar"
          mkdir -p "$WORK/jar/offline/x1/small" "$WORK/validate"
          (cd "$WORK/jar" && jar xf "$JAR")

          echo 'Copying Obito/Sakura model sprites Small2715-Small2770 from Nso_Folder...'
          ADD=()
          for id in $(seq 2715 2770); do
            src="$SRC/Data/Img/Small/1/Small${id}.png"
            [ -f "$src" ] || src="$SRC/Data/Img/Small/1/Small${id}.PNG"
            [ -f "$src" ] || { echo "Missing source Small${id}"; exit 1; }
            dst="offline/x1/small/Small${id}.png"
            cp "$src" "$WORK/jar/$dst"
            ADD+=("$dst")
          done
          (cd "$WORK/jar" && jar uf "$JAR" "${ADD[@]}")

          echo 'Validating using k2.a(String), the complete offline image loader...'
          cat > "$WORK/validate/ValidateK2.java" <<'JAVA'
          import java.lang.reflect.*;
          import java.security.*;
          public class ValidateK2 {
            static String sha(byte[] b)throws Exception{
              byte[] h=MessageDigest.getInstance("SHA-256").digest(b);
              StringBuilder s=new StringBuilder();
              for(byte x:h)s.append(String.format("%02x",x));
              return s.toString();
            }
            public static void main(String[] args)throws Exception{
              Class<?> c=Class.forName("k2");
              Method r=c.getDeclaredMethod("a",String.class);
              r.setAccessible(true);
              for(String s:args){
                int id=Integer.parseInt(s);
                String p="/offline/x1/small/Small"+id+".png";
                byte[] b=(byte[])r.invoke(null,p);
                if(b==null)throw new RuntimeException("missing Small"+id);
                System.out.println(id+","+b.length+","+sha(b));
              }
            }
          }
          JAVA
          IDS=$(seq 2715 2770)
          (cd "$WORK/validate" && javac -classpath "$JAR" ValidateK2.java && java -classpath "$JAR:." ValidateK2 $IDS) > "$WORK/actual.csv"

          ACT="$WORK/actual.csv" SRCROOT="$SRC" python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          actual={int(a):h for a,l,h in (x.split(',') for x in Path(os.environ['ACT']).read_text().splitlines())}
          src=Path(os.environ['SRCROOT'])/'Data'/'Img'/'Small'/'1'
          bad=[]
          for i in range(2715,2771):
              f=src/f'Small{i}.png'
              if not f.exists(): f=src/f'Small{i}.PNG'
              want=hashlib.sha256(f.read_bytes()).hexdigest()
              if actual.get(i)!=want: bad.append((i,actual.get(i),want))
          if bad: raise SystemExit('Validation mismatch: '+repr(bad))
          print('VALIDATION_OK: 56/56 Obito/Sakura model sprites match Nso_Folder')
          PY

          jar tf "$JAR" >/dev/null
          for id in 2715 2732 2741 2743 2760 2770; do
            jar tf "$JAR" | grep -qx "offline/x1/small/Small${id}.png"
          done
          echo "JAR_OK size=$(stat -c %s "$JAR")"

      - name: Commit patched JAR and log
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/offline"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patch_obito_sakura.log
          if [ "${{ steps.patch.outcome }}" = "success" ]; then
            git add Nso_Offline_By_h0901.jar
            MSG='fix: add missing Obito and Sakura disguise model sprites'
          else
            MSG='chore: record Obito Sakura patch failure'
          fi
          git commit -m "$MSG" || exit 0
          git push origin fix-obito-sakura
