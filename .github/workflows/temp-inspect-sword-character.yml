name: Inspect sword character data
on:
  push:
    branches: [chatgpt/sword-strongest-character]
    paths: [.github/workflows/temp-inspect-sword-character.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sword-strongest-character
          fetch-depth: 0
      - name: Inspect character and item structures
        shell: bash
        run: |
          set -euo pipefail
          echo rerun
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          rm -rf /tmp/swordinspect && mkdir -p /tmp/swordinspect
          cd /tmp/swordinspect
          jar tf "$J" > entries.txt
          {
            echo '=== DoHoang091 signature ==='
            javap -classpath "$J" -p DoHoang091 2>/dev/null || true
            echo '=== DoHoang091 nested classes ==='
            grep '^DoHoang091.*\.class$' entries.txt
            for c in $(grep '^DoHoang091.*\.class$' entries.txt | sed 's/\.class$//'); do
              echo "##### $c #####"
              javap -classpath "$J" -p -c "$c" 2>/dev/null || true
            done
            echo '=== item classes signatures ==='
            for c in Class_fe Class_fj Class_dn Class_ct; do
              echo "##### $c #####"; javap -classpath "$J" -p "$c" 2>/dev/null || true
            done
          } > "$GITHUB_WORKSPACE/sword_character_inspect.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- sword_character_inspect.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect character and item data'
          git push origin HEAD:chatgpt/sword-strongest-character