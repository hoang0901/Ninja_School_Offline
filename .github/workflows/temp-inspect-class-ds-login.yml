name: Inspect login controller
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-class-ds-login.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract Class_ds login flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dsinspect && mkdir -p /tmp/dsinspect/out
          cd /tmp/dsinspect
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar game.jar --outputdir out >/dev/null 2>&1 || true
          {
            echo '=== Class_ds strings/login/menu/network refs ==='
            grep -n -E -B18 -A35 'Đăng|Dang|login|Login|Tài khoản|Tai khoan|Mật khẩu|Mat khau|Class_ew\.ai|Class_bc|Class_dw|Class_gd|connect|register|create|server|nhân vật|nhan vat' out/Class_ds.java | head -n 2400 || true
            echo
            echo '=== Class_ds constructor + public methods ==='
            grep -n -E '^    (public|private|protected|static|final).*\(' out/Class_ds.java | head -n 500 || true
          } > ds_login_focus.txt
          cp out/Class_ds.java Class_ds.java.txt
          cp ds_login_focus.txt "$GITHUB_WORKSPACE/ds_login_focus.txt"
          cp Class_ds.java.txt "$GITHUB_WORKSPACE/Class_ds.java.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- ds_login_focus.txt Class_ds.java.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: capture login controller source'
          git push origin main
