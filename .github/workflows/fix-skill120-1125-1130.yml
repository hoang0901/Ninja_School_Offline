name: Inspect correct point lookup helper
on:
  push:
    branches: [fix-skill120-1125-1130]
    paths: ['.github/workflows/fix-skill120-1125-1130.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump k25 point helper
        shell: bash
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          LOG="$GITHUB_WORKSPACE/skill120_point_helper.txt"
          rm -rf /tmp/s120h && mkdir /tmp/s120h && (cd /tmp/s120h && jar xf "$JAR")
          cd /tmp/s120h
          javap -classpath . -c -p k25 > /tmp/k25.txt
          {
            echo '=== private static int a(k24,int) ==='
            awk '/private static int a\(k24, int\);/{p=1} p{print} p&&/^  [^ ]/&&seen&&!/private static int a\(k24, int\);/{exit} p{seen=1}' /tmp/k25.txt
            echo '=== all calls to helper ==='
            grep -n -B30 -A80 'Method a:(Lk24;I)I' /tmp/k25.txt | head -n 4000 || true
          } > "$LOG"
          cat "$LOG"
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_point_helper.txt || true
          git commit -m 'chore: inspect correct skill point lookup helper' || exit 0
          git push origin fix-skill120-1125-1130
