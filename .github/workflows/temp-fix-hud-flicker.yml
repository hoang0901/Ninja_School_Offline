name: Temporary fix HUD flicker
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-fix-hud-flicker.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch redundant HUD reset only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hudfix && mkdir -p /tmp/hudfix && cd /tmp/hudfix
          unzip -p "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" Class_by.class > Class_by.class
          cat > PatchHudFlicker.java <<'EOF'
          import java.nio.file.*;
          import jdk.internal.org.objectweb.asm.*;
          import jdk.internal.org.objectweb.asm.tree.*;
          import java.util.*;

          public class PatchHudFlicker {
            static AbstractInsnNode nextReal(AbstractInsnNode n) {
              for (n=n.getNext(); n!=null; n=n.getNext()) {
                if (!(n instanceof LabelNode) && !(n instanceof LineNumberNode) && !(n instanceof FrameNode)) return n;
              }
              return null;
            }
            public static void main(String[] args) throws Exception {
              byte[] in=Files.readAllBytes(Paths.get("Class_by.class"));
              ClassNode cn=new ClassNode();
              new ClassReader(in).accept(cn,0);
              int patched=0;
              for (MethodNode mn: cn.methods) {
                for (AbstractInsnNode n=mn.instructions.getFirst(); n!=null; n=n.getNext()) {
                  if (!(n instanceof MethodInsnNode)) continue;
                  MethodInsnNode call=(MethodInsnNode)n;
                  if (call.getOpcode()!=Opcodes.INVOKEVIRTUAL || !call.owner.equals("Class_ct") || !call.name.equals("at") || !call.desc.equals("()V")) continue;

                  // Confirm this exact at() call belongs to the Class_cy.gc packet handler:
                  // within the next 12 real instructions there must be PUTFIELD Class_cy.gc:Z.
                  AbstractInsnNode q=n; boolean hasGcPut=false;
                  for (int i=0;i<12;i++) {
                    q=nextReal(q); if (q==null) break;
                    if (q instanceof FieldInsnNode) {
                      FieldInsnNode f=(FieldInsnNode)q;
                      if (f.getOpcode()==Opcodes.PUTFIELD && f.owner.equals("Class_cy") && f.name.equals("gc") && f.desc.equals("Z")) { hasGcPut=true; break; }
                    }
                  }
                  if (!hasGcPut) continue;

                  // Existing code is Class_ct.ag().at(). Find the ag() instruction directly before at().
                  AbstractInsnNode prev=n.getPrevious();
                  while (prev instanceof LabelNode || prev instanceof LineNumberNode || prev instanceof FrameNode) prev=prev.getPrevious();
                  if (!(prev instanceof MethodInsnNode)) throw new RuntimeException("at() predecessor is not a method call");
                  MethodInsnNode ag=(MethodInsnNode)prev;
                  if (ag.getOpcode()!=Opcodes.INVOKESTATIC || !ag.owner.equals("Class_ct") || !ag.name.equals("ag") || !ag.desc.equals("()LClass_ct;"))
                    throw new RuntimeException("unexpected Class_ct.at() call site");

                  // If HUD is already visible, skip the redundant UI reset.
                  // If HUD is currently hidden, preserve original ag().at() behavior.
                  LabelNode doReset=new LabelNode();
                  LabelNode afterReset=new LabelNode();
                  InsnList guard=new InsnList();
                  guard.add(new MethodInsnNode(Opcodes.INVOKESTATIC,"Class_cy","aa","()LClass_cy;",false));
                  guard.add(new FieldInsnNode(Opcodes.GETFIELD,"Class_cy","gc","Z"));
                  guard.add(new JumpInsnNode(Opcodes.IFEQ,doReset));
                  guard.add(new JumpInsnNode(Opcodes.GOTO,afterReset));
                  guard.add(doReset);
                  mn.instructions.insertBefore(prev,guard);
                  mn.instructions.insert(n,afterReset);
                  patched++;
                }
              }
              if (patched!=1) throw new RuntimeException("expected exactly one HUD reset call site, got "+patched);
              ClassWriter cw=new ClassWriter(ClassWriter.COMPUTE_FRAMES|ClassWriter.COMPUTE_MAXS) {
                protected String getCommonSuperClass(String a,String b) { return "java/lang/Object"; }
              };
              cn.accept(cw);
              Files.write(Paths.get("Class_by.patched.class"),cw.toByteArray());
              System.out.println("patched="+patched);
            }
          }
          EOF
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED PatchHudFlicker.java
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED PatchHudFlicker
          javap -p -c Class_by.patched.class > patched.txt
          python - <<'PY'
          import re
          t=open('patched.txt').read()
          # Validate the patched call site still contains Class_ct.at(), but now a gc read/branch appears immediately before it.
          pos=t.find('Method Class_ct.at:()V')
          if pos<0: raise SystemExit('Class_ct.at call missing')
          window=t[max(0,pos-1200):pos+800]
          if 'Field Class_cy.gc:Z' not in window:
              raise SystemExit('gc guard missing before Class_ct.at')
          if 'Method Class_cy.aa:()LClass_cy;' not in window:
              raise SystemExit('Class_cy.aa guard missing')
          print('Validated conditional HUD reset guard around Class_ct.at().')
          PY
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          python - <<'PY'
          import zipfile,os
          src='game.jar'; out='game.new.jar'; repl=open('Class_by.patched.class','rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              changed=[]
              for info in zin.infolist():
                  old=zin.read(info.filename)
                  new=repl if info.filename=='Class_by.class' else old
                  if new!=old: changed.append(info.filename)
                  zout.writestr(info,new)
          if changed!=['Class_by.class']:
              raise SystemExit('unexpected changed entries: '+repr(changed))
          with zipfile.ZipFile(out,'r') as z:
              bad=z.testzip()
              if bad: raise SystemExit('CRC failure: '+bad)
          os.replace(out,src)
          PY
          cp game.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
      - name: Commit corrected JAR only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nso_Offline_By_h0901.jar
          git diff --cached --quiet && { echo 'No JAR change'; exit 1; }
          git commit -m "fix: prevent HUD flicker on level 120 skill sync"
          git push
