name: Inspect current character delete flow
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-delete-live.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect delete and reseed flow
        shell: bash
        run: |
          set -euo pipefail
          J=Nso_Offline_By_h0901.jar
          curl -fsSL -o /tmp/cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          rm -rf /tmp/delinspect && mkdir -p /tmp/delinspect
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/delinspect >/dev/null 2>&1 || true
          {
            echo '=== CharacterDelete ==='
            javap -classpath "$J" -p -c CharacterDelete 2>&1 || true
            echo '=== DELETE BUTTON HITS ==='
            grep -Rni -B20 -A80 -E 'Xóa nhân vật|Xoa nhan vat|deleteCurrent|CharacterDelete' /tmp/delinspect | head -n 1200 || true
            echo '=== ADMIN SEED FLOW ==='
            grep -n -B20 -A100 -E 'private static byte\[\] ao\(|private static boolean ap\(|private static k0 ar\(|private static synchronized void an\(|zHoangVipStarter' /tmp/delinspect/DoHoang091.java | head -n 1400 || true
            echo '=== RECORD STORE STRINGS ==='
            grep -Rni -B8 -A20 -E 'ninja_school_offline_v3|nso_offline_e72_v2|admin_seed\.rms|deleteRecordStore' /tmp/delinspect | head -n 1200 || true
          } > delete_live_report.txt
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add -- delete_live_report.txt
          git commit -m 'chore: capture current character delete flow' || true
          git push origin HEAD:main
      - name: Remove inspector
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-inspect-delete-live.yml || true
          git config user.name ChatGPT
          git config user.email actions@github.com
          git commit -m 'chore: remove current character delete inspector' || true
          git push origin HEAD:main || true
