name: Inspect inventory restore state
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-inventory-restore.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect Class_ct inventory state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/invrestore && mkdir -p /tmp/invrestore/out
          cd /tmp/invrestore
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          unzip -p game.jar Class_ct.class > Class_ct.class
          unzip -p game.jar NativeCatalog.class > NativeCatalog.class
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar Class_ct.class --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          java -jar cfr.jar NativeCatalog.class --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('out/Class_ct.java').read_text(errors='replace').splitlines()
          pats=[r'\bba\s*=',r'\bfm\s*=',r'\bbz\s*=',r'\bcp\s*=',r'\bk\s*=',r'void k\(\)',r'void aj\(\)',r'Class_gd\.bi',r'Class_cy\.aa\(\)\.bk']
          hits=[]
          for i,l in enumerate(text):
              if any(re.search(p,l) for p in pats): hits.append(i)
          spans=[]
          for i in hits:
              a=max(0,i-35); b=min(len(text),i+100)
              if spans and a<=spans[-1][1]: spans[-1][1]=max(spans[-1][1],b)
              else: spans.append([a,b])
          out=[]
          for a,b in spans:
              out.append(f'--- Class_ct.java:{a+1}-{b} ---')
              out += [f'{j+1}: {text[j]}' for j in range(a,b)]
          nc=Path('out/NativeCatalog.java')
          out.append('\n=== NativeCatalog ===')
          out.append(nc.read_text(errors='replace') if nc.exists() else 'missing')
          Path('report.txt').write_text('\n'.join(out))
          PY
          cd "$GITHUB_WORKSPACE"
          mkdir -p inventory_restore_inspect
          cp /tmp/invrestore/report.txt inventory_restore_inspect/report.txt
          git add inventory_restore_inspect/report.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect inventory restore details' || true
          git push origin main
      - name: Remove workflow
        if: always()
        shell: bash
        run: |
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-inspect-inventory-restore.yml || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: remove inventory restore inspector' || true
          git push origin main || true
