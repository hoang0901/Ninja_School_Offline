name: Temp inspect hoang vip main
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-hoang-vip-main.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact starter and item data
        shell: bash
        run: |
          set -euo pipefail
          echo rerun-2
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          python3 - <<'PY' > item_sheet.txt
          import openpyxl
          wb=openpyxl.load_workbook('Danh_sach_ID_vat_pham.xlsx',data_only=True,read_only=True)
          ws=wb.active
          for row in ws.iter_rows(values_only=True):
              print('\t'.join('' if v is None else str(v) for v in row))
          PY
          rm -rf /tmp/inspect && mkdir /tmp/inspect && cd /tmp/inspect
          jar tf "$J" | grep '\.class$' | sed 's/\.class$//' > classes.txt
          javap -classpath "$J" -p -c DoHoang091 > do.txt
          javap -classpath "$J" -p -c 'DoHoang091$k0' > k0.txt
          {
            echo '=== ITEM SHEET LAST 300 ==='
            tail -n 300 "$GITHUB_WORKSPACE/item_sheet.txt"
            echo '=== ITEM SHEET KIEM / EQUIP KEYWORDS ==='
            grep -i -E 'kiếm|kiem|áo|ao |quần|quan |găng|gang|giày|giay|nhẫn|nhan|ngọc|ngoc|liên|lien|phù|phu|nón|non' "$GITHUB_WORKSPACE/item_sheet.txt" | tail -n 500 || true
            echo '=== CLASS MAP ==='
            grep -n -A90 -B5 'static java.lang.String a(byte)' do.txt || true
            echo '=== HOANG INIT ==='
            grep -n -B30 -A80 'String hoang' do.txt || true
            echo '=== K0 CTOR ==='
            grep -n -A1200 'DoHoang091\$k0(java.lang.String, byte, short, int)' k0.txt || true
            echo '=== FIELD USES q/r/s/t/u/H/I/J/T/U/V/W/X/Y/Z/aa/ab ==='
            while read c; do
              out=$(javap -classpath "$J" -p -c "$c" 2>/dev/null | grep -n -B12 -A28 -E 'DoHoang091\$k0\.(q|r|s|t|u|H|I|J|T|U|V|W|X|Y|Z|aa|ab):' || true)
              [ -z "$out" ] || { echo "##### $c #####"; echo "$out"; }
            done < classes.txt
          } > "$GITHUB_WORKSPACE/hoang_vip_exact.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- hoang_vip_exact.txt item_sheet.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect exact hoang vip data'
          git push origin HEAD:main
