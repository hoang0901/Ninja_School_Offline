name: Inspect Obito Sakura resources

on:
  push:
    branches: [fix-obito-sakura]
    paths:
      - '.github/workflows/inspect-obito-sakura.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-obito-sakura
          path: offline
      - uses: actions/checkout@v4
        with:
          repository: hoang0901/Nso_Folder
          ref: main
          path: source
      - name: Map Obito and Sakura resources
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/NinjaSchoolOffline_by_dohoang091"
          OFF="$GITHUB_WORKSPACE/offline"
          WORK="$RUNNER_TEMP/nso_focus"
          REPORT="$OFF/obito_sakura_focus.txt"
          mkdir -p "$WORK/jar"
          (cd "$WORK/jar" && jar xf "$OFF/Nso_Offline_By_h0901.jar")
          {
            echo '=== SOURCE FILES WITH TARGET IDS IN NAME ==='
            find "$SRC" -type f | grep -E '/(230|231|232|233|234|235|3421|3422)(\.[^/]+)?$|Small(230|231|232|233|234|235|3421|3422)\.' | sort || true
            echo
            echo '=== TARGET SMALL IMAGES ==='
            for z in 1 2 3 4; do
              for id in 230 231 232 233 234 235 3421 3422; do
                f="$SRC/Data/Img/Small/$z/Small$id.png"
                [ -f "$f" ] || f="$SRC/Data/Img/Small/$z/Small$id.PNG"
                if [ -f "$f" ]; then
                  printf '%s\t%s\t' "${f#$SRC/}" "$(stat -c %s "$f")"
                  sha256sum "$f" | cut -d' ' -f1
                fi
              done
            done
            echo
            echo '=== OFFLINE JAR TOP DIRECTORIES ==='
            find "$WORK/jar" -mindepth 1 -maxdepth 2 -type d -printf '%P\n' | sort | head -n 300
            echo
            echo '=== OFFLINE JAR ENTRIES WITH TARGET IDS ==='
            find "$WORK/jar" -type f -printf '%P\t%s\n' | grep -E '(^|/|[^0-9])(230|231|232|233|234|235|3421|3422)([^0-9]|$)' | sort || true
            echo
            echo '=== OFFLINE PNG/GIF/JPG SAMPLE ==='
            find "$WORK/jar" -type f \( -iname '*.png' -o -iname '*.gif' -o -iname '*.jpg' \) -printf '%P\t%s\n' | sort | head -n 500
            echo
            echo '=== OFFLINE RESOURCE EXTENSIONS ==='
            find "$WORK/jar" -type f | sed 's#^.*/##' | awk -F. 'NF>1{print "."tolower($NF)} NF==1{print "[no extension]"}' | sort | uniq -c | sort -nr | head -n 100
            echo
            echo '=== TEXT REFERENCES TO PART IDS IN SOURCE ==='
            grep -RniE '(head|body|leg|fashion|part).*(230|231|232|233|234|235)|(230|231|232|233|234|235).*(head|body|leg|fashion|part)' "$SRC/src" --include='*.java' 2>/dev/null | head -n 500 || true
          } > "$REPORT"
      - name: Commit focused report
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/offline"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add obito_sakura_focus.txt
          git commit -m 'chore: add focused Obito Sakura mapping' || exit 0
          git push origin fix-obito-sakura
