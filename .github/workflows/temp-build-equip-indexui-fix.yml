name: Temporary build equipment indexUI fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-build-equip-indexui-fix.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch equipment routes and publish feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eqfix && mkdir -p /tmp/eqfix/src /tmp/eqfix/classes
          cd /tmp/eqfix
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          cp game.jar before.jar
          curl -fsSL -o javassist.jar https://repo1.maven.org/maven2/org/javassist/javassist/3.30.2-GA/javassist-3.30.2-GA.jar

          cat > src/Patch.java <<'JAVA'
          import javassist.*;
          import java.io.*;
          import java.util.*;
          import java.util.jar.*;
          public final class Patch {
            public static void main(String[] args) throws Exception {
              ClassPool cp=new ClassPool(true); cp.insertClassPath("game.jar");
              CtClass ct=cp.get("Class_ct");
              CtMethod j=ct.getDeclaredMethod("j",new CtClass[]{CtClass.intType});
              j.insertBefore("{ if ($1 == 7) $1 = 23; else if ($1 == 23) $1 = 7; }");
              replace("game.jar","Class_ct.class",ct.toBytecode());
              ct.detach();

              cp=new ClassPool(true); cp.insertClassPath("game.jar");
              CtClass k=cp.get("k16");
              CtMethod special=k.getDeclaredMethod("i",new CtClass[]{CtClass.intType,CtClass.intType});
              special.insertBefore("{ if ($2 == 9) return false; }");
              replace("game.jar","k16.class",k.toBytecode());
              k.detach();
            }
            static void replace(String jarPath,String entry,byte[] data)throws Exception{
              File src=new File(jarPath),tmp=new File(jarPath+".tmp");
              JarFile jf=new JarFile(src); JarOutputStream out=new JarOutputStream(new FileOutputStream(tmp));
              byte[] buf=new byte[8192]; Enumeration<JarEntry> en=jf.entries();
              while(en.hasMoreElements()){
                JarEntry e=en.nextElement(); String n=e.getName();
                if(n.equals(entry)||(n.startsWith("META-INF/")&&(n.endsWith(".SF")||n.endsWith(".RSA")||n.endsWith(".DSA")))) continue;
                JarEntry ne=new JarEntry(n); if(e.getTime()!=-1)ne.setTime(e.getTime()); out.putNextEntry(ne);
                InputStream in=jf.getInputStream(e); int r; while((r=in.read(buf))!=-1)out.write(buf,0,r); in.close(); out.closeEntry();
              }
              out.putNextEntry(new JarEntry(entry)); out.write(data); out.closeEntry(); out.close(); jf.close();
              if(!src.delete()||!tmp.renameTo(src))throw new IOException("replace failed");
            }
          }
          JAVA
          javac -cp javassist.jar -d classes src/Patch.java
          java -cp javassist.jar:classes Patch
          zip -d game.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          unzip -t game.jar >/dev/null

          rm -rf before after && mkdir before after
          (cd before && jar xf ../before.jar)
          (cd after && jar xf ../game.jar)
          rm -rf before/META-INF after/META-INF
          diff -qr before after > diff.txt || true
          changed=$(grep -c '^Files .* differ$' diff.txt || true)
          test "$changed" -eq 2
          grep -q 'Class_ct.class' diff.txt
          grep -q 'k16.class' diff.txt
          if grep '^Files .* differ$' diff.txt | grep -Ev 'Class_ct.class|k16.class' >/dev/null; then exit 20; fi

          javap -classpath game.jar -p -c Class_ct > ct.txt
          javap -classpath game.jar -p -c k16 > k16.txt
          python3 - <<'PY'
          from pathlib import Path
          ct=Path('ct.txt').read_text(errors='replace')
          k=Path('k16.txt').read_text(errors='replace')
          a=ct.index('public final void j(int);')
          h=ct[a:a+3500]
          assert 'bipush        7' in h and 'bipush        23' in h
          a=k.index('static boolean i(int, int)')
          h=k[a:a+2200]
          assert 'bipush        9' in h and 'ireturn' in h
          Path('verify.txt').write_text('PATCH_OK\n7<->23 UI route swapped\nindexUI 9 bypasses special detector and continues to normal equip slot 9\nOnly Class_ct.class and k16.class differ from main JAR\n',encoding='utf-8')
          PY
          sha256sum before.jar game.jar > hashes.txt
          cat verify.txt
          cat hashes.txt

          cd "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout -B chatgpt/fix-equip-indexui-7-23-9 origin/main
          cp /tmp/eqfix/game.jar Nso_Offline_By_h0901.jar
          git rm -f .github/workflows/temp-build-equip-indexui-fix.yml
          git add -- Nso_Offline_By_h0901.jar
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'fix: correct equipment indexUI 7 23 and charm slot 9'
          git push --force origin HEAD:chatgpt/fix-equip-indexui-7-23-9
