name: temp publish character delete
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-publish-character-delete.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build validated CharacterDelete patch
        shell: bash
        run: |
          set -euo pipefail
          git show 99daa52623974d290394cb47ce820e7cb54ffa16:.github/workflows/temp-fix-character-delete.yml > /tmp/w.yml
          python3 - <<'PY'
          import re
          s=open('/tmp/w.yml').read()
          m=re.search(r"cat > src/Build.java <<'JAVA'\n(.*?)\n          JAVA",s,re.S)
          assert m
          text='\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          open('/tmp/Build.java','w').write(text+'\n')
          PY
          rm -rf /tmp/chardel && mkdir -p /tmp/chardel/src /tmp/chardel/classes
          cp /tmp/Build.java /tmp/chardel/src/Build.java
          cp Nso_Offline_By_h0901.jar /tmp/chardel/game.jar
          cd /tmp/chardel
          curl -fsSL -o asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          curl -fsSL -o asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar
          javac -cp asm.jar:asm-tree.jar -d classes src/Build.java
          java -cp asm.jar:asm-tree.jar:classes Build
          jar uf game.jar -C classes CharacterDelete.class
          zip -d game.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          unzip -t game.jar >/dev/null
          javap -classpath game.jar -c -p CharacterDelete > del.txt
          grep -q 'DoHoang091.as' del.txt
          grep -q 'DoHoang091.U' del.txt
          grep -q 'ninja_school_offline_v3' del.txt
          if jar tf game.jar | grep -Fxq 'OfflineStartMenu.class'; then exit 1; fi
          cp game.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          cd "$GITHUB_WORKSPACE"
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add Nso_Offline_By_h0901.jar
          git commit -m 'fix: permanently delete current character'
          git push origin main
      - name: Clean temporary files
        if: always()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main
          rm -rf .github character_delete_build_log.txt character_delete_javap.txt character_delete_inspect.txt
          git add -A
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'chore: clean character delete build files' || true
          git push origin main || true
