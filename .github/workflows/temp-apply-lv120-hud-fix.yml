name: Temporary apply lv120 HUD fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-apply-lv120-hud-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build targeted bytecode patcher
        shell: bash
        run: |
          cat > /tmp/PatchK25.java <<'JAVA'
          import java.nio.file.*;
          import jdk.internal.org.objectweb.asm.*;
          import jdk.internal.org.objectweb.asm.tree.*;
          import java.util.*;

          public class PatchK25 {
            static AbstractInsnNode nextReal(AbstractInsnNode n) {
              for (n=n.getNext(); n!=null; n=n.getNext()) {
                int t=n.getType();
                if (t!=AbstractInsnNode.LABEL && t!=AbstractInsnNode.LINE && t!=AbstractInsnNode.FRAME) return n;
              }
              return null;
            }
            static boolean isVar(AbstractInsnNode n,int op,int var) {
              return n instanceof VarInsnNode && n.getOpcode()==op && ((VarInsnNode)n).var==var;
            }
            public static void main(String[] args) throws Exception {
              byte[] in=Files.readAllBytes(Paths.get(args[0]));
              ClassNode cn=new ClassNode();
              new ClassReader(in).accept(cn,0);
              MethodNode target=null;
              for (MethodNode m: cn.methods) if (m.name.equals("g") && m.desc.equals("(II)Z")) target=m;
              if (target==null) throw new RuntimeException("k25.g(II)Z not found");

              MethodInsnNode firstLookup=null, secondLookup=null;
              for (AbstractInsnNode n=target.instructions.getFirst(); n!=null; n=n.getNext()) {
                if (n instanceof MethodInsnNode) {
                  MethodInsnNode mi=(MethodInsnNode)n;
                  if (mi.getOpcode()==Opcodes.INVOKEVIRTUAL && mi.owner.equals("k24") && mi.name.equals("a") && mi.desc.equals("(I)I")) {
                    if (firstLookup==null) firstLookup=mi; else if (secondLookup==null) { secondLookup=mi; break; }
                  }
                }
              }
              if (firstLookup==null || secondLookup==null) throw new RuntimeException("expected two k24.a(I)I lookups");

              AbstractInsnNode insertBefore=firstLookup.getPrevious();
              while (insertBefore!=null && (insertBefore.getType()==AbstractInsnNode.LABEL || insertBefore.getType()==AbstractInsnNode.LINE || insertBefore.getType()==AbstractInsnNode.FRAME)) insertBefore=insertBefore.getPrevious();
              if (insertBefore==null || insertBefore.getOpcode()!=Opcodes.ICONST_1) throw new RuntimeException("unexpected first lookup shape");
              AbstractInsnNode aload4=insertBefore.getPrevious();
              while (aload4!=null && (aload4.getType()==AbstractInsnNode.LABEL || aload4.getType()==AbstractInsnNode.LINE || aload4.getType()==AbstractInsnNode.FRAME)) aload4=aload4.getPrevious();
              if (!isVar(aload4,Opcodes.ALOAD,4)) throw new RuntimeException("expected ALOAD 4 before first lookup");

              AbstractInsnNode store6=nextReal(secondLookup);
              if (!isVar(store6,Opcodes.ISTORE,6)) throw new RuntimeException("expected ISTORE 6 after second lookup");
              AbstractInsnNode afterStore6=nextReal(store6);
              if (afterStore6==null) throw new RuntimeException("missing instruction after ISTORE 6");
              LabelNode continueLabel=new LabelNode();
              target.instructions.insertBefore(afterStore6, continueLabel);
              LabelNode normalLabel=new LabelNode();

              InsnList add=new InsnList();
              // Only skill IDs 85..90 (books 1125..1130) use row 1 explicitly.
              add.add(new VarInsnNode(Opcodes.ILOAD,2));
              add.add(new IntInsnNode(Opcodes.BIPUSH,85));
              add.add(new JumpInsnNode(Opcodes.IF_ICMPLT,normalLabel));
              add.add(new VarInsnNode(Opcodes.ILOAD,2));
              add.add(new IntInsnNode(Opcodes.BIPUSH,90));
              add.add(new JumpInsnNode(Opcodes.IF_ICMPGT,normalLabel));
              // learnedPoint = k24.e[1] (real runtime lookup key)
              add.add(new VarInsnNode(Opcodes.ALOAD,4));
              add.add(new FieldInsnNode(Opcodes.GETFIELD,"k24","e","[B"));
              add.add(new InsnNode(Opcodes.ICONST_1));
              add.add(new InsnNode(Opcodes.BALOAD));
              add.add(new IntInsnNode(Opcodes.SIPUSH,255));
              add.add(new InsnNode(Opcodes.IAND));
              add.add(new VarInsnNode(Opcodes.ISTORE,5));
              // rowIndex = 1
              add.add(new InsnNode(Opcodes.ICONST_1));
              add.add(new VarInsnNode(Opcodes.ISTORE,6));
              add.add(new JumpInsnNode(Opcodes.GOTO,continueLabel));
              add.add(normalLabel);
              target.instructions.insertBefore(aload4,add);

              ClassWriter cw=new ClassWriter(ClassWriter.COMPUTE_MAXS);
              cn.accept(cw);
              Files.write(Paths.get(args[1]),cw.toByteArray());
            }
          }
          JAVA
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
                --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED \
                /tmp/PatchK25.java

      - name: Patch current JAR only in k24 k25 k32
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=15094ae1953e93b6c3a8ceb26aa3ef350dafc674
          git show "$BEFORE:Nso_Offline_By_h0901.jar" > /tmp/before.jar
          rm -rf /tmp/pre /tmp/cur && mkdir /tmp/pre /tmp/cur
          (cd /tmp/pre && jar xf /tmp/before.jar k24.class k32.class)
          (cd /tmp/cur && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" k25.class)
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
               --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED \
               -cp /tmp PatchK25 /tmp/cur/k25.class /tmp/cur/k25.new.class

          python3 - <<'PY'
          import zipfile, os, hashlib, shutil
          src='Nso_Offline_By_h0901.jar'; out=src+'.new'
          replacements={
            'k24.class':open('/tmp/pre/k24.class','rb').read(),
            'k32.class':open('/tmp/pre/k32.class','rb').read(),
            'k25.class':open('/tmp/cur/k25.new.class','rb').read(),
          }
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
            changed=[]
            for info in zin.infolist():
              old=zin.read(info.filename)
              new=replacements.get(info.filename,old)
              if new!=old: changed.append(info.filename)
              zout.writestr(info,new)
          if set(changed)!={'k24.class','k25.class','k32.class'}:
            raise SystemExit('unexpected changed entries: '+repr(changed))
          with zipfile.ZipFile(out) as z:
            bad=z.testzip()
            if bad: raise SystemExit('CRC failure '+bad)
          os.replace(out,src)
          print('changed:',changed)
          PY

      - name: Validate corrected lookup and lv120 learning path
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath Nso_Offline_By_h0901.jar -c -p k24 > /tmp/k24.txt
          javap -classpath Nso_Offline_By_h0901.jar -c -p k25 > /tmp/k25.txt
          grep -A35 'int a(int);' /tmp/k24.txt > lv120_fix_validation.txt
          {
            echo
            echo '=== k25.g(II)Z lv120 branch ==='
            grep -A180 'static boolean g(int, int)' /tmp/k25.txt | head -180
          } >> lv120_fix_validation.txt
          grep -A35 'int a(int);' /tmp/k24.txt | grep -q 'Field e:\[B'
          grep -A180 'static boolean g(int, int)' /tmp/k25.txt | grep -q 'bipush        85'
          grep -A180 'static boolean g(int, int)' /tmp/k25.txt | grep -q 'bipush        90'
          grep -A180 'static boolean g(int, int)' /tmp/k25.txt | grep -q 'Field k24.e:\[B'

      - name: Commit corrected JAR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nso_Offline_By_h0901.jar lv120_fix_validation.txt
          git commit -m "fix: preserve HUD after level 120 skills"
          git push
