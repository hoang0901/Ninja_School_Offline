name: Temporary trade render focus
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-trade-render-focus.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract trade render and input methods
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/trfocus && mkdir -p /tmp/trfocus/out /tmp/trfocus/report
          cd /tmp/trfocus
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          unzip -p game.jar Class_ct.class > Class_ct.class
          java -jar cfr.jar Class_ct.class --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('out/Class_ct.java').read_text(errors='replace')
          lines=s.splitlines()
          # Extract full methods containing important trade state/data refs.
          pats=['cp','Class_ct.cp','Class_ct.k',' ba ','ba =','Class_gd.fv','Class_gd.pw','this.a(class_dg','Class_ct.a(class_dg']
          sig=re.compile(r'^\s*(public|private|protected)\s+.*\([^;]*\)\s*(throws\s+[^\{]+)?\{\s*$')
          def bounds(i):
              a=i
              while a>=0 and not sig.match(lines[a]): a-=1
              if a<0:return None
              bal=0; seen=False
              for b in range(a,len(lines)):
                  bal += lines[b].count('{')-lines[b].count('}')
                  if '{' in lines[b]: seen=True
                  if seen and bal==0:return a,b
              return a,min(len(lines)-1,i+400)
          found=[]; seen=set()
          for i,l in enumerate(lines):
              if any(p in l for p in pats):
                  x=bounds(i)
                  if not x or x in seen: continue
                  a,b=x
                  block='\n'.join(lines[a:b+1])
                  # retain only methods strongly tied to trade screen
                  if ('cp' in block or 'Class_gd.fv' in block or 'Class_gd.pw' in block) and ('Class_dg' in block or 'bz' in block or 'Class_dw' in block or 'Class_ew' in block):
                      seen.add(x); found.append('===== %d-%d =====\n%s\n'%(a+1,b+1,block))
          Path('report/focus.txt').write_text('\n'.join(found))
          PY
          git -C "$GITHUB_WORKSPACE" checkout chatgpt/native-catalog-inventory-ui
          rm -rf "$GITHUB_WORKSPACE/trade_render_focus"
          cp -r report "$GITHUB_WORKSPACE/trade_render_focus"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- trade_render_focus
          git diff --cached --quiet || git commit -m "chore: inspect native trade render paths"
          git push origin HEAD:chatgpt/native-catalog-inventory-ui
      - name: Cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main
          git rm -- .github/workflows/temp-trade-render-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove trade render inspector"
          git push origin main
