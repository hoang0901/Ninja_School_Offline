name: Temporary inspect item catalog main
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-item-catalog-main.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate inventory classes fast
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nsofast "$GITHUB_WORKSPACE/item_diag11"
          mkdir -p /tmp/nsofast/classes "$GITHUB_WORKSPACE/item_diag11"
          cd /tmp/nsofast
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          unzip -q game.jar -d classes
          out="$GITHUB_WORKSPACE/item_diag11/classes.txt"
          : > "$out"
          for term in 'Hành trang' 'hành trang' 'Trang bị' 'Vật phẩm' 'Sử dụng' 'Bỏ ra' 'Mua' 'Cửa hàng'; do
            echo "=== $term ===" >> "$out"
            grep -R -a -l -F "$term" classes --include='*.class' | sed 's#^classes/##' | head -80 >> "$out" || true
          done
          grep -R -a -l -E 'Hành trang|hành trang|Trang bị|Cửa hàng' classes --include='*.class' | sed 's#^classes/##;s#\.class$##;s#/#.#g' | sort -u | head -25 > /tmp/matches.txt || true
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            safe=$(echo "$c" | tr '/.$' '___')
            javap -classpath game.jar -p -c "$c" > "$GITHUB_WORKSPACE/item_diag11/${safe}.txt" 2>&1 || true
          done < /tmp/matches.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- item_diag11
          git diff --cached --quiet && exit 0
          git commit -m "chore: locate inventory classes fast"
          git push
