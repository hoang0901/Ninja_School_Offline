name: Main find login class
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-main-find-login.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find login by constants
        shell: bash
        run: |
          set -euo pipefail
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          rm -rf /tmp/mainlogin && mkdir -p /tmp/mainlogin
          cd /tmp/mainlogin
          jar tf "$J" | grep '^Class_.*\.class$' | sed 's/\.class$//' > classes.txt
          : > hits.txt
          while read c; do
            javap -classpath "$J" -p -c -verbose "$c" > one.txt 2>/dev/null || continue
            if grep -qE 'indServer|lowGraphic|tmpusr_offline|DoHoang091SaveState|sipush +1000|sipush +1001' one.txt; then
              echo "##### $c #####" >> hits.txt
              grep -E -n -B8 -A22 'indServer|lowGraphic|tmpusr_offline|DoHoang091SaveState|sipush +8885|sipush +8886|sipush +1000|sipush +1001|sipush +1005|sipush +1006|Class_dw|Class_ew' one.txt >> hits.txt || true
            fi
          done < classes.txt
          cp hits.txt "$GITHUB_WORKSPACE/main_login_candidates.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- main_login_candidates.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: identify login class by constants'
          git push origin main
