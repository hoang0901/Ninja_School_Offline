name: Build offline save menu with ASM
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-build-save-menu-asm.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/savemenu2 /tmp/feature && mkdir -p /tmp/savemenu2/src /tmp/savemenu2/classes
          cd /tmp/savemenu2
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          curl -fsSL -o asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar
          cat > src/Build.java <<'JAVA'
          import java.io.*;
          import java.util.*;
          import java.util.jar.*;
          import org.objectweb.asm.*;
          import org.objectweb.asm.tree.*;
          import static org.objectweb.asm.Opcodes.*;

          public final class Build {
            static void append(MethodVisitor m,String s){m.visitVarInsn(ALOAD,0);m.visitLdcInsn(s);m.visitInsn(ACONST_NULL);m.visitMethodInsn(INVOKEVIRTUAL,"OfflineStartMenu","append","(Ljava/lang/String;Ljavax/microedition/lcdui/Image;)I",false);m.visitInsn(POP);}
            static byte[] menu(){
              ClassWriter c=new ClassWriter(ClassWriter.COMPUTE_MAXS); c.visit(V1_4,ACC_PUBLIC|ACC_FINAL,"OfflineStartMenu",null,"javax/microedition/lcdui/List",new String[]{"javax/microedition/lcdui/CommandListener"});
              c.visitField(ACC_PRIVATE|ACC_STATIC,"midlet","LClass_da;",null,null).visitEnd(); MethodVisitor m;
              m=c.visitMethod(ACC_PRIVATE,"<init>","()V",null,null);m.visitCode();m.visitVarInsn(ALOAD,0);m.visitLdcInsn("Ninja School Offline");m.visitInsn(ICONST_3);m.visitMethodInsn(INVOKESPECIAL,"javax/microedition/lcdui/List","<init>","(Ljava/lang/String;I)V",false);append(m,"Chơi mới");Label ns=new Label();m.visitMethodInsn(INVOKESTATIC,"DoHoang091SaveState","hasSaveData","()Z",false);m.visitJumpInsn(IFEQ,ns);append(m,"Tiếp tục");m.visitLabel(ns);append(m,"Sao lưu");append(m,"Khôi phục");m.visitVarInsn(ALOAD,0);m.visitVarInsn(ALOAD,0);m.visitMethodInsn(INVOKEVIRTUAL,"OfflineStartMenu","setCommandListener","(Ljavax/microedition/lcdui/CommandListener;)V",false);m.visitInsn(RETURN);m.visitMaxs(0,0);m.visitEnd();
              m=c.visitMethod(ACC_PUBLIC|ACC_STATIC,"show","(LClass_da;)V",null,null);m.visitCode();m.visitVarInsn(ALOAD,0);m.visitFieldInsn(PUTSTATIC,"OfflineStartMenu","midlet","LClass_da;");m.visitVarInsn(ALOAD,0);m.visitMethodInsn(INVOKESTATIC,"javax/microedition/lcdui/Display","getDisplay","(Ljavax/microedition/midlet/MIDlet;)Ljavax/microedition/lcdui/Display;",false);m.visitTypeInsn(NEW,"OfflineStartMenu");m.visitInsn(DUP);m.visitMethodInsn(INVOKESPECIAL,"OfflineStartMenu","<init>","()V",false);m.visitMethodInsn(INVOKEVIRTUAL,"javax/microedition/lcdui/Display","setCurrent","(Ljavax/microedition/lcdui/Displayable;)V",false);m.visitInsn(RETURN);m.visitMaxs(0,0);m.visitEnd();
              m=c.visitMethod(ACC_PUBLIC|ACC_STATIC,"ensureGameThread","()V",null,null);m.visitCode();Label ok=new Label();m.visitFieldInsn(GETSTATIC,"Class_do","a","Z");m.visitJumpInsn(IFNE,ok);m.visitTypeInsn(NEW,"java/lang/Thread");m.visitInsn(DUP);m.visitMethodInsn(INVOKESTATIC,"Class_do","b","()LClass_do;",false);m.visitMethodInsn(INVOKESPECIAL,"java/lang/Thread","<init>","(Ljava/lang/Runnable;)V",false);m.visitMethodInsn(INVOKEVIRTUAL,"java/lang/Thread","start","()V",false);m.visitLabel(ok);m.visitInsn(RETURN);m.visitMaxs(0,0);m.visitEnd();
              m=c.visitMethod(ACC_PUBLIC|ACC_STATIC,"clearPrimary","()V",null,null);m.visitCode();Label a=new Label(),b=new Label(),h1=new Label(),d=new Label(),e=new Label(),h2=new Label(),z=new Label();m.visitTryCatchBlock(a,b,h1,"java/lang/Throwable");m.visitLabel(a);m.visitLdcInsn("ninja_school_offline_v3");m.visitMethodInsn(INVOKESTATIC,"javax/microedition/rms/RecordStore","deleteRecordStore","(Ljava/lang/String;)V",false);m.visitLabel(b);m.visitJumpInsn(GOTO,d);m.visitLabel(h1);m.visitInsn(POP);m.visitLabel(d);m.visitTryCatchBlock(d,e,h2,"java/lang/Throwable");m.visitLdcInsn("nso_offline_e72_v2");m.visitMethodInsn(INVOKESTATIC,"javax/microedition/rms/RecordStore","deleteRecordStore","(Ljava/lang/String;)V",false);m.visitLabel(e);m.visitJumpInsn(GOTO,z);m.visitLabel(h2);m.visitInsn(POP);m.visitLabel(z);m.visitInsn(ICONST_0);m.visitTypeInsn(ANEWARRAY,"DoHoang091$k0");m.visitFieldInsn(PUTSTATIC,"DoHoang091","aj","[LDoHoang091$k0;");m.visitInsn(ICONST_0);m.visitFieldInsn(PUTSTATIC,"DoHoang091","ak","I");m.visitInsn(ICONST_1);m.visitFieldInsn(PUTSTATIC,"DoHoang091","an","Z");m.visitInsn(RETURN);m.visitMaxs(0,0);m.visitEnd();
              m=c.visitMethod(ACC_PRIVATE|ACC_STATIC,"enter","(Z)V",null,null);m.visitCode();Label sk=new Label();m.visitVarInsn(ILOAD,0);m.visitJumpInsn(IFEQ,sk);m.visitMethodInsn(INVOKESTATIC,"OfflineStartMenu","clearPrimary","()V",false);m.visitLabel(sk);m.visitMethodInsn(INVOKESTATIC,"DoHoang091","connect","()V",false);m.visitFieldInsn(GETSTATIC,"OfflineStartMenu","midlet","LClass_da;");m.visitMethodInsn(INVOKESTATIC,"javax/microedition/lcdui/Display","getDisplay","(Ljavax/microedition/midlet/MIDlet;)Ljavax/microedition/lcdui/Display;",false);m.visitMethodInsn(INVOKESTATIC,"Class_do","b","()LClass_do;",false);m.visitMethodInsn(INVOKEVIRTUAL,"javax/microedition/lcdui/Display","setCurrent","(Ljavax/microedition/lcdui/Displayable;)V",false);m.visitInsn(RETURN);m.visitMaxs(0,0);m.visitEnd();
              m=c.visitMethod(ACC_PUBLIC,"commandAction","(Ljavax/microedition/lcdui/Command;Ljavax/microedition/lcdui/Displayable;)V",null,null);m.visitCode();m.visitVarInsn(ALOAD,0);m.visitMethodInsn(INVOKEVIRTUAL,"OfflineStartMenu","getSelectedIndex","()I",false);m.visitVarInsn(ISTORE,3);m.visitMethodInsn(INVOKESTATIC,"DoHoang091SaveState","hasSaveData","()Z",false);m.visitVarInsn(ISTORE,4);Label n0=new Label();m.visitVarInsn(ILOAD,3);m.visitJumpInsn(IFNE,n0);m.visitInsn(ICONST_1);m.visitMethodInsn(INVOKESTATIC,"OfflineStartMenu","enter","(Z)V",false);m.visitInsn(RETURN);m.visitLabel(n0);Label nc=new Label();m.visitVarInsn(ILOAD,4);m.visitJumpInsn(IFEQ,nc);Label n1=new Label();m.visitVarInsn(ILOAD,3);m.visitInsn(ICONST_1);m.visitJumpInsn(IF_ICMPNE,n1);m.visitInsn(ICONST_0);m.visitMethodInsn(INVOKESTATIC,"OfflineStartMenu","enter","(Z)V",false);m.visitInsn(RETURN);m.visitLabel(n1);m.visitIincInsn(3,-1);m.visitLabel(nc);Label nb=new Label();m.visitVarInsn(ILOAD,3);m.visitInsn(ICONST_1);m.visitJumpInsn(IF_ICMPNE,nb);m.visitMethodInsn(INVOKESTATIC,"DoHoang091","backupSave","()Ljava/lang/String;",false);m.visitInsn(POP);m.visitInsn(RETURN);m.visitLabel(nb);Label end=new Label();m.visitVarInsn(ILOAD,3);m.visitInsn(ICONST_2);m.visitJumpInsn(IF_ICMPNE,end);m.visitMethodInsn(INVOKESTATIC,"DoHoang091","restoreSave","()Ljava/lang/String;",false);m.visitInsn(POP);m.visitFieldInsn(GETSTATIC,"OfflineStartMenu","midlet","LClass_da;");m.visitMethodInsn(INVOKESTATIC,"OfflineStartMenu","show","(LClass_da;)V",false);m.visitLabel(end);m.visitInsn(RETURN);m.visitMaxs(0,0);m.visitEnd();
              m=c.visitMethod(ACC_PUBLIC|ACC_STATIC,"deleteCurrent","()Z",null,new String[]{"java/lang/Exception"});m.visitCode();m.visitFieldInsn(GETSTATIC,"DoHoang091","aj","[LDoHoang091$k0;");m.visitVarInsn(ASTORE,0);m.visitFieldInsn(GETSTATIC,"DoHoang091","ak","I");m.visitVarInsn(ISTORE,1);Label bad=new Label(),nz=new Label(),idx=new Label();m.visitVarInsn(ALOAD,0);m.visitJumpInsn(IFNULL,bad);m.visitVarInsn(ALOAD,0);m.visitInsn(ARRAYLENGTH);m.visitJumpInsn(IFNE,nz);m.visitLabel(bad);m.visitInsn(ICONST_0);m.visitInsn(IRETURN);m.visitLabel(nz);m.visitVarInsn(ILOAD,1);m.visitJumpInsn(IFLT,bad);m.visitVarInsn(ILOAD,1);m.visitVarInsn(ALOAD,0);m.visitInsn(ARRAYLENGTH);m.visitJumpInsn(IF_ICMPLT,idx);m.visitJumpInsn(GOTO,bad);m.visitLabel(idx);m.visitVarInsn(ALOAD,0);m.visitInsn(ARRAYLENGTH);m.visitInsn(ICONST_1);m.visitInsn(ISUB);m.visitTypeInsn(ANEWARRAY,"DoHoang091$k0");m.visitVarInsn(ASTORE,2);Label tail=new Label(),after=new Label();m.visitVarInsn(ILOAD,1);m.visitJumpInsn(IFLE,tail);m.visitVarInsn(ALOAD,0);m.visitInsn(ICONST_0);m.visitVarInsn(ALOAD,2);m.visitInsn(ICONST_0);m.visitVarInsn(ILOAD,1);m.visitMethodInsn(INVOKESTATIC,"java/lang/System","arraycopy","(Ljava/lang/Object;ILjava/lang/Object;II)V",false);m.visitLabel(tail);m.visitVarInsn(ILOAD,1);m.visitVarInsn(ALOAD,0);m.visitInsn(ARRAYLENGTH);m.visitInsn(ICONST_1);m.visitInsn(ISUB);m.visitJumpInsn(IF_ICMPGE,after);m.visitVarInsn(ALOAD,0);m.visitVarInsn(ILOAD,1);m.visitInsn(ICONST_1);m.visitInsn(IADD);m.visitVarInsn(ALOAD,2);m.visitVarInsn(ILOAD,1);m.visitVarInsn(ALOAD,0);m.visitInsn(ARRAYLENGTH);m.visitVarInsn(ILOAD,1);m.visitInsn(ISUB);m.visitInsn(ICONST_1);m.visitInsn(ISUB);m.visitMethodInsn(INVOKESTATIC,"java/lang/System","arraycopy","(Ljava/lang/Object;ILjava/lang/Object;II)V",false);m.visitLabel(after);m.visitVarInsn(ALOAD,2);m.visitFieldInsn(PUTSTATIC,"DoHoang091","aj","[LDoHoang091$k0;");Label rem=new Label();m.visitVarInsn(ALOAD,2);m.visitInsn(ARRAYLENGTH);m.visitJumpInsn(IFNE,rem);m.visitMethodInsn(INVOKESTATIC,"OfflineStartMenu","clearPrimary","()V",false);m.visitInsn(ICONST_1);m.visitInsn(IRETURN);m.visitLabel(rem);Label oi=new Label(),si=new Label();m.visitVarInsn(ILOAD,1);m.visitVarInsn(ALOAD,2);m.visitInsn(ARRAYLENGTH);m.visitJumpInsn(IF_ICMPLT,oi);m.visitVarInsn(ALOAD,2);m.visitInsn(ARRAYLENGTH);m.visitInsn(ICONST_1);m.visitInsn(ISUB);m.visitJumpInsn(GOTO,si);m.visitLabel(oi);m.visitVarInsn(ILOAD,1);m.visitLabel(si);m.visitFieldInsn(PUTSTATIC,"DoHoang091","ak","I");m.visitInsn(ICONST_1);m.visitFieldInsn(PUTSTATIC,"DoHoang091","an","Z");m.visitMethodInsn(INVOKESTATIC,"DoHoang091","as","()V",false);m.visitMethodInsn(INVOKESTATIC,"DoHoang091","U","()V",false);m.visitInsn(ICONST_1);m.visitInsn(IRETURN);m.visitMaxs(0,0);m.visitEnd();c.visitEnd();return c.toByteArray();
            }
            static byte[] patch(byte[] in,String cls){ClassNode c=new ClassNode();new ClassReader(in).accept(c,0);for(Object o:c.methods){MethodNode m=(MethodNode)o;if(cls.equals("Class_da")&&m.name.equals("startApp")&&m.desc.equals("()V")){m.instructions.clear();m.tryCatchBlocks.clear();if(m.localVariables!=null)m.localVariables.clear();m.instructions.add(new MethodInsnNode(INVOKESTATIC,"OfflineStartMenu","ensureGameThread","()V",false));m.instructions.add(new VarInsnNode(ALOAD,0));m.instructions.add(new MethodInsnNode(INVOKESTATIC,"OfflineStartMenu","show","(LClass_da;)V",false));m.instructions.add(new InsnNode(RETURN));m.maxLocals=1;m.maxStack=1;}if(cls.equals("CharacterDelete")&&m.name.equals("deleteCurrent")&&m.desc.equals("()Z")){m.instructions.clear();m.tryCatchBlocks.clear();if(m.localVariables!=null)m.localVariables.clear();m.instructions.add(new MethodInsnNode(INVOKESTATIC,"OfflineStartMenu","deleteCurrent","()Z",false));m.instructions.add(new InsnNode(IRETURN));m.maxLocals=0;m.maxStack=1;}}ClassWriter w=new ClassWriter(ClassWriter.COMPUTE_MAXS);c.accept(w);return w.toByteArray();}
            static byte[] read(JarFile j,String n)throws Exception{InputStream i=j.getInputStream(j.getJarEntry(n));ByteArrayOutputStream b=new ByteArrayOutputStream();byte[] x=new byte[8192];int r;while((r=i.read(x))!=-1)b.write(x,0,r);i.close();return b.toByteArray();}
            public static void main(String[] a)throws Exception{JarFile j=new JarFile("game.jar");byte[] da=patch(read(j,"Class_da.class"),"Class_da"),del=patch(read(j,"CharacterDelete.class"),"CharacterDelete");j.close();FileOutputStream f=new FileOutputStream("classes/OfflineStartMenu.class");f.write(menu());f.close();f=new FileOutputStream("classes/Class_da.class");f.write(da);f.close();f=new FileOutputStream("classes/CharacterDelete.class");f.write(del);f.close();}
          }
          JAVA
          javac -cp asm.jar:asm-tree.jar -d classes src/Build.java
          java -cp asm.jar:asm-tree.jar:classes Build
          jar uf game.jar -C classes OfflineStartMenu.class -C classes Class_da.class -C classes CharacterDelete.class
          zip -d game.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          unzip -t game.jar >/dev/null
          javap -classpath game.jar -p OfflineStartMenu > menu.txt
          javap -classpath game.jar -p -c Class_da > da.txt
          javap -classpath game.jar -p -c CharacterDelete > del.txt
          grep -q 'OfflineStartMenu.show' da.txt
          grep -q 'OfflineStartMenu.deleteCurrent' del.txt
          grep -q 'clearPrimary' menu.txt
          jar tf game.jar | grep -q '^NativeCatalog.class$'
          ! jar tf game.jar | grep -q '^ItemCatalogGrid.class$'
          ! jar tf game.jar | grep -q '^FakeClassState.class$'
          git worktree add /tmp/feature origin/chatgpt/save-menu-redesign
          cp game.jar /tmp/feature/Nso_Offline_By_h0901.jar
          cd /tmp/feature
          rm -rf .github save_menu_inspect start_flow_inspect
          rm -f startup_debug.txt startup_refs.txt startup_refs_small.txt core_start_debug.txt ds_login_focus.txt Class_ds.java.txt ds_bytecode_focus.txt
          git add -A
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'feat: redesign startup save menu with permanent delete'
          git push --force-with-lease origin HEAD:chatgpt/save-menu-redesign
      - name: Clean main temporary files
        if: always()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          git checkout main && git pull --ff-only origin main
          rm -rf .github
          rm -f startup_debug.txt startup_refs.txt startup_refs_small.txt core_start_debug.txt ds_login_focus.txt Class_ds.java.txt ds_bytecode_focus.txt
          git add -A
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: clean temporary startup files' || true
          git push origin main || true
