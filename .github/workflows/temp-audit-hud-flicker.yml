name: Temporary audit HUD flicker
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-audit-hud-flicker.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace HUD state transitions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hudflicker && mkdir -p /tmp/hudflicker && cd /tmp/hudflicker
          jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          {
            echo '=== ALL WRITES TO Class_cy.gc ==='
            for c in *.class; do
              javap -p -c "$c" > /tmp/j.txt 2>/dev/null || continue
              if grep -q 'putfield .*Field Class_cy.gc:Z' /tmp/j.txt; then
                echo "--- $c ---"
                grep -n -B35 -A35 'putfield .*Field Class_cy.gc:Z' /tmp/j.txt || true
              fi
            done
            echo
            echo '=== ALL READS OF Class_cy.gc ==='
            for c in *.class; do
              javap -p -c "$c" > /tmp/j.txt 2>/dev/null || continue
              if grep -q 'getfield .*Field Class_cy.gc:Z' /tmp/j.txt; then
                echo "--- $c ---"
                grep -n -B18 -A25 'getfield .*Field Class_cy.gc:Z' /tmp/j.txt || true
              fi
            done
            echo
            echo '=== Class_ct.at() ==='
            javap -p -c Class_ct.class > /tmp/ct.txt
            python - <<'PY'
          import re
          t=open('/tmp/ct.txt').read()
          m=re.search(r'\n  (?:public |private |protected |static |final )*void at\(\);\n    Code:\n(.*?)(?=\n  [^ ].*;\n|\Z)',t,re.S)
          print(m.group(0) if m else 'NOT FOUND')
          PY
            echo
            echo '=== callers of Class_ct.at() ==='
            for c in *.class; do
              javap -p -c "$c" > /tmp/j.txt 2>/dev/null || continue
              if grep -q 'Method Class_ct.at:()V' /tmp/j.txt; then
                echo "--- $c ---"
                grep -n -B25 -A25 'Method Class_ct.at:()V' /tmp/j.txt || true
              fi
            done
            echo
            echo '=== k32.e() and callers ==='
            javap -p -c k32.class
            for c in *.class; do
              javap -p -c "$c" > /tmp/j.txt 2>/dev/null || continue
              if grep -q 'Method k32.e:()V' /tmp/j.txt; then
                echo "--- caller $c ---"
                grep -n -B30 -A30 'Method k32.e:()V' /tmp/j.txt || true
              fi
            done
            echo
            echo '=== skill ids 85..90 references in non-k25 classes ==='
            for c in *.class; do
              case "$c" in k25.class|k24.class) continue;; esac
              javap -p -c "$c" > /tmp/j.txt 2>/dev/null || continue
              if grep -Eq 'bipush +(85|86|87|88|89|90)([^0-9]|$)' /tmp/j.txt; then
                echo "--- $c ---"
                grep -n -E -B25 -A35 'bipush +(85|86|87|88|89|90)([^0-9]|$)' /tmp/j.txt || true
              fi
            done
            echo
            echo '=== Class_ct paint HUD gate around gc ==='
            grep -n -B50 -A100 '6072: getfield.*Field Class_cy.gc:Z' /tmp/ct.txt || true
          } > "$GITHUB_WORKSPACE/hud_flicker_audit.txt"
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hud_flicker_audit.txt
          git commit -m "chore: audit transient HUD flicker"
          git push
