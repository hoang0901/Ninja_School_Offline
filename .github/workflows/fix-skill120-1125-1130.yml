name: Inspect k24 point lookup
on:
  push:
    branches: [fix-skill120-1125-1130]
    paths: ['.github/workflows/fix-skill120-1125-1130.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump k24 lookup
        shell: bash
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          LOG="$GITHUB_WORKSPACE/skill120_k24_lookup.txt"
          rm -rf /tmp/k24 && mkdir /tmp/k24 && (cd /tmp/k24 && jar xf "$JAR")
          cd /tmp/k24
          {
            echo '=== k24 signatures ==='
            javap -classpath . -p k24
            echo '=== k24 bytecode ==='
            javap -classpath . -c -p k24
          } > "$LOG"
          cat "$LOG"
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_k24_lookup.txt || true
          git commit -m 'chore: inspect k24 point lookup' || exit 0
          git push origin fix-skill120-1125-1130
