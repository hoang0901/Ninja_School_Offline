name: Inspect Obito Sakura resources

on:
  push:
    branches: [fix-obito-sakura]
    paths:
      - '.github/workflows/inspect-obito-sakura.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-obito-sakura
          path: offline
      - name: Inspect offline pack index
        shell: bash
        run: |
          set -euo pipefail
          OFF="$GITHUB_WORKSPACE/offline"
          WORK="$RUNNER_TEMP/nso_index"
          REPORT="$OFF/obito_sakura_index.txt"
          mkdir -p "$WORK/jar"
          (cd "$WORK/jar" && jar xf "$OFF/Nso_Offline_By_h0901.jar")
          {
            echo '=== PACK MANIFEST ==='
            cat "$WORK/jar/offline/packs/manifest.json" || true
            echo
            echo '=== FULL MANIFEST - TARGET/SMALL/PART LINES ==='
            grep -iE '230|231|232|233|234|235|3421|3422|small|part|image' "$WORK/jar/offline/full/manifest.json" | head -n 500 || true
            echo
            echo '=== INDEX.BIN HEADER/STRINGS ==='
            xxd -g1 -l 512 "$WORK/jar/offline/packs/index.bin" || true
            strings "$WORK/jar/offline/packs/index.bin" | head -n 500 || true
            echo
            echo '=== LOADER CLASSES ==='
            cd "$WORK/jar"
            for c in *.class; do
              if strings "$c" | grep -qiE 'offline/packs|index\.bin|\.pak'; then
                echo "===== ${c%.class} ====="
                strings "$c" | grep -iE 'offline|packs|index|\.pak|small|image|part|read|offset|length' || true
                javap -classpath "$WORK/jar" -c -p "${c%.class}" 2>/dev/null || true
              fi
            done
          } > "$REPORT"
      - name: Commit index report
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/offline"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add obito_sakura_index.txt
          git commit -m 'chore: inspect offline pack index format' || exit 0
          git push origin fix-obito-sakura
