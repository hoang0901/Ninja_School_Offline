name: Temporary k24 callers

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-k24-callers.yml]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find callers of k24.a(int)
        shell: bash
        run: |
          set -euo pipefail
          : > k24_callers.txt
          for c in $(jar tf Nso_Offline_By_h0901.jar | grep '^[^/]*\.class$' | sed 's/\.class$//'); do
            out=$(javap -classpath Nso_Offline_By_h0901.jar -c -p "$c" 2>/dev/null || true)
            if printf '%s\n' "$out" | grep -q 'Method k24.a:(I)I'; then
              echo "===== $c =====" >> k24_callers.txt
              printf '%s\n' "$out" | grep -n -C 25 'Method k24.a:(I)I' >> k24_callers.txt
            fi
          done
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k24_callers.txt
          git commit -m "chore: temporary k24 caller report"
          git push
