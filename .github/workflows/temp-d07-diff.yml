name: Temporary d07 diff

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-d07-diff.yml]

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare d07 before and after skill-120 changes
        shell: python
        run: |
          import subprocess, zipfile, hashlib
          before='15094ae1953e93b6c3a8ceb26aa3ef350dafc674'
          with open('/tmp/before.jar','wb') as out:
            subprocess.run(['git','show',f'{before}:Nso_Offline_By_h0901.jar'],stdout=out,check=True)
          with zipfile.ZipFile('/tmp/before.jar') as z: a=z.read('offline/packs/d07.pak')
          with zipfile.ZipFile('Nso_Offline_By_h0901.jar') as z: b=z.read('offline/packs/d07.pak')
          p=0
          m=min(len(a),len(b))
          while p<m and a[p]==b[p]: p+=1
          s=0
          while s < (m-p) and a[len(a)-1-s]==b[len(b)-1-s]: s+=1
          a_end=len(a)-s if s else len(a)
          b_end=len(b)-s if s else len(b)
          with open('d07_diff_report.txt','w') as f:
            f.write(f'before len={len(a)} sha256={hashlib.sha256(a).hexdigest()}\n')
            f.write(f'after  len={len(b)} sha256={hashlib.sha256(b).hexdigest()}\n')
            f.write(f'common_prefix={p}\ncommon_suffix={s}\n')
            f.write(f'before_changed=[{p}:{a_end}] len={a_end-p}\n')
            f.write(f'after_changed=[{p}:{b_end}] len={b_end-p}\n')
            f.write('before_hex='+a[p:min(a_end,p+2048)].hex()+'\n')
            f.write('after_hex='+b[p:min(b_end,p+8192)].hex()+'\n')
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add d07_diff_report.txt
          git commit -m "chore: temporary d07 skill diff"
          git push
