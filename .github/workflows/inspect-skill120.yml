name: Inspect k8 skill 120 handler
on:
  push:
    branches: [fix-skill120-learning]
    paths: ['.github/workflows/inspect-skill120.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump k8 and state API
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/skill120_k8.txt"
          exec > >(tee "$LOG") 2>&1
          rm -rf /tmp/jar && mkdir /tmp/jar && (cd /tmp/jar && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar")
          cd /tmp/jar
          echo '=== K8 ==='
          javap -classpath . -c -p k8
          echo '=== K8 STRINGS ==='
          strings k8.class
          echo '=== STATE ==='
          javap -classpath . -p 'DoHoang091$k0'
          echo '=== K16 ==='
          javap -classpath . -c -p k16
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_k8.txt || true
          git commit -m 'chore: inspect k8 skill 120 handler' || exit 0
          git push origin fix-skill120-learning
