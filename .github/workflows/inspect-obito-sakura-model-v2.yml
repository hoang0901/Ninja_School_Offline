name: Inspect Obito Sakura model v2
on:
  push:
    branches: [fix-obito-sakura-model-v2]
    paths: ['.github/workflows/inspect-obito-sakura-model-v2.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace exact item equip path
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/model_v2_equip_trace.txt"
          exec > >(tee "$LOG") 2>&1
          git clone --depth 1 https://github.com/hoang0901/Nso_Folder.git /tmp/ref >/dev/null 2>&1
          CHAR=/tmp/ref/NinjaSchoolOffline_by_dohoang091/src/main/java/Exe_Z/model/Char.java
          echo '=== REFERENCE CHAR 21980-22120 ==='
          sed -n '21980,22120p' "$CHAR"
          echo '=== REFERENCE CHAR 22220-22320 ==='
          sed -n '22220,22320p' "$CHAR"
          echo '=== REFERENCE Service appearance packet 1680-1725 ==='
          sed -n '1680,1725p' /tmp/ref/NinjaSchoolOffline_by_dohoang091/src/main/java/Exe_Z/network/Service.java
          echo '=== TARGET BYTECODE item IDs 1173/1174 and known fashion 1084 ==='
          rm -rf /tmp/jar && mkdir /tmp/jar && (cd /tmp/jar && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar")
          cd /tmp/jar
          for c in *.class; do
            j=$(javap -classpath . -c -p "${c%.class}" 2>/dev/null || true)
            if printf '%s\n' "$j" | grep -qE 'sipush[[:space:]]+(1173|1174|1084)'; then
              echo "===== ${c%.class} ====="
              printf '%s\n' "$j" | grep -n -B45 -A70 -E 'sipush[[:space:]]+(1173|1174|1084)' | head -n 700 || true
            fi
          done
          echo '=== TARGET BYTECODE fashion roots 174/177/230/233 filtered methods ==='
          for c in *.class; do
            j=$(javap -classpath . -c -p "${c%.class}" 2>/dev/null || true)
            if printf '%s\n' "$j" | grep -qE 'sipush[[:space:]]+(174|177|230|233)'; then
              echo "===== ${c%.class} ====="
              printf '%s\n' "$j" | grep -n -B35 -A60 -E 'sipush[[:space:]]+(174|177|230|233)' | head -n 500 || true
            fi
          done
      - name: Commit trace
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model_v2_equip_trace.txt
          git commit -m 'chore: trace exact Obito Sakura equip path' || exit 0
          git push origin fix-obito-sakura-model-v2
