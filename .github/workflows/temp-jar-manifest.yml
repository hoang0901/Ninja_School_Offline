name: Temporary JAR manifest

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-jar-manifest.yml

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate entry hashes
        shell: python
        run: |
          import zipfile, hashlib
          jar='Nso_Offline_By_h0901.jar'
          with zipfile.ZipFile(jar) as z, open('jar_manifest.txt','w',encoding='utf-8') as f:
              for n in sorted(z.namelist()):
                  data=z.read(n)
                  f.write(f'{hashlib.sha256(data).hexdigest()}\t{len(data)}\t{n}\n')
      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jar_manifest.txt
          git commit -m "chore: temporary JAR manifest"
          git push
