name: Fix character delete reseed
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-fix-delete-reseed.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch delete persistence and disable admin reseed after manual delete
        shell: bash
        run: |
          set -euo pipefail
          J=Nso_Offline_By_h0901.jar
          curl -fsSL -o /tmp/javassist.jar https://repo1.maven.org/maven2/org/javassist/javassist/3.30.2-GA/javassist-3.30.2-GA.jar
          cat >/tmp/PatchDelete.java <<'JAVA'
          import javassist.*;
          public class PatchDelete {
            public static void main(String[] args) throws Exception {
              String jar=args[0];
              ClassPool pool=new ClassPool(true);
              pool.insertClassPath(jar);

              CtClass main=pool.get("DoHoang091");
              try { main.getDeclaredField("manualDeleteSeedBlocked"); }
              catch (NotFoundException e) { main.addField(CtField.make("private static boolean manualDeleteSeedBlocked = false;", main)); }
              try { main.getDeclaredMethod("blockAdminSeedAfterDelete"); }
              catch (NotFoundException e) {
                CtMethod m=CtNewMethod.make("static void blockAdminSeedAfterDelete(){ manualDeleteSeedBlocked=true; try { javax.microedition.rms.RecordStore rs=javax.microedition.rms.RecordStore.openRecordStore(\"nso_manual_delete_flag\", true); byte[] b=new byte[]{1}; if(rs.getNumRecords()==0) rs.addRecord(b,0,1); else rs.setRecord(1,b,0,1); rs.closeRecordStore(); } catch(Throwable t){} }", main);
                main.addMethod(m);
              }
              try { main.getDeclaredMethod("isAdminSeedBlocked"); }
              catch (NotFoundException e) {
                CtMethod m=CtNewMethod.make("private static boolean isAdminSeedBlocked(){ if(manualDeleteSeedBlocked) return true; try { javax.microedition.rms.RecordStore rs=javax.microedition.rms.RecordStore.openRecordStore(\"nso_manual_delete_flag\", false); boolean ok=rs!=null && rs.getNumRecords()>0; if(rs!=null) rs.closeRecordStore(); if(ok) manualDeleteSeedBlocked=true; return ok; } catch(Throwable t){ return false; } }", main);
                main.addMethod(m);
              }

              CtMethod ao=main.getDeclaredMethod("ao");
              ao.insertBefore("{ if (isAdminSeedBlocked()) return null; }");
              CtMethod ap=main.getDeclaredMethod("ap");
              ap.insertBefore("{ if (isAdminSeedBlocked()) return false; }");
              main.writeFile("/tmp/delpatch");
              main.detach();

              CtClass del=pool.get("CharacterDelete");
              CtMethod dc=del.getDeclaredMethod("deleteCurrent");
              dc.insertBefore("{ DoHoang091.blockAdminSeedAfterDelete(); }");
              del.writeFile("/tmp/delpatch");
              del.detach();
            }
          }
          JAVA
          rm -rf /tmp/delpatch /tmp/verifydel && mkdir -p /tmp/delpatch /tmp/verifydel
          javac -cp /tmp/javassist.jar /tmp/PatchDelete.java
          java -cp /tmp/javassist.jar:/tmp PatchDelete "$J"
          cp "$J" /tmp/game-del-fixed.jar
          (cd /tmp/delpatch && jar uf /tmp/game-del-fixed.jar DoHoang091.class CharacterDelete.class)
          zip -d /tmp/game-del-fixed.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          unzip -t /tmp/game-del-fixed.jar >/dev/null
          mv /tmp/game-del-fixed.jar "$J"

          curl -fsSL -o /tmp/cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/verifydel >/dev/null 2>&1 || true
          {
            echo '=== CharacterDelete ==='
            grep -n -B10 -A80 'deleteCurrent' /tmp/verifydel/CharacterDelete.java || true
            echo '=== Seed block ==='
            grep -n -B10 -A80 -E 'blockAdminSeedAfterDelete|isAdminSeedBlocked|private static byte\[\] ao\(|private static boolean ap\(' /tmp/verifydel/DoHoang091.java || true
          } > delete_patch_verify.txt
          grep -q 'blockAdminSeedAfterDelete' delete_patch_verify.txt
          grep -q 'nso_manual_delete_flag' /tmp/verifydel/DoHoang091.java
          grep -q 'isAdminSeedBlocked' /tmp/verifydel/DoHoang091.java
      - name: Commit fixed JAR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f delete_live_report.txt 2>/dev/null || true
          git add -- Nso_Offline_By_h0901.jar delete_patch_verify.txt
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'fix: make current character delete persist without admin reseed'
          git push origin HEAD:main
      - name: Remove temporary patch workflow
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-fix-delete-reseed.yml .github/workflows/temp-inspect-delete-live.yml 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore: remove character delete patch workflows' || true
          git push origin HEAD:main || true
