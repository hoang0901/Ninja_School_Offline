name: Map hoang appearance fields
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-map-hoang-fields.yml]
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Map fields
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mapf && mkdir -p /tmp/mapf/out
          cd /tmp/mapf
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" --outputdir out >/dev/null 2>&1 || true
          F=$(find out -name 'DoHoang091.java' | head -n1)
          {
            echo '=== CLASS MAP ==='
            sed -n '1235,1285p' "$F" || true
            echo '=== P USES ==='
            grep -n -B5 -A8 -E '\.p([^A-Za-z0-9_]|$)' "$F" | head -n 800 || true
            echo '=== Q USES ==='
            grep -n -B5 -A8 -E '\.q([^A-Za-z0-9_]|$)' "$F" | head -n 800 || true
            echo '=== CREATE/SELECT PACKET ==='
            grep -n -B15 -A35 -E 'new k0\(|readByte\(\).*readUnsignedByte|writeByte\(.*\.p|writeShort\(.*\.q' "$F" | head -n 1000 || true
          } > "$GITHUB_WORKSPACE/hoang_field_map.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add -- hoang_field_map.txt
          git commit -m 'chore: capture hoang field map' || true
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-map-hoang-fields.yml || true
          git config user.name ChatGPT
          git config user.email actions@github.com
          git commit -m 'chore: remove hoang field mapper' || true
          git push origin HEAD:main || true
