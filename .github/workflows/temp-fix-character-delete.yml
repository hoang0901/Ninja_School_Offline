name: temp fix character delete
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-fix-character-delete.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch only CharacterDelete
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chardel && mkdir -p /tmp/chardel/src /tmp/chardel/classes
          cd /tmp/chardel
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          curl -fsSL -o asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar
          cat > src/Build.java <<'JAVA'
          import java.io.*;
          import java.util.jar.*;
          import org.objectweb.asm.*;
          import org.objectweb.asm.tree.*;
          import static org.objectweb.asm.Opcodes.*;
          public final class Build {
            static byte[] read(JarFile j,String n)throws Exception{InputStream i=j.getInputStream(j.getJarEntry(n));ByteArrayOutputStream b=new ByteArrayOutputStream();byte[] x=new byte[8192];int r;while((r=i.read(x))!=-1)b.write(x,0,r);i.close();return b.toByteArray();}
            static byte[] patch(byte[] in){
              ClassNode c=new ClassNode(); new ClassReader(in).accept(c,0);
              for(Object o:c.methods){MethodNode m=(MethodNode)o;if(m.name.equals("deleteCurrent")&&m.desc.equals("()Z")){
                m.instructions.clear();m.tryCatchBlocks.clear();if(m.localVariables!=null)m.localVariables.clear();InsnList x=m.instructions;
                LabelNode bad=new LabelNode(), nz=new LabelNode(), idx=new LabelNode(), tail=new LabelNode(), after=new LabelNode(), rem=new LabelNode(), oi=new LabelNode(), si=new LabelNode();
                x.add(new FieldInsnNode(GETSTATIC,"DoHoang091","aj","[LDoHoang091$k0;"));x.add(new VarInsnNode(ASTORE,0));
                x.add(new FieldInsnNode(GETSTATIC,"DoHoang091","ak","I"));x.add(new VarInsnNode(ISTORE,1));
                x.add(new VarInsnNode(ALOAD,0));x.add(new JumpInsnNode(IFNULL,bad));x.add(new VarInsnNode(ALOAD,0));x.add(new InsnNode(ARRAYLENGTH));x.add(new JumpInsnNode(IFNE,nz));
                x.add(bad);x.add(new InsnNode(ICONST_0));x.add(new InsnNode(IRETURN));
                x.add(nz);x.add(new VarInsnNode(ILOAD,1));x.add(new JumpInsnNode(IFLT,bad));x.add(new VarInsnNode(ILOAD,1));x.add(new VarInsnNode(ALOAD,0));x.add(new InsnNode(ARRAYLENGTH));x.add(new JumpInsnNode(IF_ICMPLT,idx));x.add(new JumpInsnNode(GOTO,bad));
                x.add(idx);x.add(new VarInsnNode(ALOAD,0));x.add(new InsnNode(ARRAYLENGTH));x.add(new InsnNode(ICONST_1));x.add(new InsnNode(ISUB));x.add(new TypeInsnNode(ANEWARRAY,"DoHoang091$k0"));x.add(new VarInsnNode(ASTORE,2));
                x.add(new VarInsnNode(ILOAD,1));x.add(new JumpInsnNode(IFLE,tail));x.add(new VarInsnNode(ALOAD,0));x.add(new InsnNode(ICONST_0));x.add(new VarInsnNode(ALOAD,2));x.add(new InsnNode(ICONST_0));x.add(new VarInsnNode(ILOAD,1));x.add(new MethodInsnNode(INVOKESTATIC,"java/lang/System","arraycopy","(Ljava/lang/Object;ILjava/lang/Object;II)V",false));
                x.add(tail);x.add(new VarInsnNode(ILOAD,1));x.add(new VarInsnNode(ALOAD,0));x.add(new InsnNode(ARRAYLENGTH));x.add(new InsnNode(ICONST_1));x.add(new InsnNode(ISUB));x.add(new JumpInsnNode(IF_ICMPGE,after));x.add(new VarInsnNode(ALOAD,0));x.add(new VarInsnNode(ILOAD,1));x.add(new InsnNode(ICONST_1));x.add(new InsnNode(IADD));x.add(new VarInsnNode(ALOAD,2));x.add(new VarInsnNode(ILOAD,1));x.add(new VarInsnNode(ALOAD,0));x.add(new InsnNode(ARRAYLENGTH));x.add(new VarInsnNode(ILOAD,1));x.add(new InsnNode(ISUB));x.add(new InsnNode(ICONST_1));x.add(new InsnNode(ISUB));x.add(new MethodInsnNode(INVOKESTATIC,"java/lang/System","arraycopy","(Ljava/lang/Object;ILjava/lang/Object;II)V",false));
                x.add(after);x.add(new VarInsnNode(ALOAD,2));x.add(new FieldInsnNode(PUTSTATIC,"DoHoang091","aj","[LDoHoang091$k0;"));
                x.add(new VarInsnNode(ALOAD,2));x.add(new InsnNode(ARRAYLENGTH));x.add(new JumpInsnNode(IFNE,rem));
                // Last character: delete primary save RMS completely, keep backup stores untouched.
                LabelNode a=new LabelNode(),b=new LabelNode(),h1=new LabelNode(),d=new LabelNode(),e=new LabelNode(),h2=new LabelNode(),z=new LabelNode();
                m.tryCatchBlocks.add(new TryCatchBlockNode(a,b,h1,"java/lang/Throwable"));x.add(a);x.add(new LdcInsnNode("ninja_school_offline_v3"));x.add(new MethodInsnNode(INVOKESTATIC,"javax/microedition/rms/RecordStore","deleteRecordStore","(Ljava/lang/String;)V",false));x.add(b);x.add(new JumpInsnNode(GOTO,d));x.add(h1);x.add(new InsnNode(POP));x.add(d);
                m.tryCatchBlocks.add(new TryCatchBlockNode(d,e,h2,"java/lang/Throwable"));x.add(new LdcInsnNode("nso_offline_e72_v2"));x.add(new MethodInsnNode(INVOKESTATIC,"javax/microedition/rms/RecordStore","deleteRecordStore","(Ljava/lang/String;)V",false));x.add(e);x.add(new JumpInsnNode(GOTO,z));x.add(h2);x.add(new InsnNode(POP));x.add(z);
                x.add(new InsnNode(ICONST_0));x.add(new TypeInsnNode(ANEWARRAY,"DoHoang091$k0"));x.add(new FieldInsnNode(PUTSTATIC,"DoHoang091","aj","[LDoHoang091$k0;"));x.add(new InsnNode(ICONST_0));x.add(new FieldInsnNode(PUTSTATIC,"DoHoang091","ak","I"));x.add(new InsnNode(ICONST_1));x.add(new FieldInsnNode(PUTSTATIC,"DoHoang091","an","Z"));x.add(new InsnNode(ICONST_1));x.add(new InsnNode(IRETURN));
                x.add(rem);x.add(new VarInsnNode(ILOAD,1));x.add(new VarInsnNode(ALOAD,2));x.add(new InsnNode(ARRAYLENGTH));x.add(new JumpInsnNode(IF_ICMPLT,oi));x.add(new VarInsnNode(ALOAD,2));x.add(new InsnNode(ARRAYLENGTH));x.add(new InsnNode(ICONST_1));x.add(new InsnNode(ISUB));x.add(new JumpInsnNode(GOTO,si));x.add(oi);x.add(new VarInsnNode(ILOAD,1));x.add(si);x.add(new FieldInsnNode(PUTSTATIC,"DoHoang091","ak","I"));x.add(new InsnNode(ICONST_1));x.add(new FieldInsnNode(PUTSTATIC,"DoHoang091","an","Z"));x.add(new MethodInsnNode(INVOKESTATIC,"DoHoang091","as","()V",false));x.add(new MethodInsnNode(INVOKESTATIC,"DoHoang091","U","()V",false));x.add(new InsnNode(ICONST_1));x.add(new InsnNode(IRETURN));
                m.maxLocals=3;m.maxStack=8;
              }}
              ClassWriter w=new ClassWriter(ClassWriter.COMPUTE_MAXS);c.accept(w);return w.toByteArray();
            }
            public static void main(String[] a)throws Exception{JarFile j=new JarFile("game.jar");byte[] out=patch(read(j,"CharacterDelete.class"));j.close();FileOutputStream f=new FileOutputStream("classes/CharacterDelete.class");f.write(out);f.close();}
          }
          JAVA
          javac -cp asm.jar:asm-tree.jar -d classes src/Build.java
          java -cp asm.jar:asm-tree.jar:classes Build
          jar uf game.jar -C classes CharacterDelete.class
          zip -d game.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          unzip -t game.jar >/dev/null
          javap -classpath game.jar -c -p CharacterDelete > del.txt
          grep -q 'DoHoang091.as' del.txt
          grep -q 'DoHoang091.U' del.txt
          grep -q 'ninja_school_offline_v3' del.txt
          if jar tf game.jar | grep -Fxq 'OfflineStartMenu.class'; then echo 'unexpected OfflineStartMenu'; exit 1; fi
          if jar tf game.jar | grep -Fxq 'ItemCatalogGrid.class'; then echo 'unexpected ItemCatalogGrid'; exit 1; fi
          if jar tf game.jar | grep -Fxq 'FakeClassState.class'; then echo 'unexpected FakeClassState'; exit 1; fi
          git fetch origin chatgpt/fix-character-delete
          git checkout -B publish origin/chatgpt/fix-character-delete
          cp game.jar Nso_Offline_By_h0901.jar
          rm -rf .github character_delete_inspect.txt
          git add Nso_Offline_By_h0901.jar
          git rm -r --ignore-unmatch .github character_delete_inspect.txt
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'fix: permanently delete current character'
          git push --force origin HEAD:chatgpt/fix-character-delete
      - name: Clean main temp files
        if: always()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main
          rm -rf .github character_delete_inspect.txt
          git add -A
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'chore: clean character delete temp files' || true
          git push origin main || true
