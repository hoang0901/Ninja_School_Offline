name: Temporary trade input focus
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-trade-input-focus.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract trade inventory input path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tinput && mkdir -p /tmp/tinput/out /tmp/tinput/report
          cd /tmp/tinput
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          unzip -p game.jar Class_ct.class > Class_ct.class
          java -jar cfr.jar Class_ct.class --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          import re
          ls=Path('out/Class_ct.java').read_text(errors='replace').splitlines()
          sig=re.compile(r'^\s*(public|private|protected)\s+.*\([^;]*\)\s*(throws\s+[^\{]+)?\{\s*$')
          def bounds(i):
            a=i
            while a>=0 and not sig.match(ls[a]): a-=1
            if a<0:return None
            bal=0; seen=False
            for b in range(a,len(ls)):
              bal += ls[b].count('{')-ls[b].count('}')
              if '{' in ls[b]: seen=True
              if seen and bal==0:return a,b
          out=[]; seen=set()
          for i,l in enumerate(ls):
            # exact trade inventory selection indicators
            if ('ba ? 1 : 0' in l or 'Class_cy.aa().bk[bz]' in l or 'Class_cy.aa().bk[Class_ct.bz]' in l) and ('fm' in '\n'.join(ls[max(0,i-80):min(len(ls),i+80)]) or 'ba' in '\n'.join(ls[max(0,i-80):min(len(ls),i+80)])):
              x=bounds(i)
              if not x or x in seen: continue
              a,b=x; block='\n'.join(ls[a:b+1])
              if 'ba' in block and 'fm' in block and ('bk[bz]' in block or 'bk[Class_ct.bz]' in block):
                seen.add(x); out.append('===== %d-%d %s =====\n%s\n'%(a+1,b+1,ls[a].strip(),block))
          Path('report/input.txt').write_text('\n'.join(out))
          PY
          git -C "$GITHUB_WORKSPACE" checkout chatgpt/native-catalog-inventory-ui
          rm -rf "$GITHUB_WORKSPACE/native_trade_input"
          cp -r report "$GITHUB_WORKSPACE/native_trade_input"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native_trade_input
          git diff --cached --quiet || git commit -m "chore: inspect native trade inventory input"
          git push origin HEAD:chatgpt/native-catalog-inventory-ui
      - name: Cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main
          git rm -- .github/workflows/temp-trade-input-focus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove trade input inspector"
          git push origin main
