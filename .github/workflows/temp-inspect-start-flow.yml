name: Inspect startup save flow
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-start-flow.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decompile startup flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/startinspect && mkdir -p /tmp/startinspect/out
          cd /tmp/startinspect
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar game.jar --outputdir out >/dev/null 2>&1 || true
          mkdir -p /tmp/startfiles
          for f in Class_da.java Class_do.java DoHoang091.java DoHoang091SaveState.java k20.java CharacterDelete.java; do
            [ -f "out/$f" ] && cp "out/$f" "/tmp/startfiles/$f"
          done
          {
            echo '=== STARTAPP REFERENCES ==='
            grep -RniE 'startApp|Class_da\.b|hasSaveData|backupSave|restoreSave|deleteCurrent|DoHoang091\.U\(|DoHoang091\.as\(|DoHoang091\.aj|DoHoang091\.ak' out | head -n 1200 || true
            echo '=== LOGIN/REGISTER/CHARACTER CREATE ==='
            grep -RniE 'Đăng nhập|Dang nhap|Tài khoản|Tai khoan|Mật khẩu|Mat khau|Đăng ký|Dang ky|Tạo nhân vật|Tao nhan vat|Chơi tiếp|Choi tiep|Chơi mới|Choi moi' out | head -n 1200 || true
          } > /tmp/startfiles/report.txt
          git worktree add /tmp/feature origin/chatgpt/save-menu-redesign
          rm -rf /tmp/feature/start_flow_inspect
          mkdir -p /tmp/feature/start_flow_inspect
          cp /tmp/startfiles/* /tmp/feature/start_flow_inspect/
          cd /tmp/feature
          git add -- start_flow_inspect
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: capture startup flow inspection' || true
          git push origin HEAD:chatgpt/save-menu-redesign
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-inspect-start-flow.yml || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: remove startup inspector' || true
          git push origin main || true
