name: Debug startup classes
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-start-debug.yml]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect and capture regardless of failure
        shell: bash
        run: |
          set +e
          rm -rf /tmp/startdebug /tmp/feature
          mkdir -p /tmp/startdebug
          cd /tmp/startdebug
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          {
            echo '=== jar class matches ==='
            jar tf game.jar | grep -E '(^|/)(Class_da|Class_do|DoHoang091|CharacterDelete|DoHoang091SaveState|k20)\.class$'
            echo
            echo '=== manifest ==='
            unzip -p game.jar META-INF/MANIFEST.MF
            echo
            echo '=== Class_da javap ==='
            javap -classpath game.jar -p -c Class_da
            echo "Class_da_rc=$?"
            echo
            echo '=== Class_do javap ==='
            javap -classpath game.jar -p -c Class_do
            echo "Class_do_rc=$?"
            echo
            echo '=== DoHoang091 methods ==='
            javap -classpath game.jar -p DoHoang091
            echo "DoHoang091_rc=$?"
          } > report.txt 2>&1
          git worktree add /tmp/feature origin/chatgpt/save-menu-redesign
          mkdir -p /tmp/feature/start_flow_inspect
          cp report.txt /tmp/feature/start_flow_inspect/start_debug.txt
          cd /tmp/feature
          git add -- start_flow_inspect/start_debug.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: capture startup debug' || true
          git push origin HEAD:chatgpt/save-menu-redesign
          exit 0
      - name: Cleanup all temporary startup workflows
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-start-debug.yml .github/workflows/temp-extract-start-classes.yml .github/workflows/temp-javap-start.yml .github/workflows/temp-inspect-start-flow.yml 2>/dev/null || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: clean startup debug workflows' || true
          git push origin main || true
