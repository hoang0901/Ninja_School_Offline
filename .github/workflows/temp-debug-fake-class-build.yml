name: Temporary debug fake class build
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-debug-fake-class-build.yml]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile probes
        shell: bash
        run: |
          set +e
          rm -rf /tmp/fakedebug && mkdir -p /tmp/fakedebug && cd /tmp/fakedebug
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          {
            echo '=== Java ==='; java -version; javac -version
            echo '=== Probe access ==='
            cat > Probe.java <<'EOF'
          public class Probe {
            public static void main(String[] x) throws Throwable {
              DoHoang091.G();
              DoHoang091.H();
              System.out.println(DoHoang091.a((byte)1));
              DoHoang091.a("probe");
              CharacterDelete.deleteCurrent();
              InventoryClear.clearCurrentBag();
            }
          }
          EOF
            javac --release 8 -cp game.jar Probe.java
            echo "probe_rc=$?"
            echo '=== k25 bx sequence count ==='
            jar xf game.jar k25.class DoHoang091.class META-INF/MANIFEST.MF
            javap -p -c k25.class | grep -B2 -A4 'Field DoHoang091\$k0.bx:B' | head -120
            echo '=== class name prologue ==='
            javap -p -c DoHoang091.class | grep -A18 'static java.lang.String a(byte)' | head -25
            echo '=== manifest ==='; cat META-INF/MANIFEST.MF
          } > "$GITHUB_WORKSPACE/fake_build_debug.txt" 2>&1
      - name: Commit debug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fake_build_debug.txt
          git commit -m "chore: capture fake class build diagnostics"
          git push
