name: Split item metadata
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-split-item-meta.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decompile item metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/meta && mkdir -p /tmp/meta/out
          cd /tmp/meta
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          for cls in Class_fe Class_dn Class_fj k1d; do
            unzip -p game.jar "$cls.class" > "$cls.class"
            java -jar cfr.jar "$cls.class" --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          done
          cd "$GITHUB_WORKSPACE"
          git fetch origin chatgpt/catalog-by-type-v2
          git checkout chatgpt/catalog-by-type-v2
          mkdir -p catalog_inspect
          cp /tmp/meta/out/Class_fe.java catalog_inspect/Class_fe.java.txt
          cp /tmp/meta/out/Class_dn.java catalog_inspect/Class_dn.java.txt
          cp /tmp/meta/out/Class_fj.java catalog_inspect/Class_fj.java.txt
          cp /tmp/meta/out/k1d.java catalog_inspect/k1d.java.txt
          git add -- catalog_inspect/Class_fe.java.txt catalog_inspect/Class_dn.java.txt catalog_inspect/Class_fj.java.txt catalog_inspect/k1d.java.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect item metadata fields' || true
          git push origin HEAD:chatgpt/catalog-by-type-v2
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-split-item-meta.yml || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: remove item metadata inspector' || true
          git push origin main || true
