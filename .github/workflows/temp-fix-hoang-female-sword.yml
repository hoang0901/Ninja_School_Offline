name: Fix hoang female sword
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-fix-hoang-female-sword.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch hoang character normalization
        shell: bash
        run: |
          set -euo pipefail
          J=Nso_Offline_By_h0901.jar
          curl -fsSL -o /tmp/javassist.jar https://repo1.maven.org/maven2/org/javassist/javassist/3.30.2-GA/javassist-3.30.2-GA.jar
          cat >/tmp/PatchHoang.java <<'JAVA'
          import javassist.*;
          public class PatchHoang {
            public static void main(String[] args) throws Exception {
              String jar = args[0];
              ClassPool pool = new ClassPool(true);
              pool.insertClassPath(jar);
              CtClass cc = pool.get("DoHoang091");
              CtMethod m = cc.getDeclaredMethod("zHoangVipStarter");
              m.setBody("{ if (as == null && aj != null) { for (int i = 0; i < aj.length; ++i) { if (aj[i] == null || aj[i].a == null || !\"hoang\".equalsIgnoreCase(aj[i].a)) continue; aj[i].p = (byte)1; aj[i].q = (short)2; aj[i].bx = (byte)1; DoHoang091.l(aj[i]); an = true; DoHoang091.as(); break; } } }");
              cc.writeFile("/tmp/hoangpatch");
              cc.detach();
            }
          }
          JAVA
          rm -rf /tmp/hoangpatch && mkdir -p /tmp/hoangpatch
          javac -cp /tmp/javassist.jar /tmp/PatchHoang.java
          java -cp /tmp/javassist.jar:/tmp PatchHoang "$J"
          test -f /tmp/hoangpatch/DoHoang091.class
          cp "$J" /tmp/game-patched.jar
          (cd /tmp/hoangpatch && jar uf /tmp/game-patched.jar DoHoang091.class)
          unzip -t /tmp/game-patched.jar >/dev/null
          mv /tmp/game-patched.jar "$J"

          curl -fsSL -o /tmp/cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          rm -rf /tmp/verify && mkdir /tmp/verify
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/verify >/dev/null 2>&1 || true
          F=/tmp/verify/DoHoang091.java
          test -f "$F"
          grep -n -A25 -B3 'zHoangVipStarter' "$F" > hoang_patch_verify.txt
          grep -q 'aj\[i\]\.p = (byte)1' hoang_patch_verify.txt
          grep -q 'aj\[i\]\.q = (short)2' hoang_patch_verify.txt
          grep -q 'aj\[i\]\.bx = (byte)1' hoang_patch_verify.txt
          if grep -q 'k02.r >= 130' hoang_patch_verify.txt; then
            echo 'old level-130 guard still present' >&2
            exit 1
          fi
      - name: Commit fixed JAR and clean reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f hoang_live_inspect.txt hoang_focused.txt hoang_field_map.txt 2>/dev/null || true
          git add -- Nso_Offline_By_h0901.jar hoang_patch_verify.txt
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'fix: force hoang female sword appearance without resetting save'
          git push origin HEAD:main
      - name: Remove temporary patch workflow
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-fix-hoang-female-sword.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore: remove hoang female sword patcher' || true
          git push origin HEAD:main || true
