name: Find startup references
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-find-start-refs.yml]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan bytecode references
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jscan && mkdir -p /tmp/jscan
          cd /tmp/jscan
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          : > refs.txt
          jar tf game.jar | grep '\.class$' | sed 's#/#.#g;s#\.class$##' | while read cls; do
            javap -classpath game.jar -p -c "$cls" 2>/dev/null | grep -E -B8 -A16 'DoHoang091\.(connect|backupSave|restoreSave)|DoHoang091SaveState\.hasSaveData|Class_do\.b|Display\.setCurrent' && echo "=== CLASS $cls ===" || true
          done >> refs.txt
          for cls in Class_ds Class_ha Class_ew Class_fp Class_by; do
            echo "=== FULL $cls ===" >> refs.txt
            javap -classpath game.jar -p -c "$cls" >> refs.txt 2>&1 || true
          done
          cp refs.txt "$GITHUB_WORKSPACE/startup_refs.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- startup_refs.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: capture startup refs'
          git push origin main
