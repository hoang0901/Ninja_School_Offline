name: Temporary inspect item catalog main
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-item-catalog-main.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompile only inventory classes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nsosingle "$GITHUB_WORKSPACE/item_diag14"
          mkdir -p /tmp/nsosingle/classes "$GITHUB_WORKSPACE/item_diag14"
          cd /tmp/nsosingle
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          unzip -q game.jar 'Class_ct.class' 'Class_fj.class' 'Class_cy.class' 'Class_fe.class' -d classes
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          for c in Class_ct Class_fj Class_cy Class_fe; do
            java -jar cfr.jar "classes/$c.class" --extraclasspath game.jar --outputdir out --silent true >/tmp/${c}.log 2>&1 || true
          done
          f=out/Class_ct.java
          grep -n -B100 -A700 -E 'void a\(Class_dg [^,]+, Class_fj|Class_fj [^,]+, int [^,]+, int|Class_cy\.aa\(\)\.bk|no =|Class_gd\.ll' "$f" | head -28000 > "$GITHUB_WORKSPACE/item_diag14/Class_ct_itemdraw.txt" || true
          grep -n -B80 -A500 -E 'class Class_fj|Class_fj\(|Class_fe y| y =' out/Class_fj.java | head -18000 > "$GITHUB_WORKSPACE/item_diag14/Class_fj.txt" || true
          grep -n -B80 -A500 -E 'Class_fj\[\] bk| bk =|bk\[' out/Class_cy.java | head -18000 > "$GITHUB_WORKSPACE/item_diag14/Class_cy_bag.txt" || true
          grep -n -B80 -A500 -E 'class Class_fe|short |int |byte |Image|icon|Class_fe\(' out/Class_fe.java | head -18000 > "$GITHUB_WORKSPACE/item_diag14/Class_fe.txt" || true
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- item_diag14
          git diff --cached --quiet && exit 0
          git commit -m "chore: inspect item grid renderer exact"
          git push
