name: Inspect Class_ds startup menu
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-ds-bytecode-focus.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture focused Class_ds bytecode
        run: |
          javap -classpath Nso_Offline_By_h0901.jar -p -c -constants Class_ds > /tmp/ds.txt
          { head -n 180 /tmp/ds.txt; echo '=== REFS ==='; grep -n -E -B15 -A30 'Class_ew|Class_bc|Class_dw|Class_gd|Class_do|DoHoang091|Display|login|connect' /tmp/ds.txt | head -n 2200 || true; } > ds_bytecode_focus.txt
          git add ds_bytecode_focus.txt
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'chore: capture Class_ds startup bytecode'
          git push origin main