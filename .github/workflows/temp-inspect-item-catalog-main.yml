name: Temporary inspect item catalog main
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-item-catalog-main.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shop action implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nsoinspect "$GITHUB_WORKSPACE/item_diag6"
          mkdir -p /tmp/nsoinspect "$GITHUB_WORKSPACE/item_diag6"
          cd /tmp/nsoinspect
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          mkdir cfrout
          java -jar cfr.jar game.jar --outputdir cfrout --silent true >/tmp/cfr.log 2>&1 || true
          f=cfrout/k1d.java
          grep -n -B100 -A500 -E 'case 1014:|case 1015:|case 1032:|case 1034:' "$f" > "$GITHUB_WORKSPACE/item_diag6/k1d_shop_actions.txt" || true
          # Any helper methods called by those actions will usually sit nearby and mention template/item writes.
          grep -n -B60 -A220 -E 'writeShort|writeByte|writeInt|k16\.A\(|k16\.B\(|k16\.G\(' "$f" | head -20000 > "$GITHUB_WORKSPACE/item_diag6/k1d_item_packet_candidates.txt" || true
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- item_diag6
          git diff --cached --quiet && exit 0
          git commit -m "chore: inspect shop action implementation"
          git push
