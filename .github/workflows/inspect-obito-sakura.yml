name: Inspect Obito Sakura resources

on:
  push:
    branches: [fix-obito-sakura]
    paths:
      - '.github/workflows/inspect-obito-sakura.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-obito-sakura
          path: offline
      - uses: actions/checkout@v4
        with:
          repository: hoang0901/Nso_Folder
          ref: main
          path: source
      - name: Inspect packed offline data
        shell: bash
        run: |
          set -euo pipefail
          OFF="$GITHUB_WORKSPACE/offline"
          WORK="$RUNNER_TEMP/nso_pack"
          REPORT="$OFF/obito_sakura_pack.txt"
          mkdir -p "$WORK/jar" "$WORK/javap"
          (cd "$WORK/jar" && jar xf "$OFF/Nso_Offline_By_h0901.jar")
          {
            echo '=== PACK/BIN/NO-EXT FILES ==='
            find "$WORK/jar" -type f \( -iname '*.pak' -o -iname '*.bin' \) -printf '%P\t%s bytes\n' | sort
            echo
            echo '=== OFFLINE DIRECTORY FILES ==='
            find "$WORK/jar/offline" -type f -printf '%P\t%s bytes\n' | sort || true
            echo
            echo '=== STRINGS IN PACK/BIN FILES (selected) ==='
            while IFS= read -r f; do
              echo "--- ${f#$WORK/jar/} ---"
              strings "$f" | head -n 80 || true
            done < <(find "$WORK/jar" -type f \( -iname '*.pak' -o -iname '*.bin' \) | sort)
            echo
            echo '=== CLASSES REFERENCING PAK/BIN/OFFLINE ==='
            for c in "$WORK/jar"/*.class; do
              [ -f "$c" ] || continue
              if strings "$c" | grep -qiE '\.pak|\.bin|offline/|offline|packs'; then
                echo "--- $(basename "$c") ---"
                strings "$c" | grep -iE '\.pak|\.bin|offline/|offline|packs|small|image|part' | head -n 100 || true
              fi
            done
            echo
            echo '=== JAVAP FOR LIKELY OFFLINE CLASSES ==='
            cd "$WORK/jar"
            for c in *.class; do
              cls="${c%.class}"
              if strings "$c" | grep -qiE '\.pak|offline/|packs'; then
                echo "===== $cls ====="
                javap -classpath "$WORK/jar" -c -p "$cls" 2>/dev/null | head -n 1200 || true
              fi
            done
          } > "$REPORT"
      - name: Commit pack report
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/offline"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add obito_sakura_pack.txt
          git commit -m 'chore: inspect packed offline resources' || exit 0
          git push origin fix-obito-sakura
