name: Main find login class
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-main-find-login.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find login candidates
        shell: bash
        run: |
          set -euo pipefail
          echo 'rerun-2'
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          rm -rf /tmp/mainlogin && mkdir -p /tmp/mainlogin
          cd /tmp/mainlogin
          jar tf "$J" | grep '^Class_.*\.class$' | sed 's/\.class$//' > classes.txt
          : > cand.txt
          while read c; do
            javap -classpath "$J" -p "$c" > one.txt 2>/dev/null || continue
            head=$(grep -m1 '^public .*class ' one.txt || true)
            case "$head" in
              *"extends Class_ha implements Class_bx"*)
                fields=$(grep -E '^  (public|private|protected).*;' one.txt | wc -l | tr -d ' ')
                if [ "$fields" -le 30 ]; then echo "$c|$fields|$head" >> cand.txt; fi
              ;;
            esac
          done < classes.txt
          {
            echo '=== CANDIDATES ==='
            cat cand.txt
            echo '=== BYTECODE FOCUS ==='
            cut -d'|' -f1 cand.txt | while read c; do
              echo "##### $c #####"
              javap -classpath "$J" -p -c -verbose "$c" 2>/dev/null | grep -E -n -B5 -A18 'Class_dw|Class_ew|String +#.*(Ch|Sao|Kh|X|Qu|Tài|Máy|Cập)|sipush +8885|sipush +8886|sipush +1000|sipush +1001|sipush +1005|sipush +1006|indServer|lowGraphic' || true
            done
            echo '=== DELETE CALLERS ==='
            for c in $(cat classes.txt); do
              out=$(javap -classpath "$J" -p -c "$c" 2>/dev/null | grep -n -B6 -A12 'CharacterDelete' || true)
              [ -z "$out" ] || { echo "##### $c #####"; echo "$out"; }
            done
          } > "$GITHUB_WORKSPACE/main_login_candidates.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- main_login_candidates.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect login class candidates'
          git push origin main
