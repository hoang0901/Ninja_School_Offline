name: Temporary class diff lv120

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-class-diff-lv120.yml]

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare class entries with pre-lv120 JAR
        shell: python
        run: |
          import subprocess, zipfile, hashlib, os
          before='15094ae1953e93b6c3a8ceb26aa3ef350dafc674'
          with open('/tmp/before.jar','wb') as f:
              subprocess.run(['git','show',f'{before}:Nso_Offline_By_h0901.jar'],stdout=f,check=True)
          cur='Nso_Offline_By_h0901.jar'
          def hashes(path):
              out={}
              with zipfile.ZipFile(path) as z:
                  for n in z.namelist():
                      if n.endswith('.class'):
                          d=z.read(n); out[n]=(hashlib.sha256(d).hexdigest(),len(d))
              return out
          a=hashes('/tmp/before.jar'); b=hashes(cur)
          names=sorted(set(a)|set(b))
          with open('lv120_class_diff.txt','w') as f:
              for n in names:
                  if a.get(n)!=b.get(n):
                      f.write(f'{n}\n  before={a.get(n)}\n  after ={b.get(n)}\n')
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lv120_class_diff.txt
          git commit -m "chore: temporary lv120 class diff"
          git push
