name: Probe skill 120 book mapping
on:
  push:
    branches: [fix-skill120-learning]
    paths: ['.github/workflows/inspect-skill120.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe k25 mapping
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/skill120_mapping.txt"
          exec > >(tee "$LOG") 2>&1
          cat >/tmp/Probe.java <<'JAVA'
          import java.lang.reflect.*;import java.util.*;
          public class Probe{
            public static void main(String[]a)throws Exception{
              Class<?> c=Class.forName("k25");
              Method k=c.getDeclaredMethod("k",int.class,int.class); k.setAccessible(true);
              for(int item=1134;item<=1139;item++){
                StringBuilder s=new StringBuilder("ITEM "+item);
                for(int cl=1;cl<=6;cl++)s.append(" class").append(cl).append("=").append(k.invoke(null,item,cl));
                System.out.println(s);
              }
              System.out.println("=== METHODS ===");
              for(Method m:c.getDeclaredMethods()) if(m.getName().equals("a")||m.getName().equals("k")||m.getName().equals("g")||m.getName().equals("c")) System.out.println(m);
            }
          }
          JAVA
          javac -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" /tmp/Probe.java
          java -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar:/tmp" Probe
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill120_mapping.txt
          git commit -m 'chore: probe skill 120 book mapping' || exit 0
          git push origin fix-skill120-learning
