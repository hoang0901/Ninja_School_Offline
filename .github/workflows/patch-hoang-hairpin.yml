name: Patch hoang female hairpin
on:
  push:
    branches: [chatgpt/fix-hoang-female-hairpin]
    paths: [.github/workflows/patch-hoang-hairpin.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch only hoang gender and hair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hairpin && mkdir -p /tmp/hairpin/src /tmp/hairpin/out
          cd /tmp/hairpin
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o javassist.jar https://repo1.maven.org/maven2/org/javassist/javassist/3.30.2-GA/javassist-3.30.2-GA.jar
          cat > src/Patch.java <<'JAVA'
          import java.io.*;
          import javassist.*;
          public class Patch {
            public static void main(String[] args) throws Exception {
              ClassPool pool=new ClassPool(true);
              pool.insertClassPath("game.jar");
              CtClass c=pool.get("DoHoang091");
              CtMethod m=c.getDeclaredMethod("zHoangVipStarter");
              m.setBody("{ if(as==null && aj!=null){ for(int i=0;i<aj.length;i++){ if(aj[i]!=null && aj[i].a!=null && \"hoang\".equalsIgnoreCase(aj[i].a)){ if(aj[i].p!=(byte)0 || aj[i].q!=(short)11){ aj[i].p=(byte)0; aj[i].q=(short)11; DoHoang091.l(aj[i]); an=true; DoHoang091.as(); } break; } } } }");
              byte[] b=c.toBytecode();
              try(FileOutputStream f=new FileOutputStream("out/DoHoang091.class")){f.write(b);} c.detach();
            }
          }
          JAVA
          javac -cp javassist.jar -d out src/Patch.java
          java -cp javassist.jar:out Patch
          jar uf game.jar -C out DoHoang091.class
          zip -d game.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          unzip -t game.jar >/dev/null
          javap -classpath game.jar -p -c DoHoang091 > verify.txt
          grep -q 'bipush        11' verify.txt
          grep -q 'Field DoHoang091\$k0.p:B' verify.txt
          grep -q 'Field DoHoang091\$k0.q:S' verify.txt
          cp game.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          {
            echo '=== SHA256 ==='; sha256sum game.jar
            echo '=== PATCH ==='; grep -n -A100 -B5 'zHoangVipStarter' verify.txt | tail -n 130
          } > "$GITHUB_WORKSPACE/hoang_hairpin_verify.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- Nso_Offline_By_h0901.jar hoang_hairpin_verify.txt
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'fix: set hoang female hairpin appearance'
          git push origin HEAD:chatgpt/fix-hoang-female-hairpin
