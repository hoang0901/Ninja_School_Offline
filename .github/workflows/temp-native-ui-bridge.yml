name: Temporary native UI bridge
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-native-ui-bridge.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect native UI and publish report to feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nativeinspect
          mkdir -p /tmp/nativeinspect/out /tmp/nativeinspect/report
          cd /tmp/nativeinspect
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          for c in Class_ct Class_by Class_cy Class_fj Class_fe Class_dn Class_ew Class_ds; do
            unzip -p game.jar "$c.class" > "$c.class"
            java -jar cfr.jar "$c.class" --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          done
          grep -Rni -B100 -A240 -E 'Xu đang gửi|đang gửi|gửi:|Class_cy\.dc\.b|new Class_fj\[|Class_dn\.b\(|drawRect|drawString' out > report/focus.txt || true
          cp out/Class_ct.java report/Class_ct.java || true
          cp out/Class_by.java report/Class_by.java || true
          cp out/Class_cy.java report/Class_cy.java || true
          cp out/Class_ew.java report/Class_ew.java || true
          git -C "$GITHUB_WORKSPACE" checkout chatgpt/native-catalog-inventory-ui
          rm -rf "$GITHUB_WORKSPACE/native_ui"
          cp -r report "$GITHUB_WORKSPACE/native_ui"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native_ui
          git diff --cached --quiet || git commit -m "chore: inspect exact native inventory UI"
          git push origin HEAD:chatgpt/native-catalog-inventory-ui
      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main
          git rm -- .github/workflows/temp-native-ui-bridge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary native UI bridge"
          git push origin main
