name: Temporary HUD bytecode patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-export-current-jar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Patch only early HUD return in Class_ct.paint
        shell: python
        run: |
          import struct, zipfile, os

          jar = 'Nso_Offline_By_h0901.jar'
          out = jar + '.patched'
          target_class = 'Class_ct.class'
          target_method = 'a'
          target_desc = '(LClass_dg;)V'
          target_offset = 145

          def u1(b,o): return b[o],o+1
          def u2(b,o): return struct.unpack_from('>H',b,o)[0],o+2
          def u4(b,o): return struct.unpack_from('>I',b,o)[0],o+4
          def skip_attrs(b,o,n):
              for _ in range(n):
                  _,o=u2(b,o); ln,o=u4(b,o); o+=ln
              return o

          def patch_class(data):
              b=bytearray(data); o=0
              magic,o=u4(b,o)
              if magic != 0xCAFEBABE:
                  raise RuntimeError('Class_ct.class is not a valid class file')
              _,o=u2(b,o); major,o=u2(b,o)
              cp_count,o=u2(b,o)
              cp=[None]*cp_count
              i=1
              while i<cp_count:
                  tag,o=u1(b,o)
                  if tag==1:
                      ln,o=u2(b,o); raw=bytes(b[o:o+ln]); o+=ln
                      cp[i]=raw.decode('utf-8','replace')
                  elif tag in (3,4): o+=4
                  elif tag in (5,6): o+=8; i+=1
                  elif tag in (7,8,16,19,20): o+=2
                  elif tag in (9,10,11,12,18): o+=4
                  elif tag==15: o+=3
                  else: raise RuntimeError(f'unsupported constant-pool tag {tag}')
                  i+=1

              o+=6
              ic,o=u2(b,o); o+=2*ic
              fc,o=u2(b,o)
              for _ in range(fc):
                  o+=6; ac,o=u2(b,o); o=skip_attrs(b,o,ac)

              mc,o=u2(b,o)
              found=0
              for _ in range(mc):
                  _,o=u2(b,o); ni,o=u2(b,o); di,o=u2(b,o); ac,o=u2(b,o)
                  name=cp[ni]; desc=cp[di]
                  for __ in range(ac):
                      ai,o=u2(b,o); ln,o=u4(b,o); start=o
                      if name==target_method and desc==target_desc and cp[ai]=='Code':
                          found+=1
                          p=start
                          _,p=u2(b,p); _,p=u2(b,p); clen,p=u4(b,p)
                          pos=p+target_offset
                          if target_offset >= clen:
                              raise RuntimeError('target paint method shorter than expected')
                          if b[pos] != 0xB1:
                              raise RuntimeError(f'unexpected opcode at paint offset 145: 0x{b[pos]:02x}')
                          if b[pos+1] != 0x2B:
                              raise RuntimeError(f'unexpected next opcode after paint offset 145: 0x{b[pos+1]:02x}')
                          b[pos]=0x00
                      o=start+ln
              if found != 1:
                  raise RuntimeError(f'expected one Class_ct.a(Class_dg) paint method, found {found}')
              return bytes(b)

          with zipfile.ZipFile(jar,'r') as zin:
              if target_class not in zin.namelist():
                  raise RuntimeError('Class_ct.class not found in current JAR')
              original_class=zin.read(target_class)
              patched_class=patch_class(original_class)
              with zipfile.ZipFile(out,'w') as zout:
                  for info in zin.infolist():
                      payload=patched_class if info.filename==target_class else zin.read(info.filename)
                      zout.writestr(info,payload)

          with zipfile.ZipFile(out,'r') as z:
              bad=z.testzip()
              if bad:
                  raise RuntimeError(f'patched JAR CRC failure: {bad}')
              if z.read(target_class)==original_class:
                  raise RuntimeError('Class_ct.class did not change')

          os.replace(out,jar)
          print('HUD fix applied: Class_ct paint offset 145 return -> nop; all other JAR entries preserved.')

      - name: Commit only patched JAR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nso_Offline_By_h0901.jar
          git diff --cached --quiet && { echo "No JAR change to commit"; exit 1; }
          git commit -m "fix: keep HUD buttons visible during skill effects"
          git push
