name: Temporary add fake class menu
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-add-fake-class-menu.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fake class state and menu
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fakebuild && mkdir -p /tmp/fakebuild && cd /tmp/fakebuild
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar

          cat > FakeClassState.java <<'EOF'
          public final class FakeClassState {
              private static byte fakeClass;
              private FakeClassState() {}
              public static int resolve(byte realClass) {
                  int f = fakeClass & 255;
                  if (f >= 1 && f <= 6) return f;
                  return realClass & 255;
              }
              public static void set(int value) {
                  fakeClass = (byte)((value >= 1 && value <= 6) ? value : 0);
              }
              public static void clear() { fakeClass = 0; }
              public static int current() { return fakeClass & 255; }
          }
          EOF

          cat > OfflineDeleteMenu.java <<'EOF'
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.DataInputStream;
          import java.io.DataOutputStream;
          import java.util.Vector;

          public final class OfflineDeleteMenu {
              private static boolean active;
              private static int deleteIndex = -1;
              private static int clearBagIndex = -1;
              private static final int[] fakeIndex = new int[]{-1,-1,-1,-1,-1,-1};
              private static int realIndex = -1;

              private OfflineDeleteMenu() {}

              private static void resetIndexes() {
                  active = false;
                  deleteIndex = -1;
                  clearBagIndex = -1;
                  realIndex = -1;
                  for (int i=0;i<fakeIndex.length;i++) fakeIndex[i] = -1;
              }

              public static byte[] extend(byte cmd, byte[] data) {
                  if (cmd != 63 || data == null) return data;
                  resetIndexes();
                  try {
                      DataInputStream in = new DataInputStream(new ByteArrayInputStream(data));
                      Vector items = new Vector();
                      boolean a=false,b=false,c=false,d=false;
                      while (in.available() > 0) {
                          String s = in.readUTF();
                          items.addElement(s);
                          if ("Nhận vật phẩm".equals(s)) a=true;
                          if ("Nhận xu".equals(s)) b=true;
                          if ("Nhận lượng".equals(s)) c=true;
                          if ("Nhận yên".equals(s)) d=true;
                      }
                      if (!(a && b && c && d)) return data;

                      ByteArrayOutputStream out = new ByteArrayOutputStream(data.length + 320);
                      out.write(data);
                      DataOutputStream dos = new DataOutputStream(out);
                      int base = items.size();
                      deleteIndex = base;
                      dos.writeUTF("Xóa nhân vật đang chơi");
                      clearBagIndex = base + 1;
                      dos.writeUTF("Xóa toàn bộ vật phẩm trong hành trang");
                      String[] names = {"Kiếm","Phi tiêu","Kunai","Cung","Đao","Quạt"};
                      for (int i=0;i<6;i++) {
                          fakeIndex[i] = base + 2 + i;
                          dos.writeUTF("Fake phái - " + names[i]);
                      }
                      realIndex = base + 8;
                      dos.writeUTF("Fake phái - Phái gốc");
                      dos.flush();
                      active = true;
                      return out.toByteArray();
                  } catch (Throwable t) {
                      resetIndexes();
                      return data;
                  }
              }

              private static int[] decode(byte[] data) {
                  if (data == null || data.length < 2) return null;
                  int op, idx;
                  if (data.length >= 4) {
                      op = data[1] & 255;
                      idx = data[2] & 255;
                  } else if (data.length == 2) {
                      op = data[0] & 255;
                      idx = data[1] & 255;
                  } else {
                      int a=data[0]&255, b=data[1]&255;
                      if (a==37) { op=a; idx=b; }
                      else if (b==37) { op=b; idx=data[2]&255; }
                      else { op=a; idx=b; }
                  }
                  return new int[]{op,idx};
              }

              private static void refreshFakeClass(int cls) {
                  try {
                      if (cls >= 1 && cls <= 6) FakeClassState.set(cls);
                      else FakeClassState.clear();
                      try { DoHoang091.G(); } catch (Throwable ignored) {}
                      try { DoHoang091.H(); } catch (Throwable ignored) {}
                      String name = cls >= 1 && cls <= 6 ? DoHoang091.a((byte)cls) : "Phái gốc";
                      try { DoHoang091.a("Fake phái: " + name); } catch (Throwable ignored) {}
                  } catch (Throwable ignored) {}
              }

              public static boolean consume(byte cmd, byte[] data) {
                  if (cmd != 29 || !active || data == null || data.length < 2) return false;
                  int[] p = decode(data);
                  if (p == null) return false;
                  int op=p[0], idx=p[1];
                  active=false;
                  if (op == 37 && idx == deleteIndex) {
                      resetIndexes();
                      try { CharacterDelete.deleteCurrent(); } catch (Throwable ignored) {}
                      return true;
                  }
                  if (op == 37 && idx == clearBagIndex) {
                      resetIndexes();
                      try { InventoryClear.clearCurrentBag(); } catch (Throwable ignored) {}
                      return true;
                  }
                  if (op == 37) {
                      for (int i=0;i<6;i++) {
                          if (idx == fakeIndex[i]) {
                              resetIndexes();
                              refreshFakeClass(i+1);
                              return true;
                          }
                      }
                      if (idx == realIndex) {
                          resetIndexes();
                          refreshFakeClass(0);
                          return true;
                      }
                  }
                  resetIndexes();
                  return false;
              }
          }
          EOF

          javac --release 8 -cp game.jar FakeClassState.java OfflineDeleteMenu.java

          python - <<'PY'
          import struct, zipfile, os

          def parse_cp(data):
              b=data; cp_count=struct.unpack_from('>H',b,8)[0]; o=10; cp=[None]*cp_count; i=1
              while i<cp_count:
                  start=o; tag=b[o]; o+=1
                  if tag==1:
                      ln=struct.unpack_from('>H',b,o)[0]; o+=2; s=b[o:o+ln].decode('utf-8','replace'); o+=ln; cp[i]=(tag,s,start,o)
                  elif tag in (3,4): o+=4; cp[i]=(tag,None,start,o)
                  elif tag in (5,6): o+=8; cp[i]=(tag,None,start,o); i+=1
                  elif tag in (7,8,16,19,20):
                      v=struct.unpack_from('>H',b,o)[0]; o+=2; cp[i]=(tag,v,start,o)
                  elif tag in (9,10,11,12,17,18):
                      a,c=struct.unpack_from('>HH',b,o); o+=4; cp[i]=(tag,(a,c),start,o)
                  elif tag==15:
                      kind=b[o]; ref=struct.unpack_from('>H',b,o+1)[0]; o+=3; cp[i]=(tag,(kind,ref),start,o)
                  else: raise RuntimeError('cp tag '+str(tag))
                  i+=1
              return cp_count,cp,o

          def cp_utf(cp,idx): return cp[idx][1] if cp[idx] and cp[idx][0]==1 else None
          def cp_class_name(cp,idx):
              e=cp[idx]; return cp_utf(cp,e[1]) if e and e[0]==7 else None
          def cp_nat(cp,idx):
              e=cp[idx];
              if not e or e[0]!=12:return (None,None)
              return cp_utf(cp,e[1][0]),cp_utf(cp,e[1][1])
          def find_fieldref(cp,owner,name,desc):
              for i,e in enumerate(cp):
                  if not e or e[0]!=9: continue
                  ci,ni=e[1]
                  if cp_class_name(cp,ci)==owner and cp_nat(cp,ni)==(name,desc): return i
              raise RuntimeError('fieldref not found '+owner+'.'+name)

          def append_resolve_methodref(data):
              old,cp,cp_end=parse_cp(data)
              cls_utf=old; cls_idx=old+1; name_utf=old+2; desc_utf=old+3; nat_idx=old+4; mr_idx=old+5
              def utf(s):
                  x=s.encode('utf-8'); return bytes([1])+struct.pack('>H',len(x))+x
              extra=b''.join([
                  utf('FakeClassState'), bytes([7])+struct.pack('>H',cls_utf),
                  utf('resolve'), utf('(B)I'),
                  bytes([12])+struct.pack('>HH',name_utf,desc_utf),
                  bytes([10])+struct.pack('>HH',cls_idx,nat_idx),
              ])
              out=data[:8]+struct.pack('>H',old+6)+data[10:cp_end]+extra+data[cp_end:]
              return bytearray(out),mr_idx

          def method_code_ranges(data):
              cp_count,cp,o=parse_cp(data)
              o+=6
              ni=struct.unpack_from('>H',data,o)[0]; o+=2+2*ni
              nf=struct.unpack_from('>H',data,o)[0]; o+=2
              for _ in range(nf):
                  o+=6; ac=struct.unpack_from('>H',data,o)[0]; o+=2
                  for __ in range(ac): o+=2; ln=struct.unpack_from('>I',data,o)[0]; o+=4+ln
              nm=struct.unpack_from('>H',data,o)[0]; o+=2
              out=[]
              for _ in range(nm):
                  o+=2; namei,desci=struct.unpack_from('>HH',data,o); o+=4; ac=struct.unpack_from('>H',data,o)[0]; o+=2
                  name=cp_utf(cp,namei); desc=cp_utf(cp,desci)
                  for __ in range(ac):
                      ai=struct.unpack_from('>H',data,o)[0]; o+=2; ln=struct.unpack_from('>I',data,o)[0]; o+=4; start=o
                      if cp_utf(cp,ai)=='Code':
                          clen=struct.unpack_from('>I',data,start+4)[0]; cs=start+8; out.append((name,desc,cs,clen))
                      o=start+ln
              return cp,out

          with zipfile.ZipFile('game.jar','r') as z:
              orig={i.filename:z.read(i.filename) for i in z.infolist()}
              infos=z.infolist()
          if 'FakeClassState.class' in orig: raise SystemExit('FakeClassState already exists')

          # Patch k25: every unsigned bx class lookup goes through FakeClassState.resolve(byte).
          k25,mr=append_resolve_methodref(orig['k25.class'])
          cp,ranges=method_code_ranges(k25)
          bx=find_fieldref(cp,'DoHoang091$k0','bx','B')
          pat=bytes([0xb4,(bx>>8)&255,bx&255,0x11,0x00,0xff,0x7e])
          rep=bytes([0xb4,(bx>>8)&255,bx&255,0xb8,(mr>>8)&255,mr&255,0x00])
          kcount=0
          for _,_,cs,cl in ranges:
              code=bytes(k25[cs:cs+cl]); pos=0
              while True:
                  j=code.find(pat,pos)
                  if j<0: break
                  k25[cs+j:cs+j+7]=rep; kcount+=1; pos=j+7
          if kcount < 2: raise SystemExit('unexpected k25 bx patch count '+str(kcount))

          # Patch DoHoang091.a(byte): displayed class name also resolves fake class.
          main,mr2=append_resolve_methodref(orig['DoHoang091.class'])
          cp2,ranges2=method_code_ranges(main)
          mcount=0
          for name,desc,cs,cl in ranges2:
              if name=='a' and desc=='(B)Ljava/lang/String;':
                  old=bytes(main[cs:cs+5])
                  if old != bytes([0x1a,0x11,0x00,0xff,0x7e]):
                      raise SystemExit('unexpected class-name prologue '+old.hex())
                  main[cs:cs+5]=bytes([0x1a,0xb8,(mr2>>8)&255,mr2&255,0x00]); mcount+=1
          if mcount!=1: raise SystemExit('class-name patch count '+str(mcount))

          # Manifest rename only.
          mf=orig['META-INF/MANIFEST.MF'].decode('utf-8','replace')
          mf=mf.replace('MIDlet-1: Local,/icon.png,Class_da','MIDlet-1: NinjaSchoolOffline,/icon.png,Class_da')
          mf=mf.replace('MIDlet-Name: Local Offline Female Fan VIP V12.2','MIDlet-Name: NinjaSchoolOffline')
          if 'MIDlet-Name: NinjaSchoolOffline' not in mf: raise SystemExit('manifest rename failed')
          mf=mf.encode('utf-8')

          replacements={
              'k25.class':bytes(k25),
              'DoHoang091.class':bytes(main),
              'OfflineDeleteMenu.class':open('OfflineDeleteMenu.class','rb').read(),
              'FakeClassState.class':open('FakeClassState.class','rb').read(),
              'META-INF/MANIFEST.MF':mf,
          }
          out='game.new.jar'
          with zipfile.ZipFile('game.jar','r') as zin, zipfile.ZipFile(out,'w') as zout:
              seen=set()
              for info in zin.infolist():
                  new=replacements.get(info.filename,zin.read(info.filename)); seen.add(info.filename)
                  zout.writestr(info,new)
              for name,data in replacements.items():
                  if name not in seen: zout.writestr(name,data)
          with zipfile.ZipFile(out,'r') as z:
              bad=z.testzip()
              if bad: raise SystemExit('CRC failure '+bad)
              names=set(z.namelist())
              if 'FakeClassState.class' not in names: raise SystemExit('missing FakeClassState')
          os.replace(out,'game.jar')
          print('k25 fake-class bx lookups patched:',kcount)
          print('DoHoang091 class-name resolver patched:',mcount)
          PY

          # Static validation of new bytecode and manifest.
          rm -rf verify && mkdir verify && cd verify
          jar xf ../game.jar k25.class DoHoang091.class OfflineDeleteMenu.class FakeClassState.class META-INF/MANIFEST.MF
          javap -p -c k25.class > k25.txt
          javap -p -c DoHoang091.class > main.txt
          javap -p -c OfflineDeleteMenu.class > menu.txt
          javap -p -c FakeClassState.class > state.txt
          grep -q 'FakeClassState.resolve' k25.txt
          grep -q 'FakeClassState.resolve' main.txt
          grep -q 'Fake phái - Kiếm' menu.txt
          grep -q 'Fake phái - Quạt' menu.txt
          grep -q 'MIDlet-Name: NinjaSchoolOffline' META-INF/MANIFEST.MF
          cd ..
          cp game.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
      - name: Commit JAR only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nso_Offline_By_h0901.jar
          git diff --cached --quiet && { echo 'No JAR change'; exit 1; }
          git commit -m "feat: add fake class menu and rename game"
          git push
