name: Inspect catalog categories
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-catalog-types-main.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect workbook and item metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cat && mkdir -p /tmp/cat/out
          cd /tmp/cat
          cp "$GITHUB_WORKSPACE/Danh_sach_ID_vat_pham.xlsx" ids.xlsx
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          python3 - <<'PY' > workbook.txt
          import zipfile, xml.etree.ElementTree as ET
          z=zipfile.ZipFile('ids.xlsx')
          ns={'a':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          shared=[]
          if 'xl/sharedStrings.xml' in z.namelist():
              root=ET.fromstring(z.read('xl/sharedStrings.xml'))
              for si in root.findall('a:si',ns):
                  shared.append(''.join(t.text or '' for t in si.iter('{%s}t'%ns['a'])))
          root=ET.fromstring(z.read('xl/worksheets/sheet1.xml'))
          for row in root.findall('.//a:sheetData/a:row',ns):
              vals=[]
              for c in row.findall('a:c',ns):
                  ref=c.attrib.get('r','')
                  typ=c.attrib.get('t')
                  v=c.find('a:v',ns)
                  val=''
                  if v is not None:
                      val=shared[int(v.text)] if typ=='s' else (v.text or '')
                  vals.append(f'{ref}={val}')
              print('\t'.join(vals))
          PY
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          for cls in Class_fe Class_dn Class_fj k1d; do
            unzip -p game.jar "$cls.class" > "$cls.class"
            java -jar cfr.jar "$cls.class" --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          done
          {
            echo '=== WORKBOOK ==='; cat workbook.txt
            echo; echo '=== Class_fe ==='; sed -n '1,260p' out/Class_fe.java || true
            echo; echo '=== Class_dn ==='; sed -n '1,360p' out/Class_dn.java || true
            echo; echo '=== Class_fj ==='; grep -n -E 'public |private |protected ' out/Class_fj.java | head -320 || true
            echo; echo '=== k1d catalog ==='; grep -n -B50 -A220 -E 'gx|void D\(|void z\(|void x\(|case 324|case 30014' out/k1d.java || true
          } > report.txt
          cd "$GITHUB_WORKSPACE"
          git fetch origin chatgpt/catalog-by-type-v2
          git checkout chatgpt/catalog-by-type-v2
          mkdir -p catalog_inspect
          cp /tmp/cat/report.txt catalog_inspect/report.txt
          git add -- catalog_inspect/report.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect catalog type data' || true
          git push origin HEAD:chatgpt/catalog-by-type-v2
      - name: Cleanup workflow on main
        if: always()
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-inspect-catalog-types-main.yml || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: remove catalog inspector' || true
          git push origin main || true
