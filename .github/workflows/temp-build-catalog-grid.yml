name: Build catalog grid and remove fake class
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-build-catalog-grid.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean JAR with native catalog grid
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/catalogbuild && mkdir -p /tmp/catalogbuild && cd /tmp/catalogbuild

          # Start from the last clean JAR before the fake-class patch. This baseline
          # already contains character delete + clear-bag and all earlier game fixes.
          git -C "$GITHUB_WORKSPACE" show 245c1d2ba6c242bb92d56fcf509376267ed9c06e:Nso_Offline_By_h0901.jar > game.jar

          python - <<'PY'
          import struct, zipfile, os

          def parse_cp(data):
              cp_count=struct.unpack_from('>H',data,8)[0]; o=10; cp=[None]*cp_count; i=1
              while i<cp_count:
                  tag=data[o]; o+=1
                  if tag==1:
                      ln=struct.unpack_from('>H',data,o)[0]; o+=2
                      cp[i]=(tag,data[o:o+ln].decode('utf-8','replace')); o+=ln
                  elif tag in (3,4): cp[i]=(tag,None); o+=4
                  elif tag in (5,6): cp[i]=(tag,None); o+=8; i+=1
                  elif tag in (7,8,16,19,20): cp[i]=(tag,struct.unpack_from('>H',data,o)[0]); o+=2
                  elif tag in (9,10,11,12,17,18): cp[i]=(tag,struct.unpack_from('>HH',data,o)); o+=4
                  elif tag==15: cp[i]=(tag,(data[o],struct.unpack_from('>H',data,o+1)[0])); o+=3
                  else: raise RuntimeError('unknown cp tag '+str(tag))
                  i+=1
              return cp,o

          def utf(cp,idx):
              e=cp[idx]
              return e[1] if e and e[0]==1 else None

          def patch_access(data, kind, name, desc):
              b=bytearray(data); cp,o=parse_cp(b)
              o += 6
              ic=struct.unpack_from('>H',b,o)[0]; o += 2 + 2*ic
              fc=struct.unpack_from('>H',b,o)[0]; o += 2
              found=0
              def walk_member(o, want):
                  nonlocal found
                  access_off=o
                  access,namei,desci=struct.unpack_from('>HHH',b,o); o+=6
                  ac=struct.unpack_from('>H',b,o)[0]; o+=2
                  if want and utf(cp,namei)==name and utf(cp,desci)==desc:
                      new=(access & ~0x0007) | 0x0001
                      struct.pack_into('>H',b,access_off,new); found+=1
                  for _ in range(ac):
                      o+=2; ln=struct.unpack_from('>I',b,o)[0]; o+=4+ln
                  return o
              for _ in range(fc): o=walk_member(o,kind=='field')
              mc=struct.unpack_from('>H',b,o)[0]; o+=2
              for _ in range(mc): o=walk_member(o,kind=='method')
              if found!=1: raise RuntimeError('%s %s%s found %d times'%(kind,name,desc,found))
              return bytes(b)

          with zipfile.ZipFile('game.jar','r') as zin:
              entries={i.filename:zin.read(i.filename) for i in zin.infolist()}
              infos=zin.infolist()

          # Expose only the existing native catalog data/receive/render hooks needed
          # by ItemCatalogGrid. No gameplay logic is changed.
          k1d=entries['k1d.class']
          k1d=patch_access(k1d,'field','gx','[I')
          k1d=patch_access(k1d,'method','D','()V')
          k1d=patch_access(k1d,'method','j','(Ljava/lang/String;)V')
          entries['k1d.class']=k1d

          ct=entries['Class_ct.class']
          ct=patch_access(ct,'method','a','(LClass_dg;LClass_fj;II)V')
          entries['Class_ct.class']=ct

          # Keep the current game name while using the pre-fake-class baseline.
          mf=entries['META-INF/MANIFEST.MF'].decode('utf-8','replace')
          mf=mf.replace('MIDlet-1: Local,/icon.png,Class_da','MIDlet-1: NinjaSchoolOffline,/icon.png,Class_da')
          mf=mf.replace('MIDlet-Name: Local Offline Female Fan VIP V12.2','MIDlet-Name: NinjaSchoolOffline')
          entries['META-INF/MANIFEST.MF']=mf.encode('utf-8')

          with zipfile.ZipFile('patched-base.jar','w') as zout:
              seen=set()
              for info in infos:
                  zout.writestr(info,entries[info.filename]); seen.add(info.filename)
          os.replace('patched-base.jar','game.jar')
          PY

          curl -fsSL -o midpapi20.jar https://repo.maven.apache.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar

          cat > ItemCatalogGrid.java <<'EOF'
          import javax.microedition.lcdui.Canvas;
          import javax.microedition.lcdui.Command;
          import javax.microedition.lcdui.CommandListener;
          import javax.microedition.lcdui.Display;
          import javax.microedition.lcdui.Displayable;
          import javax.microedition.lcdui.Graphics;

          public final class ItemCatalogGrid extends Canvas implements CommandListener {
              private static ItemCatalogGrid instance;
              private Display display;
              private Displayable previous;
              private int[] ids = new int[0];
              private int selected;
              private int page;
              private int cols = 4;
              private int rows = 5;
              private int cell = 42;
              private final Command receive = new Command("Nhận", Command.OK, 1);
              private final Command close = new Command("Đóng", Command.BACK, 2);

              private ItemCatalogGrid() {
                  addCommand(receive);
                  addCommand(close);
                  setCommandListener(this);
              }

              public static void open() {
                  try {
                      if (instance == null) instance = new ItemCatalogGrid();
                      instance.openInternal();
                  } catch (Throwable t) {
                      try { DoHoang091.a("Không thể mở catalog vật phẩm."); } catch (Throwable ignored) {}
                  }
              }

              private void openInternal() throws Exception {
                  k1d.D();
                  int[] src = k1d.gx;
                  if (src == null) src = new int[0];
                  ids = new int[src.length];
                  System.arraycopy(src, 0, ids, 0, src.length);
                  selected = 0;
                  page = 0;
                  display = Display.getDisplay(Class_da.b);
                  previous = display.getCurrent();
                  display.setCurrent(this);
                  repaint();
              }

              private int perPage() { return cols * rows; }

              private void layout() {
                  int w = getWidth();
                  int h = getHeight();
                  cols = w >= 300 ? 6 : (w >= 220 ? 5 : 4);
                  cell = w / cols;
                  if (cell > 48) cell = 48;
                  if (cell < 34) cell = 34;
                  rows = (h - 48) / cell;
                  if (rows < 3) rows = 3;
              }

              protected void paint(Graphics g) {
                  layout();
                  int w=getWidth(), h=getHeight();
                  g.setColor(0xEEE8D5); g.fillRect(0,0,w,h);
                  g.setColor(0x2B2B2B); g.drawString("Catalog vật phẩm",4,2,Graphics.TOP|Graphics.LEFT);
                  if (ids.length==0) {
                      g.drawString("Không có vật phẩm", w/2, h/2, Graphics.HCENTER|Graphics.BASELINE);
                      return;
                  }
                  int pp=perPage();
                  int pages=(ids.length+pp-1)/pp;
                  if (page>=pages) page=pages-1;
                  int start=page*pp;
                  int ox=(w-cols*cell)/2;
                  Class_dg dg=new Class_dg(g);
                  for (int i=0;i<pp && start+i<ids.length;i++) {
                      int index=start+i;
                      int r=i/cols, c=i%cols;
                      int x=ox+c*cell, y=22+r*cell;
                      g.setColor(index==selected ? 0xCC7A00 : 0x8A7F68);
                      g.drawRect(x+1,y+1,cell-3,cell-3);
                      int id=ids[index];
                      try {
                          Class_fe t=Class_dn.b((short)id);
                          if (t!=null && Class_ct.fj!=null) {
                              Class_fj item=new Class_fj();
                              item.y=t;
                              item.i=id;
                              item.v=1;
                              Class_ct.fj.a(dg,item,x+4,y+4);
                          }
                      } catch (Throwable ignored) {}
                      g.setColor(0x2B2B2B);
                      g.drawString(String.valueOf(id),x+cell/2,y+cell-13,Graphics.TOP|Graphics.HCENTER);
                  }
                  g.setColor(0x2B2B2B);
                  g.drawString("<", 8, h-20, Graphics.TOP|Graphics.LEFT);
                  g.drawString("Trang "+(page+1)+"/"+pages, w/2, h-20, Graphics.TOP|Graphics.HCENTER);
                  g.drawString(">", w-8, h-20, Graphics.TOP|Graphics.RIGHT);
              }

              private void changePage(int d) {
                  if (ids.length==0) return;
                  int pp=perPage();
                  int pages=(ids.length+pp-1)/pp;
                  int np=page+d;
                  if (np<0) np=0;
                  if (np>=pages) np=pages-1;
                  page=np;
                  selected=page*pp;
                  if (selected>=ids.length) selected=ids.length-1;
                  repaint();
              }

              protected void keyPressed(int keyCode) {
                  if (ids.length==0) return;
                  int ga=getGameAction(keyCode);
                  int pp=perPage();
                  if (ga==LEFT) {
                      if (selected>0) selected--;
                  } else if (ga==RIGHT) {
                      if (selected+1<ids.length) selected++;
                  } else if (ga==UP) {
                      if (selected-cols>=0) selected-=cols;
                  } else if (ga==DOWN) {
                      if (selected+cols<ids.length) selected+=cols;
                  } else if (ga==FIRE) {
                      receiveSelected(); return;
                  }
                  page=selected/pp;
                  repaint();
              }

              protected void pointerPressed(int x,int y) {
                  layout();
                  int w=getWidth(), h=getHeight();
                  if (y>=h-28) {
                      if (x<w/3) changePage(-1);
                      else if (x>w*2/3) changePage(1);
                      return;
                  }
                  int ox=(w-cols*cell)/2;
                  int yy=y-22;
                  if (x<ox || yy<0) return;
                  int c=(x-ox)/cell, r=yy/cell;
                  if (c<0 || c>=cols || r<0 || r>=rows) return;
                  int idx=page*perPage()+r*cols+c;
                  if (idx>=0 && idx<ids.length) {
                      selected=idx;
                      repaint();
                  }
              }

              private void receiveSelected() {
                  if (selected<0 || selected>=ids.length) return;
                  try {
                      k1d.j(String.valueOf(ids[selected]));
                  } catch (Throwable t) {
                      try { DoHoang091.a("Không thể nhận vật phẩm ID " + ids[selected]); } catch (Throwable ignored) {}
                  }
              }

              private void closeCatalog() {
                  try {
                      if (display!=null && previous!=null) display.setCurrent(previous);
                  } catch (Throwable ignored) {}
              }

              public void commandAction(Command c, Displayable d) {
                  if (c==receive) receiveSelected();
                  else if (c==close) closeCatalog();
              }
          }
          EOF

          cat > OfflineDeleteMenu.java <<'EOF'
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.DataInputStream;
          import java.io.DataOutputStream;
          import java.util.Vector;

          public final class OfflineDeleteMenu {
              private static boolean active;
              private static int[] mapping = new int[0];
              private static final int CATALOG = -1001;
              private static final int CLEAR_BAG = -1002;
              private static final int DELETE_CHAR = -1003;

              private OfflineDeleteMenu() {}

              private static void reset() {
                  active=false;
                  mapping=new int[0];
              }

              public static byte[] extend(byte cmd, byte[] data) {
                  if (cmd!=63 || data==null) return data;
                  reset();
                  try {
                      DataInputStream in=new DataInputStream(new ByteArrayInputStream(data));
                      Vector names=new Vector();
                      int receiveIndex=-1;
                      boolean xu=false,luong=false,yen=false;
                      while (in.available()>0) {
                          String s=in.readUTF();
                          int idx=names.size();
                          names.addElement(s);
                          if ("Nhận vật phẩm".equals(s)) receiveIndex=idx;
                          else if ("Nhận xu".equals(s)) xu=true;
                          else if ("Nhận lượng".equals(s)) luong=true;
                          else if ("Nhận yên".equals(s)) yen=true;
                      }
                      if (receiveIndex<0 || !xu || !luong || !yen) return data;

                      Vector outNames=new Vector();
                      Vector outMap=new Vector();
                      outNames.addElement("Nhận vật phẩm");
                      outMap.addElement(new Integer(CATALOG));
                      outNames.addElement("Xóa toàn bộ vật phẩm trong hành trang");
                      outMap.addElement(new Integer(CLEAR_BAG));
                      for (int i=0;i<names.size();i++) {
                          if (i==receiveIndex) continue;
                          outNames.addElement(names.elementAt(i));
                          outMap.addElement(new Integer(i));
                      }
                      outNames.addElement("Xóa nhân vật đang chơi");
                      outMap.addElement(new Integer(DELETE_CHAR));

                      ByteArrayOutputStream bout=new ByteArrayOutputStream(data.length+160);
                      DataOutputStream dos=new DataOutputStream(bout);
                      mapping=new int[outMap.size()];
                      for (int i=0;i<outNames.size();i++) {
                          dos.writeUTF((String)outNames.elementAt(i));
                          mapping[i]=((Integer)outMap.elementAt(i)).intValue();
                      }
                      dos.flush();
                      active=true;
                      return bout.toByteArray();
                  } catch (Throwable t) {
                      reset();
                      return data;
                  }
              }

              private static int[] decode(byte[] data) {
                  if (data==null || data.length<2) return null;
                  int op,idx,pos;
                  if (data.length>=4) {
                      op=data[1]&255; idx=data[2]&255; pos=2;
                  } else if (data.length==2) {
                      op=data[0]&255; idx=data[1]&255; pos=1;
                  } else {
                      int a=data[0]&255,b=data[1]&255;
                      if (a==37) { op=a; idx=b; pos=1; }
                      else if (b==37) { op=b; idx=data[2]&255; pos=2; }
                      else { op=a; idx=b; pos=1; }
                  }
                  return new int[]{op,idx,pos};
              }

              public static boolean consume(byte cmd, byte[] data) {
                  if (cmd!=29 || !active || data==null) return false;
                  int[] p=decode(data);
                  if (p==null || p[0]!=37 || p[1]<0 || p[1]>=mapping.length) {
                      reset();
                      return false;
                  }
                  int target=mapping[p[1]];
                  reset();
                  if (target==CATALOG) {
                      ItemCatalogGrid.open();
                      return true;
                  }
                  if (target==CLEAR_BAG) {
                      try { InventoryClear.clearCurrentBag(); } catch (Throwable ignored) {}
                      return true;
                  }
                  if (target==DELETE_CHAR) {
                      try { CharacterDelete.deleteCurrent(); } catch (Throwable ignored) {}
                      return true;
                  }
                  try {
                      byte[] remap=new byte[data.length];
                      System.arraycopy(data,0,remap,0,data.length);
                      remap[p[2]]=(byte)target;
                      DoHoang091.post(cmd,remap);
                  } catch (Throwable t) {
                      return true;
                  }
                  return true;
              }
          }
          EOF

          # Compile helpers against the patched game classes and MIDP 2.0 API stubs.
          javac --release 8 -cp "game.jar:midpapi20.jar" ItemCatalogGrid.java OfflineDeleteMenu.java

          python - <<'PY'
          import zipfile, os
          repl={
              'ItemCatalogGrid.class':open('ItemCatalogGrid.class','rb').read(),
              'OfflineDeleteMenu.class':open('OfflineDeleteMenu.class','rb').read(),
          }
          with zipfile.ZipFile('game.jar','r') as zin, zipfile.ZipFile('game.final.jar','w') as zout:
              seen=set()
              for info in zin.infolist():
                  data=repl.get(info.filename,zin.read(info.filename))
                  zout.writestr(info,data); seen.add(info.filename)
              for name,data in repl.items():
                  if name not in seen: zout.writestr(name,data)
          with zipfile.ZipFile('game.final.jar','r') as z:
              bad=z.testzip()
              if bad: raise SystemExit('CRC failure: '+bad)
              names=set(z.namelist())
              if 'FakeClassState.class' in names: raise SystemExit('fake class still present')
              if 'ItemCatalogGrid.class' not in names: raise SystemExit('catalog grid missing')
          os.replace('game.final.jar','game.jar')
          PY

          # Structural validation.
          mkdir verify && cd verify
          jar xf ../game.jar OfflineDeleteMenu.class ItemCatalogGrid.class k1d.class Class_ct.class META-INF/MANIFEST.MF
          javap -p OfflineDeleteMenu.class > menu.txt
          javap -p ItemCatalogGrid.class > grid.txt
          javap -p k1d.class > k1d.txt
          javap -p Class_ct.class > ct.txt
          grep -q 'ItemCatalogGrid' grid.txt
          grep -q 'public static int\[\] gx' k1d.txt
          grep -q 'public static void D()' k1d.txt
          grep -q 'public static void j(java.lang.String)' k1d.txt
          grep -q 'public.* a(Class_dg, Class_fj, int, int)' ct.txt
          grep -q 'MIDlet-Name: NinjaSchoolOffline' META-INF/MANIFEST.MF
          ! strings ../game.jar | grep -q 'Fake phái'
          cd ..

          # Pure menu-order test: first entries must be receive-item and clear-bag.
          cat > MenuOrderTest.java <<'EOF'
          import java.io.*;
          public class MenuOrderTest {
              public static void main(String[] args) throws Exception {
                  ByteArrayOutputStream b=new ByteArrayOutputStream();
                  DataOutputStream d=new DataOutputStream(b);
                  d.writeUTF("Điểm danh"); d.writeUTF("Nhận xu"); d.writeUTF("Nhận vật phẩm"); d.writeUTF("Nhận lượng"); d.writeUTF("Nhận yên"); d.flush();
                  byte[] o=OfflineDeleteMenu.extend((byte)63,b.toByteArray());
                  DataInputStream in=new DataInputStream(new ByteArrayInputStream(o));
                  String a=in.readUTF(), c=in.readUTF();
                  if (!"Nhận vật phẩm".equals(a)) throw new RuntimeException(a);
                  if (!"Xóa toàn bộ vật phẩm trong hành trang".equals(c)) throw new RuntimeException(c);
              }
          }
          EOF
          javac --release 8 -cp "game.jar:midpapi20.jar" MenuOrderTest.java
          java -cp ".:game.jar:midpapi20.jar" MenuOrderTest

          cp game.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"

      - name: Commit final JAR and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nso_Offline_By_h0901.jar
          rm -rf item_catalog_report.txt item_diag item_diag2 item_diag3 item_diag4 item_diag5 item_diag6 item_diag7 item_diag8 item_diag9 item_diag10 item_diag11 item_diag12 item_diag13 item_diag14 model_fast signatures template_map template_lookup classfe_refs native_item_list parent_check.txt catalog_hook catalog_receive
          git rm -rf --ignore-unmatch .github/workflows/temp-*.yml
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "feat: native item catalog grid and clean offline menu"
          git push
