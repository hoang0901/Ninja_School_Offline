name: Temporary fix lv120 HUD flag
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-fix-lv120-hud-flag.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch k32 state sync HUD flag only
        shell: python
        run: |
          import zipfile, struct, os
          jar='Nso_Offline_By_h0901.jar'
          out=jar+'.patched'
          with zipfile.ZipFile(jar,'r') as zin:
              original={n:zin.read(n) for n in zin.namelist()}
              b=bytearray(original['k32.class'])

          o=0
          def u1():
              global o; v=b[o]; o+=1; return v
          def u2():
              global o; v=struct.unpack_from('>H',b,o)[0]; o+=2; return v
          def u4():
              global o; v=struct.unpack_from('>I',b,o)[0]; o+=4; return v
          assert u4()==0xCAFEBABE
          u2(); u2(); cp_count=u2(); cp=[None]*cp_count
          i=1
          while i<cp_count:
              tag=u1()
              if tag==1:
                  ln=u2(); cp[i]=bytes(b[o:o+ln]).decode('utf-8','replace'); o+=ln
              elif tag in (3,4): o+=4
              elif tag in (5,6): o+=8; i+=1
              elif tag in (7,8,16,19,20): o+=2
              elif tag in (9,10,11,12,17,18): o+=4
              elif tag==15: o+=3
              else: raise RuntimeError('unsupported cp tag %d'%tag)
              i+=1
          o+=6
          ni=u2(); o+=2*ni
          nf=u2()
          for _ in range(nf):
              o+=6; ac=u2()
              for __ in range(ac): u2(); ln=u4(); o+=ln
          nm=u2(); patched=0; verified=False
          for _ in range(nm):
              o+=2; name_i=u2(); desc_i=u2(); ac=u2()
              name=cp[name_i]; desc=cp[desc_i]
              for __ in range(ac):
                  ai=u2(); ln=u4(); start=o
                  if name=='e' and desc=='()V' and cp[ai]=='Code':
                      p=start+4
                      clen=struct.unpack_from('>I',b,p)[0]; p+=4
                      code_start=p
                      code=bytes(b[code_start:code_start+clen])
                      if len(code) <= 52 or code[24] != 0x10 or code[25] != 0x85 or code[49] != 0x2c or code[50] != 0x03 or code[51] != 0xb6:
                          raise RuntimeError('unexpected k32.e packet bytecode: '+code.hex())
                      b[code_start+50]=0x04
                      if b[code_start+50] != 0x04:
                          raise RuntimeError('bytecode write failed')
                      patched+=1; verified=True
                  o=start+ln
          if patched!=1 or not verified:
              raise RuntimeError('expected one verified k32.e patch')

          with zipfile.ZipFile(jar,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              changed=[]
              for info in zin.infolist():
                  old=original[info.filename]
                  new=bytes(b) if info.filename=='k32.class' else old
                  if new!=old: changed.append(info.filename)
                  zout.writestr(info,new)
          if changed != ['k32.class']:
              raise RuntimeError('unexpected changed entries: '+repr(changed))
          with zipfile.ZipFile(out,'r') as z:
              bad=z.testzip()
              if bad: raise RuntimeError('CRC failure: '+bad)
              kb=z.read('k32.class')
              if kb == original['k32.class']:
                  raise RuntimeError('k32.class did not change')
          os.replace(out,jar)
          print('Validated: packet -123 HUD flag changed 0 -> 1; only k32.class changed.')
      - name: Commit corrected JAR only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nso_Offline_By_h0901.jar
          git diff --cached --quiet && { echo 'No JAR change'; exit 1; }
          git commit -m "fix: keep HUD visible after level 120 skill state sync"
          git push
