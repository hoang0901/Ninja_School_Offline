name: Build native inventory catalog
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-build-native-catalog.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build native catalog on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout chatgpt/native-catalog-inventory-ui
          git reset --hard main
          rm -rf /tmp/nativecat && mkdir -p /tmp/nativecat/src /tmp/nativecat/classes /tmp/nativecat/work
          cd /tmp/nativecat
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          curl -fsSL -o asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar

          cat > src/Patch.java <<'JAVA'
          import java.io.*;
          import java.util.*;
          import java.util.jar.*;
          import org.objectweb.asm.*;
          import org.objectweb.asm.tree.*;

          public final class Patch implements Opcodes {
            static MethodNode method(ClassNode c,String n,String d){
              for(Object o:c.methods){ MethodNode m=(MethodNode)o; if(m.name.equals(n)&&m.desc.equals(d)) return m; }
              throw new RuntimeException("missing method "+c.name+"."+n+d);
            }
            static FieldNode field(ClassNode c,String n,String d){
              for(Object o:c.fields){ FieldNode f=(FieldNode)o; if(f.name.equals(n)&&f.desc.equals(d)) return f; }
              throw new RuntimeException("missing field "+c.name+"."+n+":"+d);
            }
            static void makePublic(FieldNode f){ f.access=(f.access & ~(ACC_PRIVATE|ACC_PROTECTED)) | ACC_PUBLIC; }
            static void makePublic(MethodNode m){ m.access=(m.access & ~(ACC_PRIVATE|ACC_PROTECTED)) | ACC_PUBLIC; }
            static byte[] read(JarFile j,String n)throws Exception{
              InputStream in=j.getInputStream(j.getJarEntry(n)); ByteArrayOutputStream b=new ByteArrayOutputStream(); byte[] x=new byte[8192]; int r;
              while((r=in.read(x))>0)b.write(x,0,r); in.close(); return b.toByteArray();
            }
            static byte[] write(ClassNode c){ ClassWriter w=new ClassWriter(ClassWriter.COMPUTE_MAXS); c.accept(w); return w.toByteArray(); }
            static byte[] patchCt(byte[] data){
              ClassNode c=new ClassNode(); new ClassReader(data).accept(c,0);
              makePublic(field(c,"ho","LClass_dw;"));

              // Native bag renderer: preserve original UI, substitute only its item array while catalog mode is active.
              MethodNode r=method(c,"b","(LClass_dg;[Ljava/lang/String;)V");
              r.instructions.clear(); r.tryCatchBlocks.clear(); if(r.localVariables!=null) r.localVariables.clear();
              InsnList a=r.instructions; LabelNode normal=new LabelNode();
              a.add(new VarInsnNode(ALOAD,1));
              a.add(new MethodInsnNode(INVOKESTATIC,"Class_ct","b","(LClass_dg;)V",false));
              a.add(new VarInsnNode(ALOAD,1)); a.add(new VarInsnNode(ALOAD,2)); a.add(new InsnNode(ICONST_1));
              a.add(new MethodInsnNode(INVOKESTATIC,"Class_ct","a","(LClass_dg;[Ljava/lang/String;Z)V",false));
              a.add(new MethodInsnNode(INVOKESTATIC,"NativeCatalog","active","()Z",false));
              a.add(new JumpInsnNode(IFEQ,normal));
              a.add(new VarInsnNode(ALOAD,0)); a.add(new VarInsnNode(ALOAD,1));
              a.add(new MethodInsnNode(INVOKESTATIC,"NativeCatalog","items","()[LClass_fj;",false));
              a.add(new MethodInsnNode(INVOKESPECIAL,"Class_ct","a","(LClass_dg;[LClass_fj;)V",false));
              a.add(new InsnNode(RETURN));
              a.add(normal);
              a.add(new VarInsnNode(ALOAD,0)); a.add(new VarInsnNode(ALOAD,1));
              a.add(new MethodInsnNode(INVOKESTATIC,"Class_cy","aa","()LClass_cy;",false));
              a.add(new FieldInsnNode(GETFIELD,"Class_cy","bk","[LClass_fj;"));
              a.add(new MethodInsnNode(INVOKESPECIAL,"Class_ct","a","(LClass_dg;[LClass_fj;)V",false));
              a.add(new InsnNode(RETURN)); r.maxLocals=3; r.maxStack=4;

              // Intercept only the native Catalog command. All normal Class_ct actions continue unchanged.
              MethodNode cmd=method(c,"b","(ILjava/lang/Object;)V");
              InsnList pre=new InsnList(); LabelNode keep=new LabelNode();
              pre.add(new VarInsnNode(ILOAD,1));
              pre.add(new MethodInsnNode(INVOKESTATIC,"NativeCatalog","handleAction","(I)Z",false));
              pre.add(new JumpInsnNode(IFEQ,keep)); pre.add(new InsnNode(RETURN)); pre.add(keep);
              cmd.instructions.insert(pre);
              return write(c);
            }
            static byte[] patchK1d(byte[] data){
              ClassNode c=new ClassNode(); new ClassReader(data).accept(c,0);
              makePublic(field(c,"gx","[I")); makePublic(method(c,"D","()V")); makePublic(method(c,"z","(I)V"));
              MethodNode x=method(c,"x","(I)V");
              x.instructions.clear(); x.tryCatchBlocks.clear(); if(x.localVariables!=null)x.localVariables.clear();
              x.instructions.add(new MethodInsnNode(INVOKESTATIC,"NativeCatalog","open","()V",false));
              x.instructions.add(new InsnNode(RETURN)); x.maxLocals=1; x.maxStack=0;
              return write(c);
            }
            public static void main(String[] z)throws Exception{
              JarFile in=new JarFile("game.jar");
              byte[] ct=patchCt(read(in,"Class_ct.class")); byte[] k1d=patchK1d(read(in,"k1d.class"));
              FileOutputStream f1=new FileOutputStream("classes/Class_ct.class"); f1.write(ct); f1.close();
              FileOutputStream f2=new FileOutputStream("classes/k1d.class"); f2.write(k1d); f2.close(); in.close();
            }
          }
          JAVA

          javac -cp asm.jar:asm-tree.jar -d classes src/Patch.java
          java -cp classes:asm.jar:asm-tree.jar Patch
          cp game.jar patched-api.jar
          jar uf patched-api.jar -C classes Class_ct.class -C classes k1d.class

          cat > src/NativeCatalog.java <<'JAVA'
          import java.util.Vector;

          public final class NativeCatalog {
            private static final int RECEIVE = 1100999;
            private static boolean on;
            private static Class_fj[] list = new Class_fj[0];
            private static Class_dw oldHo;
            private NativeCatalog() {}

            public static boolean active(){ return on; }
            public static Class_fj[] items(){ return list; }

            public static void open(){
              try {
                k1d.D();
                int[] ids=k1d.gx;
                Vector v=new Vector();
                if(ids!=null){
                  for(int i=0;i<ids.length;i++){
                    try {
                      Class_fe t=Class_dn.b((short)ids[i]);
                      if(t!=null){
                        Class_fj it=new Class_fj();
                        it.y=t; it.v=1; it.i=v.size();
                        v.addElement(it);
                      }
                    } catch(Throwable ignored) {}
                  }
                }
                Class_fj[] a=new Class_fj[v.size()];
                for(int i=0;i<a.length;i++){ a[i]=(Class_fj)v.elementAt(i); a[i].i=i; }
                Class_ct ct=Class_ct.fj;
                if(ct==null || a.length==0){ try{DoHoang091.a("Catalog không có vật phẩm.");}catch(Throwable ignored){} return; }
                list=a;
                oldHo=ct.ho;
                on=true;
                ct.k();                         // exact native trade/inventory state
                ct.ho=new Class_dw("Nhận", RECEIVE);
                Class_ct.fm=1;                 // exact native inventory tab (6-column bag grid)
                Class_ct.bz=0;
                ct.aa();                        // refresh native softkeys/selection
              } catch(Throwable t){
                closeState();
                try{DoHoang091.a("Không thể mở Catalog.");}catch(Throwable ignored){}
              }
            }

            private static void receive(){
              try {
                int i=Class_ct.bz;
                if(i<0 || i>=list.length) return;
                Class_fj it=list[i];
                if(it==null || it.y==null) return;
                k1d.z((int)it.y.e);             // reuse original Catalog receive/options logic
              } catch(Throwable t){
                try{DoHoang091.a("Không thể nhận vật phẩm.");}catch(Throwable ignored){}
              }
            }

            private static void closeState(){
              try { if(Class_ct.fj!=null && oldHo!=null) Class_ct.fj.ho=oldHo; } catch(Throwable ignored){}
              oldHo=null; on=false; list=new Class_fj[0];
            }

            public static boolean handleAction(int action){
              if(!on) return false;
              if(action==RECEIVE){ receive(); return true; }
              if(action==3){ closeState(); return false; } // let native Đóng continue normally
              return false;
            }
          }
          JAVA

          cat > src/OfflineDeleteMenu.java <<'JAVA'
          import java.io.*;
          import java.util.Vector;

          public final class OfflineDeleteMenu {
            private static boolean active;
            private static int[] map=new int[0];
            private static final int CLEAR=-1001, DELETE=-1002;
            private OfflineDeleteMenu(){}
            private static void reset(){ active=false; map=new int[0]; }

            public static byte[] extend(byte cmd, byte[] data){
              if(cmd!=63 || data==null) return data;
              reset();
              try{
                DataInputStream in=new DataInputStream(new ByteArrayInputStream(data));
                Vector names=new Vector(); int receive=-1; boolean xu=false,luong=false,yen=false;
                while(in.available()>0){
                  String s=in.readUTF(); int i=names.size(); names.addElement(s);
                  if("Nhận vật phẩm".equals(s)) receive=i;
                  else if("Nhận xu".equals(s)) xu=true;
                  else if("Nhận lượng".equals(s)) luong=true;
                  else if("Nhận yên".equals(s)) yen=true;
                }
                if(receive<0 || !xu || !luong || !yen) return data;
                Vector outN=new Vector(), outM=new Vector();
                outN.addElement("Nhận vật phẩm"); outM.addElement(new Integer(receive));
                outN.addElement("Xóa toàn bộ vật phẩm trong hành trang"); outM.addElement(new Integer(CLEAR));
                for(int i=0;i<names.size();i++) if(i!=receive){ outN.addElement(names.elementAt(i)); outM.addElement(new Integer(i)); }
                outN.addElement("Xóa nhân vật đang chơi"); outM.addElement(new Integer(DELETE));
                ByteArrayOutputStream bo=new ByteArrayOutputStream(data.length+160); DataOutputStream o=new DataOutputStream(bo);
                map=new int[outN.size()];
                for(int i=0;i<outN.size();i++){ o.writeUTF((String)outN.elementAt(i)); map[i]=((Integer)outM.elementAt(i)).intValue(); }
                o.flush(); active=true; return bo.toByteArray();
              }catch(Throwable t){ reset(); return data; }
            }

            private static int[] decode(byte[] d){
              if(d==null||d.length<2)return null; int op,idx,pos;
              if(d.length>=4){op=d[1]&255;idx=d[2]&255;pos=2;}
              else if(d.length==2){op=d[0]&255;idx=d[1]&255;pos=1;}
              else {int a=d[0]&255,b=d[1]&255;if(a==37){op=a;idx=b;pos=1;}else if(b==37){op=b;idx=d[2]&255;pos=2;}else{op=a;idx=b;pos=1;}}
              return new int[]{op,idx,pos};
            }

            public static boolean consume(byte cmd, byte[] data){
              if(cmd!=29 || !active) return false;
              int[] p=decode(data); if(p==null){reset();return false;}
              int op=p[0],idx=p[1],pos=p[2]; int[] m=map; reset();
              if(op!=37 || idx<0 || idx>=m.length) return false;
              int target=m[idx];
              if(target==CLEAR){ try{InventoryClear.clearCurrentBag();}catch(Throwable ignored){} return true; }
              if(target==DELETE){ try{CharacterDelete.deleteCurrent();}catch(Throwable ignored){} return true; }
              data[pos]=(byte)target;             // preserve every original server action, incl. Nhận vật phẩm submenu
              return false;
            }
          }
          JAVA

          javac --release 8 -cp patched-api.jar -d classes src/NativeCatalog.java src/OfflineDeleteMenu.java

          rm -rf work && mkdir work && cd work
          jar xf ../game.jar
          cp ../classes/Class_ct.class ../classes/k1d.class ../classes/NativeCatalog.class ../classes/OfflineDeleteMenu.class .
          rm -f ItemCatalogGrid.class FakeClassState.class
          rm -f META-INF/*.SF META-INF/*.RSA META-INF/*.DSA
          zip -qr ../native.jar .
          cd ..

          # Static validation.
          unzip -t native.jar >/dev/null
          jar tf native.jar | grep -q '^NativeCatalog.class$'
          ! jar tf native.jar | grep -q '^ItemCatalogGrid.class$'
          ! jar tf native.jar | grep -q '^FakeClassState.class$'
          javap -classpath native.jar -p NativeCatalog > native.txt
          javap -classpath native.jar -p -c OfflineDeleteMenu > menu.txt
          javap -classpath native.jar -p -c k1d > k1d.txt
          javap -classpath native.jar -p Class_ct > ct.txt
          grep -q 'handleAction' native.txt
          grep -q 'NativeCatalog.open' k1d.txt
          grep -q 'public Class_dw ho;' ct.txt
          grep -q 'Xóa toàn bộ vật phẩm trong hành trang' menu.txt
          ! grep -q 'Fake phái' menu.txt
          cp native.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"

          cd "$GITHUB_WORKSPACE"
          rm -rf native_ui native_ui_report native_symbols native_trade_map native_javap native_trade_exact trade_render_focus native_trade_input native_exact
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use native inventory UI for item catalog"
          git push --force-with-lease origin HEAD:chatgpt/native-catalog-inventory-ui
      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: clean temporary native catalog workflows"
          git push origin main
