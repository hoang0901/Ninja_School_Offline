name: Temporary javap native trade map
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-javap-native-trade.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract native trade methods from bytecode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jtrade && mkdir -p /tmp/jtrade/report
          cd /tmp/jtrade
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          javap -classpath game.jar -p -c -s Class_ct > ct.txt
          javap -classpath game.jar -p -c -s Class_gd > gd.txt
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('ct.txt').read_text(errors='replace').splitlines()
          pats=['Class_gd.fv','Class_gd.pw','Class_gd.doa','Class_gd.el','Class_cy.dc','Class_cy.dc.b','Field bz:I','Class_ct.bz']
          blocks=[]
          starts=[]
          for i,l in enumerate(lines):
              if re.match(r'^\s{2}(public|private|protected|static|final)', l) and '(' in l and l.rstrip().endswith(';'):
                  starts.append(i)
          starts.append(len(lines))
          for a,b in zip(starts,starts[1:]):
              block='\n'.join(lines[a:b])
              hit=[p for p in pats if p in block]
              if hit:
                  blocks.append('===== hits: '+', '.join(hit)+' =====\n'+block+'\n')
          Path('report/methods.txt').write_text('\n'.join(blocks))
          # Constant pool/string metadata for the four localized fields.
          refs=[]
          g=Path('gd.txt').read_text(errors='replace').splitlines()
          for i,l in enumerate(g):
              if re.search(r'\b(fv|pw|doa|el)\b', l):
                  refs.extend(g[max(0,i-8):min(len(g),i+15)])
                  refs.append('---')
          Path('report/gd_refs.txt').write_text('\n'.join(refs))
          PY
          git -C "$GITHUB_WORKSPACE" checkout chatgpt/native-catalog-inventory-ui
          rm -rf "$GITHUB_WORKSPACE/native_javap"
          cp -r report "$GITHUB_WORKSPACE/native_javap"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native_javap
          git diff --cached --quiet || git commit -m "chore: map native trade methods with javap"
          git push origin HEAD:chatgpt/native-catalog-inventory-ui
      - name: Cleanup temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main
          git rm -- .github/workflows/temp-javap-native-trade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove javap native trade workflow"
          git push origin main
