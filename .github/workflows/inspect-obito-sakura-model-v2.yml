name: Inspect Obito Sakura model v2
on:
  push:
    branches: [fix-obito-sakura-model-v2]
    paths: ['.github/workflows/inspect-obito-sakura-model-v2.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace reference fashion equip logic and target bytecode
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/model_v2_trace.txt"
          exec > >(tee "$LOG") 2>&1
          git clone --depth 1 https://github.com/hoang0901/Nso_Folder.git /tmp/ref >/dev/null 2>&1
          SRC=/tmp/ref/NinjaSchoolOffline_by_dohoang091/src/main/java
          echo '=== REFERENCE: fashion assignment/use ==='
          grep -RIn --include='*.java' -E 'fashion\[|template\.fashion|ID_HAIR|ID_BODY|ID_LEG' "$SRC/Exe_Z" | head -n 350 || true
          echo '=== REFERENCE: equip/use methods around fashion ==='
          grep -RIn --include='*.java' -E 'isTypeBody\(|equipment\[|new Equip|Equip\(' "$SRC/Exe_Z/model" "$SRC/Exe_Z/item" | head -n 250 || true
          echo '=== REFERENCE SQL fashion roots 174 177 230 233 ==='
          python3 - <<'PY'
          import re
          p='/tmp/ref/NinjaSchoolOffline_by_dohoang091/SQL/nsoz.sql'
          for line in open(p,encoding='utf-8',errors='ignore'):
            if re.search(r',\s*(174|177|230|233),\s*[01]\)\s*[,;]?$',line.strip()): print(line.rstrip())
          PY
          echo '=== TARGET ITEM ROWS WITH fashion roots ==='
          mkdir -p /tmp/jar && (cd /tmp/jar && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar")
          cat > /tmp/DumpFashionRows.java <<'JAVA'
          import java.lang.reflect.*;import java.util.*;
          public class DumpFashionRows{
            public static void main(String[]a)throws Exception{
              Class<?> tc=Class.forName("k2c");Constructor<?> ct=tc.getDeclaredConstructor(String.class);ct.setAccessible(true);Object t=ct.newInstance("item");
              Method f=tc.getDeclaredMethod("find",int.class);f.setAccessible(true);
              for(int id=0;id<2000;id++)try{Object r=f.invoke(t,id);if(r==null)continue;Field ns=r.getClass().getDeclaredField("numbers"),ss=r.getClass().getDeclaredField("strings");ns.setAccessible(true);ss.setAccessible(true);long[] n=(long[])ns.get(r);Object[] s=(Object[])ss.get(r);if(n.length>8&&(n[8]==174||n[8]==177||n[8]==230||n[8]==233)){System.out.println(id+" nums="+Arrays.toString(n)+" strs="+Arrays.deepToString(s));}}catch(Throwable x){}
            }
          }
          JAVA
          javac -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" /tmp/DumpFashionRows.java
          java -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar:/tmp" DumpFashionRows || true
          echo '=== TARGET BYTECODE constants 230/233 and fashion-like strings ==='
          cd /tmp/jar
          for c in *.class; do
            j=$(javap -classpath . -c -p "${c%.class}" 2>/dev/null || true)
            if printf '%s\n' "$j" | grep -qE 'sipush[[:space:]]+(230|231|232|233|234|235)|bipush[[:space:]]+(230|231|232|233|234|235)'; then
              echo "===== ${c%.class} ====="
              printf '%s\n' "$j" | grep -n -B18 -A30 -E 'sipush[[:space:]]+(230|231|232|233|234|235)|bipush[[:space:]]+(230|231|232|233|234|235)' | head -n 240 || true
            fi
          done
          echo '=== TARGET CLASSES referencing item type/equip/fashion text ==='
          for c in *.class; do
            if strings "$c" | grep -qiE 'fashion|equip|costume|disguise'; then echo "--${c%.class}--"; strings "$c" | grep -iE 'fashion|equip|costume|disguise' | head -n 40; fi
          done
      - name: Commit trace
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model_v2_trace.txt
          git commit -m 'chore: trace disguise fashion application v2' || exit 0
          git push origin fix-obito-sakura-model-v2
