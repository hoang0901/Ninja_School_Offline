name: Temporary fix lv120 learn state

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-fix-lv120-learn-state.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only lv120 learned-row storage
        shell: python
        run: |
          import zipfile, struct, os, subprocess, re
          jar='Nso_Offline_By_h0901.jar'
          out=jar+'.patched'

          with zipfile.ZipFile(jar,'r') as zin:
              original={n:zin.read(n) for n in zin.namelist()}
              b=bytearray(original['k25.class'])

          o=0
          def u1():
              global o; v=b[o]; o+=1; return v
          def u2():
              global o; v=struct.unpack_from('>H',b,o)[0]; o+=2; return v
          def u4():
              global o; v=struct.unpack_from('>I',b,o)[0]; o+=4; return v

          assert u4()==0xCAFEBABE
          u2(); u2(); cp_count=u2(); cp=[None]*cp_count
          i=1
          while i<cp_count:
              tag=u1()
              if tag==1:
                  ln=u2(); cp[i]=bytes(b[o:o+ln]).decode('utf-8','replace'); o+=ln
              elif tag in (3,4): o+=4
              elif tag in (5,6): o+=8; i+=1
              elif tag in (7,8,16,19,20): o+=2
              elif tag in (9,10,11,12,17,18): o+=4
              elif tag==15: o+=3
              else: raise RuntimeError(f'unsupported cp tag {tag}')
              i+=1

          # class header / interfaces / fields
          o+=6
          ni=u2(); o+=2*ni
          nf=u2()
          for _ in range(nf):
              o+=6; ac=u2()
              for __ in range(ac): u2(); ln=u4(); o+=ln

          # Find g(II)Z. Replace ONLY bytecode offsets 92..104:
          # old: aload 4; getfield k24.e; iconst_1; baload; sipush 255; iand; istore 5
          # new: iconst_1; istore 5; NOP x10
          nm=u2(); changed=0
          for _ in range(nm):
              o+=2; name_i=u2(); desc_i=u2(); ac=u2()
              name=cp[name_i]; desc=cp[desc_i]
              for __ in range(ac):
                  ai=u2(); ln=u4(); start=o
                  if name=='g' and desc=='(II)Z' and cp[ai]=='Code':
                      p=start+4
                      clen=struct.unpack_from('>I',b,p)[0]; p+=4
                      code_start=p
                      if clen <= 105: raise RuntimeError('g(II)Z unexpectedly short')
                      old=bytes(b[code_start+92:code_start+105])
                      # Validate exact instruction shape, allowing constant-pool index bytes to vary.
                      if not (old[0:2]==bytes([0x19,0x04]) and old[2]==0xB4 and old[5]==0x04 and old[6]==0x33 and old[7:10]==bytes([0x11,0x00,0xFF]) and old[10]==0x7E and old[11:13]==bytes([0x36,0x05])):
                          raise RuntimeError('lv120 learned-value bytecode pattern changed: '+old.hex())
                      new=bytes([0x04,0x36,0x05]) + bytes([0x00])*10
                      b[code_start+92:code_start+105]=new
                      changed+=1
                  o=start+ln
          if changed!=1: raise RuntimeError(f'expected one g(II)Z patch, got {changed}')

          with zipfile.ZipFile(jar,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              changed_entries=[]
              for info in zin.infolist():
                  payload=bytes(b) if info.filename=='k25.class' else original[info.filename]
                  if payload != original[info.filename]: changed_entries.append(info.filename)
                  zout.writestr(info,payload)
          if changed_entries != ['k25.class']:
              raise RuntimeError(f'unexpected changed entries: {changed_entries}')
          with zipfile.ZipFile(out,'r') as z:
              bad=z.testzip()
              if bad: raise RuntimeError(f'CRC failure: {bad}')
              open('/tmp/k25.class','wb').write(z.read('k25.class'))
          os.replace(out,jar)

          subprocess.run(['javap','-p','-c','/tmp/k25.class'],stdout=open('/tmp/k25.txt','w'),check=True)
          text=open('/tmp/k25.txt').read()
          m=re.search(r'static boolean g\(int, int\).*?static boolean b\(',text,re.S)
          if not m: raise RuntimeError('cannot locate patched g(II)Z in javap')
          block=m.group(0)
          # Must still contain lv120 ID guard 85..90 and now assign local 5 directly to 1.
          if 'bipush        85' not in block or 'bipush        90' not in block:
              raise RuntimeError('lv120 ID guard missing')
          if not re.search(r'92:\s+iconst_1\s+93:\s+istore\s+5',block):
              raise RuntimeError('row=1 patch validation failed')
          print('Validated: lv120 IDs 85-90 now persist learned row index 1; only k25.class changed.')

      - name: Commit corrected JAR only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Nso_Offline_By_h0901.jar
          git diff --cached --quiet && { echo 'No JAR change'; exit 1; }
          git commit -m "fix: persist level 120 learned skill row"
          git push
