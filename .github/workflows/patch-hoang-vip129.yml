name: Patch hoang VIP129
on:
  push:
    branches: [chatgpt/restore-hoang-sword-129]
    paths: [.github/workflows/patch-hoang-vip129.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch hoang to female bun sword level129 VIP seed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hoang129 && mkdir -p /tmp/hoang129/src /tmp/hoang129/out
          cd /tmp/hoang129
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o javassist.jar https://repo1.maven.org/maven2/org/javassist/javassist/3.30.2-GA/javassist-3.30.2-GA.jar
          cat > src/Patch.java <<'JAVA'
          import java.io.*;
          import java.util.jar.*;
          import javassist.*;
          public class Patch {
            public static void main(String[] args) throws Exception {
              ClassPool pool = new ClassPool(true);
              pool.insertClassPath("game.jar");
              CtClass c = pool.get("DoHoang091");
              CtMethod m = c.getDeclaredMethod("zHoangVipStarter");
              m.setBody(
                "{ if (as == null && aj != null) {" +
                "int idx=-1;" +
                "for (int i=0;i<aj.length;i++){ if(aj[i]!=null && aj[i].a!=null && \"hoang\".equalsIgnoreCase(aj[i].a)){ idx=i; break; } }" +
                "if(idx<0){ DoHoang091$k0 v=DoHoang091.ar(); if(v!=null){ DoHoang091$k0[] n=new DoHoang091$k0[aj.length+1]; System.arraycopy(aj,0,n,0,aj.length); n[aj.length]=v; aj=n; idx=n.length-1; } }" +
                "if(idx>=0){ DoHoang091$k0 cur=aj[idx];" +
                "if(cur.r!=129 || cur.p!=(byte)1 || cur.q!=(short)2 || cur.bx!=(byte)1){" +
                "String nm=cur.a; DoHoang091$k0 vip=DoHoang091.ar(); if(vip!=null){ cur=vip; cur.a=nm; }" +
                "cur.p=(byte)1; cur.q=(short)2; cur.bx=(byte)1; cur.r=129;" +
                "DoHoang091.l(cur); aj[idx]=cur; ak=idx; an=true; DoHoang091.as();" +
                "}" +
                "}" +
                "}" +
                "}"
              );
              byte[] bytes = c.toBytecode();
              try(FileOutputStream f=new FileOutputStream("out/DoHoang091.class")){ f.write(bytes); }
              c.detach();
            }
          }
          JAVA
          javac -cp javassist.jar -d out src/Patch.java
          java -cp javassist.jar:out Patch
          jar uf game.jar -C out DoHoang091.class
          zip -d game.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' >/dev/null 2>&1 || true
          unzip -t game.jar >/dev/null
          javap -classpath game.jar -p -c DoHoang091 > verify.txt
          grep -q 'sipush        129' verify.txt
          grep -q 'Field DoHoang091\$k0.p:B' verify.txt
          grep -q 'Field DoHoang091\$k0.q:S' verify.txt
          grep -q 'Field DoHoang091\$k0.bx:B' verify.txt
          grep -q 'Method ar:()LDoHoang091\$k0;' verify.txt
          unzip -p game.jar offline/admin_seed.rms > seed.rms
          test "$(stat -c%s seed.rms)" = "8286"
          {
            echo '=== JAR SHA256 ==='; sha256sum game.jar
            echo '=== ADMIN SEED SIZE ==='; stat -c%s seed.rms
            echo '=== PATCHED METHOD ==='; grep -n -A180 -B5 'zHoangVipStarter' verify.txt | tail -n 220
          } > "$GITHUB_WORKSPACE/hoang_vip129_verify.txt"
          cp game.jar "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          cd "$GITHUB_WORKSPACE"
          git add -- Nso_Offline_By_h0901.jar hoang_vip129_verify.txt
          git -c user.name=ChatGPT -c user.email=actions@github.com commit -m 'feat: restore hoang female bun sword level129 VIP gear'
          git push origin HEAD:chatgpt/restore-hoang-sword-129
