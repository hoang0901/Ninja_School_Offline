name: Inspect live hoang character state
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-hoang-live.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect current jar
        shell: bash
        run: |
          set -euo pipefail
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          rm -rf /tmp/hoanglive && mkdir -p /tmp/hoanglive/out
          cd /tmp/hoanglive
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar "$J" --outputdir out >/dev/null 2>&1 || true
          {
            echo '=== JAR SHA256 ==='
            sha256sum "$J"
            echo
            echo '=== HOANG STRING HITS ==='
            grep -Rni -B15 -A80 '"hoang"\|hoang' out | head -n 2200 || true
            echo
            echo '=== DOHOANG091 JAVAP ==='
            javap -classpath "$J" -p -c DoHoang091 2>&1 || true
            echo
            echo '=== K0 JAVAP ==='
            javap -classpath "$J" -p -c 'DoHoang091$k0' 2>&1 || true
            echo
            echo '=== SAVE STATE JAVAP ==='
            javap -classpath "$J" -p -c DoHoang091SaveState 2>&1 || true
            echo
            echo '=== OFFLINE BRIDGE JAVAP ==='
            javap -classpath "$J" -p -c OfflineBridge 2>&1 || true
            echo
            echo '=== LIKELY CHARACTER FILES ==='
            grep -RliE 'DoHoang091\$k0|new k0|new DoHoang091\.k0|"hoang"|saveState|restoreState' out | head -n 150 || true
          } > "$GITHUB_WORKSPACE/hoang_live_inspect.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add -- hoang_live_inspect.txt
          git commit -m 'chore: capture live hoang character state' || true
          git push origin HEAD:main
      - name: Remove inspector workflow
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-inspect-hoang-live.yml || true
          git config user.name ChatGPT
          git config user.email actions@github.com
          git commit -m 'chore: remove live hoang inspector' || true
          git push origin HEAD:main || true
