name: Debug Class_et native menu
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-main-find-login.yml]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dump Class_et focus
        shell: bash
        run: |
          set -euo pipefail
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          rm -rf /tmp/etdebug && mkdir -p /tmp/etdebug
          cd /tmp/etdebug
          javap -classpath "$J" -p Class_et > sig.txt
          javap -classpath "$J" -p -c Class_et > code.txt
          {
            echo '=== SIGNATURE ==='
            cat sig.txt
            echo '=== METHODS / MENU FOCUS ==='
            grep -n -B18 -A80 -E '^  (public|private|protected).*\(|putstatic +#.*Class_et\.r|putstatic +#.*Class_et\.v|getstatic +#.*Class_et\.r|getstatic +#.*Class_et\.v|sipush +100[0-9]|sipush +101[0-9]|Class_dw\."<init>"|Class_dw\.<init>|DoHoang091|CharacterDelete' code.txt || true
          } > "$GITHUB_WORKSPACE/class_et_debug.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- class_et_debug.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: dump Class_et native menu bytecode'
          git push origin main
