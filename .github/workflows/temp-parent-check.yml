name: Temporary parent jar check
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-parent-check.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect pre-fake JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/parentcheck parent_check.txt
          mkdir -p /tmp/parentcheck/classes
          git show 245c1d2ba6c242bb92d56fcf509376267ed9c06e:Nso_Offline_By_h0901.jar > /tmp/parentcheck/game.jar
          cd /tmp/parentcheck
          unzip -q game.jar -d classes
          {
            echo "JAR_SHA256=$(sha256sum game.jar | awk '{print $1}')"
            for f in OfflineDeleteMenu.class InventoryClear.class CharacterDelete.class OfflineBridge.class FakeClassState.class; do
              if [ -f "classes/$f" ]; then echo "PRESENT $f"; else echo "ABSENT $f"; fi
            done
            echo '--- OFFLINE DELETE MENU ---'
            javap -classpath game.jar -p -c OfflineDeleteMenu 2>&1 || true
            echo '--- MANIFEST ---'
            unzip -p game.jar META-INF/MANIFEST.MF || true
          } > "$GITHUB_WORKSPACE/parent_check.txt"
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parent_check.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: verify pre-fake JAR baseline"
          git push
