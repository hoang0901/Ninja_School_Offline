name: temp debug character delete
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-debug-character-delete.yml']
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Reuse patch workflow source and capture failure
        shell: bash
        run: |
          set +e
          exec > >(tee character_delete_build_log.txt) 2>&1
          echo START
          git show 99daa52623974d290394cb47ce820e7cb54ffa16:.github/workflows/temp-fix-character-delete.yml > /tmp/w.yml
          python3 - <<'PY'
          import re
          s=open('/tmp/w.yml').read()
          m=re.search(r"cat > src/Build.java <<'JAVA'\n(.*?)\n          JAVA",s,re.S)
          assert m
          text='\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          open('/tmp/Build.java','w').write(text+'\n')
          PY
          rm -rf /tmp/chardel && mkdir -p /tmp/chardel/src /tmp/chardel/classes
          cp /tmp/Build.java /tmp/chardel/src/Build.java
          cp Nso_Offline_By_h0901.jar /tmp/chardel/game.jar
          cd /tmp/chardel
          curl -fsSL -o asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar; echo curl1=$?
          curl -fsSL -o asm-tree.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar; echo curl2=$?
          javac -cp asm.jar:asm-tree.jar -d classes src/Build.java; echo javac=$?
          java -cp asm.jar:asm-tree.jar:classes Build; echo generator=$?
          jar uf game.jar -C classes CharacterDelete.class; echo jarupdate=$?
          unzip -t game.jar >/dev/null; echo unzip=$?
          javap -classpath game.jar -c -p CharacterDelete > del.txt; echo javap=$?
          grep -n 'DoHoang091.as\|DoHoang091.U\|ninja_school_offline_v3' del.txt; echo grep=$?
          cd "$GITHUB_WORKSPACE"
          cp /tmp/chardel/del.txt character_delete_javap.txt 2>/dev/null || true
          git config user.name ChatGPT
          git config user.email actions@github.com
          git add character_delete_build_log.txt character_delete_javap.txt
          git commit -m 'chore: capture character delete build log' || true
          git push origin main
