name: Inspect save and login flow
on:
  push:
    branches: [chatgpt/save-menu-redesign]
    paths: [.github/workflows/temp-inspect-save-menu.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decompile and locate save/login/delete flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/saveinspect && mkdir -p /tmp/saveinspect/out
          cd /tmp/saveinspect
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar game.jar --outputdir out >/dev/null 2>&1 || true
          {
            echo '=== STRING HITS ==='
            grep -RniE 'Đăng nhập|Dang nhap|đăng nhập|Chơi mới|Choi moi|Tiếp tục|Tiep tuc|Sao lưu|Sao luu|Khôi phục|Khoi phuc|Xóa nhân vật|Xoa nhan vat|CharacterDelete|deleteCurrent|RMS|RecordStore|save|backup|restore' out | head -n 1200 || true
            echo
            echo '=== CLASS NAMES WITH LOGIN/AUTH/SAVE/DELETE ==='
            find out -name '*.java' -print | grep -Ei 'login|save|delete|character|select|menu|offline' | head -n 300 || true
          } > report.txt
          mkdir -p "$GITHUB_WORKSPACE/save_menu_inspect"
          cp report.txt "$GITHUB_WORKSPACE/save_menu_inspect/report.txt"
          # copy likely source files containing relevant literals/methods
          grep -RliE 'Đăng nhập|Dang nhap|Chơi mới|Choi moi|Tiếp tục|Tiep tuc|Sao lưu|Sao luu|Khôi phục|Khoi phuc|Xóa nhân vật|Xoa nhan vat|deleteCurrent|CharacterDelete|RecordStore' out | head -n 80 | while read f; do cp "$f" "$GITHUB_WORKSPACE/save_menu_inspect/$(basename "$f")"; done
          cd "$GITHUB_WORKSPACE"
          git add -- save_menu_inspect
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: capture save menu inspection' || true
          git push origin HEAD:chatgpt/save-menu-redesign
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin chatgpt/save-menu-redesign || true
          git rm -f .github/workflows/temp-inspect-save-menu.yml || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: remove save menu inspector' || true
          git push origin HEAD:chatgpt/save-menu-redesign || true
