name: Inspect k0 only
on:
  push:
    branches: [chatgpt/sword-strongest-character]
    paths: [.github/workflows/temp-inspect-k0.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sword-strongest-character
          fetch-depth: 0
      - name: Dump k0 and item model
        shell: bash
        run: |
          set -euo pipefail
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          {
            echo '=== K0 SIG ==='
            javap -classpath "$J" -p 'DoHoang091$k0'
            echo '=== K0 BYTECODE ==='
            javap -classpath "$J" -p -c 'DoHoang091$k0'
            echo '=== ITEM SIG ==='
            javap -classpath "$J" -p Class_fj
            javap -classpath "$J" -p Class_fe
            echo '=== ITEM CONSTRUCTORS ==='
            javap -classpath "$J" -p -c Class_fj | grep -n -B5 -A30 '<init>' || true
            echo '=== DOHOANG K0 FIELD USES ==='
            javap -classpath "$J" -p -c DoHoang091 | grep -n -B8 -A22 -E 'DoHoang091\$k0\.[a-zA-Z]+:|new +#.*DoHoang091\$k0' || true
          } > "$GITHUB_WORKSPACE/k0_only.txt"
          git add -- k0_only.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect k0 model'
          git push origin HEAD:chatgpt/sword-strongest-character