name: Dump startup bytecode
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-dump-startup.yml]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dump startup bytecode to main
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== MANIFEST ==='
            unzip -p Nso_Offline_By_h0901.jar META-INF/MANIFEST.MF || true
            echo
            echo '=== CLASS_DA ==='
            javap -classpath Nso_Offline_By_h0901.jar -p -c Class_da || true
            echo
            echo '=== CLASS_DO ==='
            javap -classpath Nso_Offline_By_h0901.jar -p -c Class_do || true
            echo
            echo '=== DOHOANG091 METHODS ==='
            javap -classpath Nso_Offline_By_h0901.jar -p DoHoang091 || true
            echo
            echo '=== CHARACTER DELETE ==='
            javap -classpath Nso_Offline_By_h0901.jar -p -c CharacterDelete || true
            echo
            echo '=== SAVE STATE ==='
            javap -classpath Nso_Offline_By_h0901.jar -p -c DoHoang091SaveState || true
            echo
            echo '=== K20 ==='
            javap -classpath Nso_Offline_By_h0901.jar -p -c k20 || true
          } > startup_debug.txt 2>&1
          git add -- startup_debug.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: capture startup debug'
          git push origin main
