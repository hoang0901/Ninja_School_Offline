name: Temporary audit fake class menu
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-audit-fake-class-menu.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused scan
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fakeaudit && mkdir -p /tmp/fakeaudit && cd /tmp/fakeaudit
          jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          python - <<'PY' > "$GITHUB_WORKSPACE/fake_class_audit.txt"
          import os,struct
          root='/tmp/fakeaudit'
          print('=== MANIFEST ===')
          p=os.path.join(root,'META-INF','MANIFEST.MF')
          if os.path.exists(p): print(open(p,errors='replace').read())
          keys=['female','fan','vip','v12','local','offline','ninja','phái','phai','kiếm','kiem','tiêu','tieu','kunai','cung','đao','dao','quạt','quat','bản thân','ban than','hành trang','hanh trang','kỹ năng','ky nang','menu','trang bị','trang bi','môn phái','mon phai','trường','ookaza','haruna','hirasaki']
          def scan(path):
              b=open(path,'rb').read(); o=0; out=[]
              def u1():
                  nonlocal o; v=b[o];o+=1;return v
              def u2():
                  nonlocal o; v=struct.unpack_from('>H',b,o)[0];o+=2;return v
              def u4():
                  nonlocal o; v=struct.unpack_from('>I',b,o)[0];o+=4;return v
              try:
                  if u4()!=0xCAFEBABE:return out
                  u2();u2(); n=u2(); i=1
                  while i<n:
                      tag=u1()
                      if tag==1:
                          ln=u2(); s=b[o:o+ln].decode('utf-8','replace');o+=ln
                          if any(k in s.lower() for k in keys): out.append(s)
                      elif tag in (3,4):o+=4
                      elif tag in (5,6):o+=8;i+=1
                      elif tag in (7,8,16,19,20):o+=2
                      elif tag in (9,10,11,12,17,18):o+=4
                      elif tag==15:o+=3
                      else:break
                      i+=1
              except Exception: pass
              return out
          for dp,_,fs in os.walk(root):
              for f in sorted(fs):
                  if not f.endswith('.class'):continue
                  path=os.path.join(dp,f); ss=scan(path)
                  if ss:
                      print('\n### '+os.path.relpath(path,root)+' ###')
                      for s in ss: print(repr(s))
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fake_class_audit.txt
          git commit -m "chore: audit fake class integration points"
          git push
