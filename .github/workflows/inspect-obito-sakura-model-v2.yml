name: Inspect Obito Sakura model v2
on:
  push:
    branches: [fix-obito-sakura-model-v2]
    paths: ['.github/workflows/inspect-obito-sakura-model-v2.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reference and offline model resources
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/model_v2_report.txt"
          exec > >(tee "$LOG") 2>&1
          echo '=== REFERENCE SOURCE MAPPING ==='
          git clone --depth 1 https://github.com/hoang0901/Nso_Folder.git /tmp/ref >/dev/null 2>&1
          grep -n -A5 -B3 'case 230\|case 233' /tmp/ref/NinjaSchoolOffline_by_dohoang091/src/main/java/Exe_Z/fashion/FashionFromEquip.java || true
          echo '=== REFERENCE FILES 230-235 ==='
          find /tmp/ref/NinjaSchoolOffline_by_dohoang091 -type f \( -name '230' -o -name '230.*' -o -name '231' -o -name '231.*' -o -name '232' -o -name '232.*' -o -name '233' -o -name '233.*' -o -name '234' -o -name '234.*' -o -name '235' -o -name '235.*' \) -printf '%p %s bytes\n' | sort || true
          echo '=== REFERENCE PATHS CONTAINING part ==='
          find /tmp/ref/NinjaSchoolOffline_by_dohoang091 -maxdepth 5 -type d -iname '*part*' -print || true
          echo '=== REFERENCE SQL ROWS 1173/1174 ==='
          grep -RIn --include='*.sql' -E '\(1173[,)]|\(1174[,)]|Obito|Sakura' /tmp/ref/NinjaSchoolOffline_by_dohoang091 | head -n 80 || true
          echo '=== TARGET JAR ENTRIES ==='
          mkdir -p /tmp/jar && (cd /tmp/jar && jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar")
          find /tmp/jar -type f | sed 's#^/tmp/jar/##' | grep -Ei 'part|230|231|232|233|234|235' | head -n 300 || true
          echo '=== TARGET OFFLINE INDEX PATHS ==='
          cat > /tmp/ListPaths.java <<'JAVA'
          import java.lang.reflect.*;
          public class ListPaths {
            public static void main(String[]a)throws Exception{
              Class<?> c=Class.forName("k1e"); Method ensure=c.getDeclaredMethod("ensureIndex");ensure.setAccessible(true);ensure.invoke(null);
              for(Field f:c.getDeclaredFields()){f.setAccessible(true);Object v=f.get(null);if(v instanceof String[]){String[] s=(String[])v;System.out.println("FIELD "+f.getName()+" len="+s.length);for(String x:s)if(x!=null && (x.toLowerCase().contains("part")||x.matches(".*(^|[/_.-])(230|231|232|233|234|235)([/_.-]|$).*")))System.out.println(x);}}
            }
          }
          JAVA
          javac -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" /tmp/ListPaths.java
          java -classpath "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar:/tmp" ListPaths || true
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model_v2_report.txt
          git commit -m 'chore: inspect Obito Sakura model resources v2' || exit 0
          git push origin fix-obito-sakura-model-v2
