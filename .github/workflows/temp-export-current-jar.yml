name: Temporary current JAR export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-main-nso-jar
          path: Nso_Offline_By_h0901.jar
          if-no-files-found: error
