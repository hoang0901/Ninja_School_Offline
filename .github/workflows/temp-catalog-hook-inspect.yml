name: Temporary catalog hook inspect
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-catalog-hook-inspect.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bridge hooks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chook catalog_hook && mkdir -p /tmp/chook catalog_hook
          cd /tmp/chook
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          mkdir out
          for c in OfflineBridge OfflineDeleteMenu DoHoang091 dt Class_de Class_fp; do
            unzip -p game.jar "$c.class" > "$c.class" || true
            java -jar cfr.jar "$c.class" --extraclasspath game.jar --outputdir out --silent true >/tmp/$c.log 2>&1 || true
          done
          for f in out/*.java; do
            [ -f "$f" ] || continue
            b=$(basename "$f" .java)
            grep -n -B100 -A300 -E 'OfflineDeleteMenu|OfflineBridge|case 29|case 63|new Class_de|Class_fp|writeByte|writeShort|send|a\(byte' "$f" | head -20000 > "$GITHUB_WORKSPACE/catalog_hook/${b}.txt" || true
          done
          jar tf game.jar | grep '^javax/microedition/lcdui/Canvas.class$' > "$GITHUB_WORKSPACE/catalog_hook/has_canvas.txt" || true
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog_hook
          git diff --cached --quiet && exit 0
          git commit -m "chore: inspect catalog bridge hooks"
          git push
