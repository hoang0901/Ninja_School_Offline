name: Inspect receive input flow
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-receive-input.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect k1d input handlers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/recv && mkdir -p /tmp/recv/out
          cd /tmp/recv
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          unzip -p game.jar k1d.class > k1d.class
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar k1d.class --extraclasspath game.jar --outputdir out --silent true >/dev/null 2>&1 || true
          {
            grep -n -B40 -A100 -E 'case 30014|30014|private static void j\(|static void j\(|private static void z\(|static void z\(' out/k1d.java || true
            grep -n -B25 -A80 -E 'DoHoang091\.a\(' out/k1d.java | head -1200 || true
          } > report.txt
          git checkout chatgpt/catalog-by-type
          mkdir -p receive_inspect
          cp report.txt receive_inspect/k1d.txt
          git add receive_inspect/k1d.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect item receive prompts' || true
          git push origin HEAD:chatgpt/catalog-by-type
      - name: Remove workflow from main
        if: always()
        shell: bash
        run: |
          git checkout main
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-inspect-receive-input.yml || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: remove receive input inspector' || true
          git push origin main || true
