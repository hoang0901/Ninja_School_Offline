name: Temporary template map
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-template-map.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find client item template mapping
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tmap template_map
          mkdir -p /tmp/tmap template_map
          cd /tmp/tmap
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          mkdir out
          java -jar cfr.jar game.jar --outputdir out --silent true >/tmp/cfr.log 2>&1 || true
          grep -R -n -E 'Class_fe\[\]|new Class_fe\[|Class_fe.*\[[^]]+\]|\.y = .*Class_fe' out --include='*.java' | head -5000 > "$GITHUB_WORKSPACE/template_map/locations.txt" || true
          cut -d: -f1 "$GITHUB_WORKSPACE/template_map/locations.txt" | sort -u | head -20 > /tmp/files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            b=$(basename "$f" .java)
            grep -n -B100 -A500 -E 'Class_fe\[\]|new Class_fe\[|Class_fe|new Class_fj|\.y =' "$f" | head -18000 > "$GITHUB_WORKSPACE/template_map/${b}.txt" || true
          done < /tmp/files.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template_map
          git diff --cached --quiet && exit 0
          git commit -m "chore: inspect client item template map"
          git push
