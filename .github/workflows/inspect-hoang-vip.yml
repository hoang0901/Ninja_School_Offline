name: Inspect hoang vip starter
on:
  push:
    branches: [chatgpt/hoang-vip-starter]
    paths: [.github/workflows/inspect-hoang-vip.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/hoang-vip-starter
          fetch-depth: 0
      - name: Inspect starter item APIs
        shell: bash
        run: |
          set -euo pipefail
          J="$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          rm -rf /tmp/nsoinspect && mkdir -p /tmp/nsoinspect && cd /tmp/nsoinspect
          jar tf "$J" | grep '\.class$' | sed 's/\.class$//' > classes.txt
          javap -classpath "$J" -p -c DoHoang091 > do.txt
          javap -classpath "$J" -p -c 'DoHoang091$k0' > k0.txt
          javap -classpath "$J" -p -c NativeCatalog > native.txt 2>/dev/null || true
          javap -classpath "$J" -p -c NativeItemReceiver > recv.txt 2>/dev/null || true
          javap -classpath "$J" -p -c ManualItemReceiver > manual.txt 2>/dev/null || true
          {
            echo '=== HOANG CREATION ==='
            grep -n -B30 -A100 'String hoang' do.txt || true
            echo '=== CLASS MAP ==='
            grep -n -A80 -B3 'static java.lang.String a(byte)' do.txt || true
            echo '=== K0 CTOR ==='
            grep -n -A1200 'DoHoang091\$k0(java.lang.String, byte, short, int)' k0.txt || true
            echo '=== NATIVE CATALOG ==='
            cat native.txt
            echo '=== RECEIVER CANDIDATES ==='
            cat recv.txt manual.txt
            echo '=== CLASSES REFERENCING GIVE/RECEIVE STRINGS ==='
            for c in $(cat classes.txt); do
              out=$(javap -classpath "$J" -p -verbose "$c" 2>/dev/null | grep -i -E 'Nhận|ID vật phẩm|số lượng|nâng cấp|nhận item|receive' || true)
              [ -z "$out" ] || { echo "##### $c #####"; echo "$out"; }
            done
            echo '=== DO METHODS USING EQUIP ARRAYS ==='
            grep -n -B20 -A80 -E 'Field DoHoang091\$k0\.(T|U|V|W|X|Y|Z|aa|ab):' do.txt || true
            echo '=== LEVEL FIELD r USES ==='
            grep -n -B30 -A70 'Field DoHoang091\$k0.r:I' do.txt || true
          } > "$GITHUB_WORKSPACE/hoang_vip_inspect.txt"
          cd "$GITHUB_WORKSPACE"
          git add -- hoang_vip_inspect.txt
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: inspect hoang starter item APIs'
          git push origin HEAD:chatgpt/hoang-vip-starter
