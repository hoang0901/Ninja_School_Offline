name: Temporary audit fake class menu
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-audit-fake-class-menu.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted menu/class audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fakeaudit && mkdir -p /tmp/fakeaudit && cd /tmp/fakeaudit
          jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar"
          javap -classpath . -p -c OfflineDeleteMenu > "$GITHUB_WORKSPACE/audit_offline_delete_menu.txt" 2>&1 || true
          javap -classpath . -p -c OfflineBridge > "$GITHUB_WORKSPACE/audit_offline_bridge.txt" 2>&1 || true
          javap -classpath . -p -c dt > /tmp/dt.txt 2>&1 || true
          grep -n -B70 -A120 -E 'OfflineDeleteMenu|offlineReceive|Menu|menu' /tmp/dt.txt > "$GITHUB_WORKSPACE/audit_dt_menu.txt" || true
          javap -classpath . -p -c k1d > /tmp/k1d.txt 2>&1 || true
          grep -n -B70 -A140 -E 'NPC menu/action mismatch|Ninja (Cung|Ki|Kunai|Phi|Qu)|Menu|menu|phái|phai' /tmp/k1d.txt > "$GITHUB_WORKSPACE/audit_k1d_menu.txt" || true
          javap -classpath . -p -c DoHoang091 > /tmp/main.txt 2>&1 || true
          grep -n -B70 -A140 -E 'Ninja Cung|Ninja Ki|Ninja Kunai|Ninja Phi|Ninja Qu|Ninja ' /tmp/main.txt > "$GITHUB_WORKSPACE/audit_class_names.txt" || true
          javap -classpath . -p -c k25 > /tmp/k25.txt 2>&1 || true
          grep -n -B90 -A180 'getstatic.*Field e:\[I' /tmp/k25.txt > "$GITHUB_WORKSPACE/audit_k25_class_select.txt" || true
          grep -n -B80 -A140 'Field DoHoang091\$k0\.' /tmp/k25.txt | head -1200 > "$GITHUB_WORKSPACE/audit_k25_player_fields.txt" || true
      - name: Commit targeted reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_offline_delete_menu.txt audit_offline_bridge.txt audit_dt_menu.txt audit_k1d_menu.txt audit_class_names.txt audit_k25_class_select.txt audit_k25_player_fields.txt
          git commit -m "chore: inspect offline fake class integration"
          git push
