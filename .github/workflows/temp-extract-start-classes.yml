name: Extract startup classes
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-extract-start-classes.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract classes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/startx && mkdir -p /tmp/startx/out
          cd /tmp/startx
          cp "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" game.jar
          curl -fsSL -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          java -jar cfr.jar game.jar --outputdir out >/dev/null 2>&1 || true
          git worktree add /tmp/feature origin/chatgpt/save-menu-redesign
          mkdir -p /tmp/feature/start_flow_inspect
          for f in Class_da.java Class_do.java; do [ -f "out/$f" ] && cp "out/$f" "/tmp/feature/start_flow_inspect/$f"; done
          cd /tmp/feature
          git add -- start_flow_inspect/Class_da.java start_flow_inspect/Class_do.java 2>/dev/null || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: extract startup classes' || true
          git push origin HEAD:chatgpt/save-menu-redesign
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git checkout main
          git pull --ff-only origin main || true
          git rm -f .github/workflows/temp-extract-start-classes.yml .github/workflows/temp-inspect-start-flow.yml 2>/dev/null || true
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'chore: remove startup extractors' || true
          git push origin main || true
