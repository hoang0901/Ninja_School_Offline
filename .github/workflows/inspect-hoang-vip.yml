name: Build hoang vip starter
on:
  push:
    branches: [chatgpt/hoang-vip-starter]
    paths: [.github/workflows/inspect-hoang-vip.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/hoang-vip-starter
          fetch-depth: 0
      - name: Patch hoang starter
        shell: bash
        run: |
          set -euo pipefail
          echo trigger-2
          cat > /tmp/PatchHoangVip.java <<'JAVA'
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;
          import jdk.internal.org.objectweb.asm.*;
          import jdk.internal.org.objectweb.asm.tree.*;
          public class PatchHoangVip implements Opcodes {
            static final String OWNER="DoHoang091", K0="DoHoang091$k0";
            public static void main(String[] args) throws Exception {
              Path cls=Paths.get(args[0]); ClassNode cn=new ClassNode(); new ClassReader(Files.readAllBytes(cls)).accept(cn,0);
              cn.methods.removeIf(m->m.name.equals("zHoangVipStarter")&&m.desc.equals("()V"));
              MethodNode h=new MethodNode(ACC_PRIVATE|ACC_STATIC,"zHoangVipStarter","()V",null,null); InsnList x=h.instructions;
              LabelNode ret=new LabelNode(), loop=new LabelNode(), next=new LabelNode(), useExisting=new LabelNode(), afterSeed=new LabelNode();
              x.add(new FieldInsnNode(GETSTATIC,OWNER,"as","[B")); x.add(new JumpInsnNode(IFNONNULL,ret));
              x.add(new FieldInsnNode(GETSTATIC,OWNER,"aj","[L"+K0+";")); x.add(new JumpInsnNode(IFNULL,ret));
              x.add(new InsnNode(ICONST_0)); x.add(new VarInsnNode(ISTORE,0)); x.add(loop);
              x.add(new VarInsnNode(ILOAD,0)); x.add(new FieldInsnNode(GETSTATIC,OWNER,"aj","[L"+K0+";")); x.add(new InsnNode(ARRAYLENGTH)); x.add(new JumpInsnNode(IF_ICMPGE,ret));
              x.add(new FieldInsnNode(GETSTATIC,OWNER,"aj","[L"+K0+";")); x.add(new VarInsnNode(ILOAD,0)); x.add(new InsnNode(AALOAD)); x.add(new VarInsnNode(ASTORE,1));
              x.add(new VarInsnNode(ALOAD,1)); x.add(new JumpInsnNode(IFNULL,next)); x.add(new VarInsnNode(ALOAD,1)); x.add(new FieldInsnNode(GETFIELD,K0,"a","Ljava/lang/String;")); x.add(new JumpInsnNode(IFNULL,next));
              x.add(new LdcInsnNode("hoang")); x.add(new VarInsnNode(ALOAD,1)); x.add(new FieldInsnNode(GETFIELD,K0,"a","Ljava/lang/String;")); x.add(new MethodInsnNode(INVOKEVIRTUAL,"java/lang/String","equalsIgnoreCase","(Ljava/lang/String;)Z",false)); x.add(new JumpInsnNode(IFEQ,next));
              x.add(new VarInsnNode(ALOAD,1)); x.add(new FieldInsnNode(GETFIELD,K0,"r","I")); x.add(new IntInsnNode(SIPUSH,130)); x.add(new JumpInsnNode(IF_ICMPGE,ret));
              x.add(new MethodInsnNode(INVOKESTATIC,OWNER,"ar","()L"+K0+";",false)); x.add(new VarInsnNode(ASTORE,2)); x.add(new VarInsnNode(ALOAD,2)); x.add(new JumpInsnNode(IFNULL,useExisting)); x.add(new VarInsnNode(ALOAD,2)); x.add(new VarInsnNode(ASTORE,1)); x.add(new JumpInsnNode(GOTO,afterSeed)); x.add(useExisting); x.add(afterSeed);
              x.add(new VarInsnNode(ALOAD,1)); x.add(new InsnNode(ICONST_1)); x.add(new FieldInsnNode(PUTFIELD,K0,"p","B"));
              x.add(new VarInsnNode(ALOAD,1)); x.add(new InsnNode(ICONST_2)); x.add(new FieldInsnNode(PUTFIELD,K0,"q","S"));
              x.add(new VarInsnNode(ALOAD,1)); x.add(new IntInsnNode(SIPUSH,130)); x.add(new FieldInsnNode(PUTFIELD,K0,"r","I"));
              x.add(new VarInsnNode(ALOAD,1)); x.add(new MethodInsnNode(INVOKESTATIC,OWNER,"l","(L"+K0+";)V",false));
              x.add(new FieldInsnNode(GETSTATIC,OWNER,"aj","[L"+K0+";")); x.add(new VarInsnNode(ILOAD,0)); x.add(new VarInsnNode(ALOAD,1)); x.add(new InsnNode(AASTORE));
              x.add(new InsnNode(ICONST_1)); x.add(new FieldInsnNode(PUTSTATIC,OWNER,"an","Z")); x.add(new MethodInsnNode(INVOKESTATIC,OWNER,"as","()V",false)); x.add(new JumpInsnNode(GOTO,ret));
              x.add(next); x.add(new IincInsnNode(0,1)); x.add(new JumpInsnNode(GOTO,loop)); x.add(ret); x.add(new InsnNode(RETURN)); h.maxLocals=3; h.maxStack=4; cn.methods.add(h);
              boolean ok=false; for(MethodNode m:cn.methods) if(m.name.equals("an")&&m.desc.equals("()V")){List<AbstractInsnNode> rs=new ArrayList<>(); for(AbstractInsnNode n=m.instructions.getFirst();n!=null;n=n.getNext()) if(n.getOpcode()==RETURN) rs.add(n); for(AbstractInsnNode r:rs)m.instructions.insertBefore(r,new MethodInsnNode(INVOKESTATIC,OWNER,"zHoangVipStarter","()V",false)); ok=!rs.isEmpty();}
              if(!ok) throw new IllegalStateException("an() not found"); ClassWriter cw=new ClassWriter(ClassWriter.COMPUTE_MAXS); cn.accept(cw); Files.write(cls,cw.toByteArray());
            }
          }
          JAVA
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED /tmp/PatchHoangVip.java
          rm -rf /tmp/jarpatch && mkdir /tmp/jarpatch && cd /tmp/jarpatch
          jar xf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" DoHoang091.class
          java --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED -cp /tmp PatchHoangVip DoHoang091.class
          jar uf "$GITHUB_WORKSPACE/Nso_Offline_By_h0901.jar" DoHoang091.class
          cd "$GITHUB_WORKSPACE"
          javap -classpath Nso_Offline_By_h0901.jar -p -c DoHoang091 > /tmp/verify.txt
          grep -q 'zHoangVipStarter' /tmp/verify.txt
          grep -A180 'zHoangVipStarter' /tmp/verify.txt | grep -q 'sipush        130'
          grep -A80 'static java.lang.String a(byte)' /tmp/verify.txt | grep -q 'Ninja Kiếm'
          git add -- Nso_Offline_By_h0901.jar
          git -c user.name='ChatGPT' -c user.email='actions@github.com' commit -m 'feat: make hoang a max-level sword VIP starter'
          git push origin HEAD:chatgpt/hoang-vip-starter
